<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>親師聯絡簿 v10 Professional</title>
<link rel="manifest" href="manifest.webmanifest">

<style>
:root{
  --ink:#143650;--muted:#69808f;--blue:#2589c5;--aqua:#36b7c9;--mint:#51b99b;
  --bg:#edf8fd;--paper:#fff;--line:#d9e9f1;--warn:#fff7e4;--safe:#edf9f4;
  --shadow:0 14px 35px rgba(31,99,133,.13);--radius:22px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:13px}
.btn{border:0;border-radius:14px;padding:11px 16px;background:linear-gradient(135deg,var(--blue),var(--aqua));color:#fff;font-weight:800}
.btn.secondary{background:#eef8fc;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#fff1f1;color:#a33d3d;border:1px solid #f2cccc}
.btn:disabled{opacity:.55;cursor:not-allowed}
.card{background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.94);border-radius:var(--radius);box-shadow:var(--shadow)}
.field{display:grid;gap:7px;margin:11px 0}.field label{font-weight:800}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px 12px;background:#fff;color:var(--ink)}
textarea{min-height:115px;resize:vertical}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;padding:5px 10px;border-radius:999px;background:#e8f6fb;font-size:12px}
.badge.good{background:#e9f8ef;color:#28734c}.badge.warn{background:#fff3d9;color:#8f6108}
.safe-box{padding:13px;border:1px solid #c4e7d5;background:var(--safe);border-radius:14px}
.risk-box{padding:13px;border:1px solid #eed89f;background:var(--warn);border-radius:14px}
.list{display:grid;gap:10px}.list-item{padding:13px;border:1px solid var(--line);border-radius:15px;background:#fbfdff}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.columns{display:grid;grid-template-columns:1.15fr 1fr;gap:18px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.stat{padding:16px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#fff,#f4fbfe)}
.stat span{font-size:13px;color:var(--muted)}.stat b{display:block;font-size:28px;margin-top:4px}
.quick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.quick{border:1px solid var(--line);border-radius:17px;background:#fff;padding:18px 10px;text-align:center;color:var(--ink)}
.quick strong{display:block;margin-top:7px}
.panel{padding:22px;margin-bottom:18px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}
.panel-head h2,.panel-head h3{margin:0}
.subject-chips{display:flex;gap:8px;flex-wrap:wrap}.subject-chip{padding:8px 12px;border-radius:999px;background:#eaf6fb;border:1px solid var(--line)}
.option-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.option-card{border:1px solid var(--line);border-radius:15px;padding:12px;background:#fff}
.option-card label{display:flex;gap:8px;align-items:flex-start;font-weight:800}
.option-card input{width:auto;margin-top:4px}
.phrase-list{display:grid;gap:7px;margin-top:9px;padding-left:4px}
.phrase-list label{font-weight:400;display:flex;gap:8px}
.phrase-list input{width:auto}
.timeline{display:grid;gap:9px}.timeline-item{display:grid;grid-template-columns:75px 1fr;gap:10px;padding:10px;border-left:4px solid #75cddd;background:#f8fcfe;border-radius:0 13px 13px 0}
.file-preview{margin-top:10px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fbfdff}
.file-preview iframe{width:100%;height:520px;border:0;border-radius:10px;background:#fff}
.file-preview img{max-width:100%;max-height:500px;border-radius:10px;display:block;margin:auto}
.attachment-row{display:flex;gap:8px;justify-content:space-between;align-items:center}
.signature{margin-top:22px;text-align:right;color:#4f7188;font-size:13px}
.signature em{display:block;font-size:27px;font-family:"Brush Script MT","Segoe Script","Apple Chancery",cursive;font-style:italic;color:#176f91;line-height:1.05}

/* Original cover: never cropped, recolored, decorated, or overwritten. */
.login-screen{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(360px,.75fr);background:#eaf5fb}
.cover-pane{min-height:100vh;background:#eaf5fb url("cover-clean.jpg") center/contain no-repeat}
.login-pane{display:grid;place-items:center;padding:28px;background:#f6fbfe}
.login-box{width:min(480px,100%);padding:30px}
.brand-title{font-size:32px;margin:0 0 8px}.login-tabs{display:flex;gap:8px;background:#eaf5fa;padding:5px;border-radius:15px;margin:20px 0}
.login-tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:11px;color:var(--ink)}
.login-tabs button.on{background:#fff;box-shadow:0 5px 14px rgba(22,75,105,.1);font-weight:800}

.app{min-height:100vh;display:grid;grid-template-columns:235px 1fr}
.sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(#f9fdff,#eaf7fd);border-right:1px solid var(--line);padding:17px 12px;overflow:auto}
.side-brand{padding:12px 14px 18px;font-size:23px;font-weight:900}
.side-sign{padding:5px 14px 15px;font-family:"Brush Script MT","Segoe Script",cursive;font-size:22px;font-style:italic;color:#167697}
.nav-btn{width:100%;border:0;background:transparent;border-radius:13px;padding:11px 12px;text-align:left;margin:3px 0;color:var(--ink)}
.nav-btn:hover,.nav-btn.on{background:#dff2fb;color:#166c9b;font-weight:900}
.main{min-width:0}
.ocean-header{position:relative;overflow:hidden;min-height:218px;padding:24px 28px;background:
radial-gradient(circle at 12% 18%,rgba(255,255,255,.85) 0 9px,transparent 10px),
radial-gradient(circle at 31% 38%,rgba(255,255,255,.7) 0 15px,transparent 16px),
radial-gradient(circle at 73% 20%,rgba(255,255,255,.75) 0 22px,transparent 23px),
linear-gradient(180deg,#dff5ff 0%,#bfeafa 52%,#84d0e5 100%)}
.ocean-header:after{content:"";position:absolute;left:-5%;right:-5%;bottom:-36px;height:100px;background:rgba(255,255,255,.78);border-radius:50% 45% 0 0/40% 35% 0 0;transform:rotate(-2deg)}
.header-row{position:relative;z-index:2;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.header-tools{display:flex;gap:10px;align-items:center}
.sync{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border-radius:999px;background:#ffffffcf;color:#27806a;font-weight:800;margin-top:8px}
.class-title{position:relative;z-index:2;margin-top:34px}.class-title h1{font-size:35px;margin:0 0 7px}
.content{padding:0 24px 42px;position:relative;margin-top:-24px;z-index:4}
.bottom-nav{display:none}

@media(max-width:1100px){
 .stats,.quick-grid{grid-template-columns:repeat(3,1fr)}
 .columns{grid-template-columns:1fr}
 .option-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:820px){
 .login-screen{display:block}.cover-pane{min-height:48vh;background-position:center top}.login-pane{padding:15px;display:block}.login-box{margin:auto;padding:22px}
 .app{display:block}.sidebar{display:none}.content{padding:0 12px 90px}.ocean-header{min-height:190px;padding:18px}
 .header-row{display:block}.header-tools{margin-top:9px}.class-title h1{font-size:28px}
 .stats,.quick-grid,.option-grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}
 .bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:60}
 .bottom-nav button{border:0;background:#fff;padding:10px 3px;color:var(--ink);font-size:12px}
}
@media(max-width:480px){.stats,.quick-grid,.option-grid{grid-template-columns:1fr}.panel{padding:17px}}
</style>
</head>
<body>

<section id="loginScreen" class="login-screen">
  <div class="cover-pane" aria-label="原始親師聯絡簿封面"></div>
  <div class="login-pane">
    <div class="card login-box">
      <h1 class="brand-title">親師聯絡簿</h1>
      <p class="muted">用心陪伴・溫暖支持・一起陪伴孩子成長</p>
      <div class="login-tabs">
        <button id="teacherTab" class="on" onclick="switchLogin('teacher')">教師登入</button>
        <button id="parentTab" onclick="switchLogin('parent')">家長登入</button>
      </div>
      <div id="teacherLogin">
        <button class="btn" style="width:100%;margin-bottom:10px" onclick="googleLogin()">使用 Google 帳號登入</button>
        <button class="btn secondary" style="width:100%" onclick="visitorLogin()">訪客體驗</button>
      </div>
      <div id="parentLogin" class="hidden">
        <div class="field"><label>家長帳號</label><input id="parentAccount" placeholder="例如：70601"></div>
        <div class="field"><label>密碼</label><input id="parentPassword" type="password"></div>
        <button class="btn" style="width:100%" onclick="parentSignIn()">登入查看</button>
      </div>
      <div class="signature">Designed by <em>Meng</em></div>
    </div>
  </div>
</section>

<section id="teacherApp" class="app hidden">
  <aside class="sidebar">
    <div class="side-brand">親師聯絡簿</div>
    <div class="side-sign">Meng</div>
    <button class="nav-btn on" data-page="dashboard" onclick="go('dashboard')">首頁</button>
    <button class="nav-btn" data-page="daily" onclick="go('daily')">今日聯絡簿</button>
    <button class="nav-btn" data-page="classes" onclick="go('classes')">班級／學年度</button>
    <button class="nav-btn" data-page="students" onclick="go('students')">學生與家長資料</button>
    <button class="nav-btn" data-page="studentDetail" onclick="go('studentDetail')">學生個別頁面</button>
    <button class="nav-btn" data-page="announcements" onclick="go('announcements')">統一／個別公告</button>
    <button class="nav-btn" data-page="parents" onclick="go('parents')">家長留言</button>
    <button class="nav-btn" data-page="preview" onclick="go('preview')">家長預覽區</button>
    <button class="nav-btn" data-page="subjects" onclick="go('subjects')">科別管理</button>
    <button class="nav-btn" data-page="reports" onclick="go('reports')">Excel 匯入／匯出</button>
    <button class="nav-btn" data-page="settings" onclick="go('settings')">設定</button>
    <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
    <button class="nav-btn" onclick="logout()">登出</button>
  </aside>

  <main class="main">
    <header class="ocean-header">
      <div class="header-row">
        <div>
          <select id="classSelect" onchange="changeClass()" style="min-width:280px"></select>
          <div id="syncBadge" class="sync">💾 訪客模式・本機儲存</div>
        </div>
        <div class="header-tools">
          <button class="btn secondary" onclick="searchStudent()">搜尋學生</button>
          <button class="btn secondary" onclick="logout()">登出</button>
        </div>
      </div>
      <div class="class-title">
        <div id="greeting" class="muted">Meng老師，您好！</div>
        <h1 id="className">706班（六出奇技）</h1>
        <div id="schoolYear">115學年度</div>
      </div>
    </header>

    <div class="content">
      <section id="dashboard" class="page"></section>
      <section id="daily" class="page hidden"></section>
      <section id="classes" class="page hidden"></section>
      <section id="students" class="page hidden"></section>
      <section id="studentDetail" class="page hidden"></section>
      <section id="announcements" class="page hidden"></section>
      <section id="parents" class="page hidden"></section>
      <section id="preview" class="page hidden"></section>
      <section id="subjects" class="page hidden"></section>
      <section id="reports" class="page hidden"></section>
      <section id="settings" class="page hidden"></section>
    </div>
  </main>

  <nav class="bottom-nav">
    <button onclick="go('dashboard')">首頁</button>
    <button onclick="go('daily')">今日</button>
    <button onclick="go('students')">學生</button>
    <button onclick="go('announcements')">公告</button>
    <button onclick="go('reports')">匯出</button>
  </nav>
</section>

<section id="parentApp" class="hidden" style="min-height:100vh;padding:18px;background:#edf8fd">
  <div style="max-width:780px;margin:auto">
    <div class="card panel">
      <div class="panel-head"><h2>家長專區</h2><button class="btn secondary" onclick="logout()">登出</button></div>
      <div id="parentContent"></div>
    </div>
  </div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBNr-1S-xSeDvESdq3tYbWjIQ8pmgOjpd8",
  authDomain:"parent-contact-book.firebaseapp.com",
  projectId:"parent-contact-book",
  storageBucket:"parent-contact-book.firebasestorage.app",
  messagingSenderId:"241202878085",
  appId:"1:241202878085:web:fb598315e315aa33cbbbec"
};
let app,auth,db;
try{app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app)}catch(e){console.warn(e)}

const defaultSubjects=["國文","英語","數學","自然","社會","健康與體育","音樂","視覺藝術","表演藝術","資訊科技","生活科技","輔導","家政","童軍","班級事務","導師時間"];
const behaviorCatalog={
 "上課說話":[
  "今日課堂中曾有與同學交談的情形，老師已於當下提醒。",
  "今日課堂中偶有與同學交談，經提醒後已能逐步回到課程活動。",

  "建議持續練習在適當時間進行交談，以維持課堂專注。"
 ],
 "作業未完成":[
  "今日作業尚未於規定時間內完成。",
  "老師已提醒利用可運用的時間補齊作業。",
  "敬請家長協助確認後續完成與繳交情形。"
 ],
 "未帶課本／用品":[
  "今日課程所需用品尚未備妥，老師已協助孩子參與課程。",
  "已提醒孩子於下次上課前確認所需用品。",
  "敬請家長協助留意攜帶情形。"
 ],
 "精神不濟":[

 ],
 "注意力較分散":[
  "今日課堂中專注情形偶有中斷，老師已適時提醒。",

  "後續將持續協助孩子建立較穩定的課堂專注習慣。"
 ],
 "使用手機":[
  "今日課程進行期間曾使用手機，老師已依班級規範提醒。",
  "提醒後已將手機收妥並回到課程活動。",
  "敬請家長共同協助提醒課堂期間的手機使用規範。"
 ],
 "人際互動需引導":[
  "今日與同學互動時曾出現意見不同的情形。",
  "老師已陪同釐清事件並引導使用合宜方式表達。",
  "目前已能回到原有的課程或班級活動。"
 ],
 "未遵守課堂規範":[
  "今日課堂中曾有未依課程指示進行的情形，老師已適時提醒。",

  "後續將持續引導孩子熟悉並遵守課堂規範。"

 "主動回答":[

 "積極參與":[
  "今日能投入課程活動，並依照指示完成任務，值得鼓勵。",
  "今日參與情形穩定，能持續投入學習活動。"
 ],
 "熱心協助":[
  "今日能主動協助同學或班級事務，展現關懷與責任感。",
  "今日在團體活動中願意提供協助，值得肯定。"
 ],
 "表現良好":[
  "孩子今日整體表現穩定，能依照班級與課堂規範完成活動。",
  "今日在學習與生活常規方面都有良好表現，值得鼓勵。"
 ]
};
const riskyWords=["很懶","很皮","沒家教","故意","問題學生","態度很差","白目","愛找麻煩","很糟糕","不受教","沒禮貌","笨","散漫","一直","故意搗蛋"];

const defaultData={
 version:"10.0",
 classes:[{id:"c706",schoolYear:115,grade:7,classNo:6,name:"六出奇技",teacher:"Meng",status:"active"}],
 currentClassId:"c706",
 subjects:defaultSubjects.map((name,i)=>({id:"s"+i,name,enabled:true,custom:false})),
 students:[
  {id:"stu1",classId:"c706",seat:1,name:"王小明",studentNo:"",gender:"",birthday:"",phone:"",address:"",parentName:"王媽媽",parentPhone:"",parentAddress:"",account:"70601",password:"123456",advancement:"高中",notes:""},
  {id:"stu2",classId:"c706",seat:2,name:"李小華",studentNo:"",gender:"",birthday:"",phone:"",address:"",parentName:"李爸爸",parentPhone:"",parentAddress:"",account:"70602",password:"123456",advancement:"高職",notes:""}
 ],
 attendance:[],
 notices:[],
 announcements:[],
 parentMessages:[],
 settings:{teacherName:"Meng",positiveReminder:true}
};

function migrate(){
 let d=null;
 for(const key of ["pcb_v10_data","pcb_v9_2_data","pcb_v9_data"]){
  try{const x=JSON.parse(localStorage.getItem(key)||"null");if(x){d=x;break}}catch(e){}
 }
 d=d||structuredClone(defaultData);
 d.version="10.0";d.classes ||= defaultData.classes;d.currentClassId ||= d.classes[0]?.id;
 d.subjects ||= defaultData.subjects;d.students ||= [];d.attendance ||= [];d.notices ||= [];d.announcements ||= [];d.parentMessages ||= [];
 d.settings ||= structuredClone(defaultData.settings);
 d.notices.forEach(n=>{n.readBy ||= [];n.kind ||= n.target==="class"?"class":"individual"});
 d.announcements.forEach(a=>{a.readBy ||= [];a.attachments ||= []});
 return d;
}
let data=migrate(),mode="visitor",uid=null,currentParent=null,selectedStudentId=null,announcementLinks=[];

function save(){
 localStorage.setItem("pcb_v10_data",JSON.stringify(data));
 if(mode==="cloud"&&uid&&db)setDoc(doc(db,"teachers",uid,"appData","contactBookV10"),data,{merge:true}).catch(console.error);
 renderAll();
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function currentClass(){return data.classes.find(c=>c.id===data.currentClassId)||data.classes.find(c=>c.status!=="graduated")||data.classes[0]}
function classStudents(){return data.students.filter(s=>s.classId===data.currentClassId).sort((a,b)=>Number(a.seat)-Number(b.seat))}
function studentById(id){return data.students.find(s=>s.id===id)}
function isoToday(){return new Date().toISOString().slice(0,10)}
function nowText(){return new Date().toLocaleString("zh-TW")}
function csvSafe(v){return String(v??"")}
function switchLogin(type){
 teacherLogin.classList.toggle("hidden",type!=="teacher");parentLogin.classList.toggle("hidden",type!=="parent");
 teacherTab.classList.toggle("on",type==="teacher");parentTab.classList.toggle("on",type==="parent");
}
window.switchLogin=switchLogin;
window.visitorLogin=()=>{mode="visitor";enterTeacher()};
window.googleLogin=async()=>{
 try{
  const result=await signInWithPopup(auth,new GoogleAuthProvider());uid=result.user.uid;mode="cloud";
  const snap=await getDoc(doc(db,"teachers",uid,"appData","contactBookV10"));
  if(snap.exists())data=snap.data();else await setDoc(doc(db,"teachers",uid,"appData","contactBookV10"),data);
  enterTeacher();
 }catch(e){alert("Google 登入失敗："+e.message)}
};
function enterTeacher(){loginScreen.classList.add("hidden");parentApp.classList.add("hidden");teacherApp.classList.remove("hidden");renderAll()}
window.parentSignIn=()=>{

}
function studentTimeline(id){
 const att=data.attendance.filter(a=>a.studentId===id).map(a=>({date:a.date,text:`出缺勤｜${a.status}${a.leaveType?`｜${a.leaveType}`:""}${a.arrivalTime?`｜到校 ${a.arrivalTime}`:""}${a.leaveTime?`｜離校／請假 ${a.leaveTime}`:""}`}));
 const ns=data.notices.filter(n=>n.target===id).map(n=>({date:n.date,text:`${n.teacherOnly?"教師紀錄":"家長聯絡"}｜${n.subject}｜${n.body}`}));
 return [...att,...ns].sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(x=>`<div class="list-item"><b>${esc(x.date)}</b><div>${esc(x.text)}</div></div>`).join("");
}

function renderAnnouncements(){
 announcements.innerHTML=`<div class="card panel"><div class="panel-head"><h2>統一公告與個別公告</h2><span class="badge good">Google Drive 免費附件模式</span></div>
 <div class="form-grid"><div class="field"><label>公告範圍</label><select id="announcementTarget"><option value="all">統一公告（本班所有家長）</option>${classStudents().map(s=>`<option value="${s.id}">個別公告：${s.seat}號 ${esc(s.name)}</option>`).join("")}</select></div><div class="field"><label>重要程度</label><select id="announcementLevel"><option>一般</option><option>重要</option><option>緊急</option></select></div></div>
 <div class="field"><label>公告內容</label><textarea id="announcementBody"></textarea></div>
 <div class="card panel" style="box-shadow:none;background:#f8fcfe"><div class="panel-head"><h3>Google Drive 附件</h3><button class="btn secondary" onclick="addDriveLinkRow()">＋新增附件</button></div><div class="safe-box">請先將 Google Drive 權限設為「知道連結的任何人皆可查看」。</div><div id="driveLinkRows" class="list" style="margin-top:12px"></div></div>
 <button class="btn" onclick="publishAnnouncement()">發布公告</button>
 <div class="list" style="margin-top:18px">${data.announcements.map(a=>`<div class="list-item"><b>${a.target==="all"?"統一公告":"個別公告"}｜${esc(a.level)}</b><div>${esc(a.text)}</div><div class="small muted">${esc(a.date)}</div>${renderAttachments(a.attachments||[],a.id,"teacher")}</div>`).join("")||'<div class="muted">尚無公告</div>'}</div></div>`;
 if(!announcementLinks.length)announcementLinks=[{name:"",url:"",type:"auto"}];renderDriveRows();setTimeout(()=>hydrateAttachments("teacher"),0);
}
function renderDriveRows(){const box=document.getElementById("driveLinkRows");if(!box)return;box.innerHTML=announcementLinks.map((x,i)=>`<div class="list-item"><div class="form-grid"><div class="field"><label>附件名稱</label><input value="${esc(x.name)}" oninput="announcementLinks[${i}].name=this.value"></div><div class="field"><label>類型</label><select onchange="announcementLinks[${i}].type=this.value"><option value="auto">自動判斷</option><option value="pdf">PDF</option><option value="word">Word</option><option value="image">圖片</option><option value="excel">Excel</option><option value="video">影片</option><option value="audio">音樂</option><option value="other">其他</option></select></div></div><div class="field"><label>Google Drive 分享連結</label><input value="${esc(x.url)}" oninput="announcementLinks[${i}].url=this.value" placeholder="https://drive.google.com/..."></div><button class="btn danger" onclick="removeDriveLinkRow(${i})">移除</button></div>`).join("")}
window.addDriveLinkRow=()=>{announcementLinks.push({name:"",url:"",type:"auto"});renderDriveRows()};
window.removeDriveLinkRow=i=>{announcementLinks.splice(i,1);if(!announcementLinks.length)announcementLinks=[{name:"",url:"",type:"auto"}];renderDriveRows()};
function driveId(url){for(const p of [/\/file\/d\/([\w-]+)/,/[?&]id=([\w-]+)/,/\/document\/d\/([\w-]+)/,/\/spreadsheets\/d\/([\w-]+)/,/\/presentation\/d\/([\w-]+)/]){const m=String(url).match(p);if(m)return m[1]}return""}
function drivePreview(url){const id=driveId(url);return id?`https://drive.google.com/file/d/${id}/preview`:url}
function driveOpen(url){const id=driveId(url);return id?`https://drive.google.com/open?id=${id}`:url}
function inferType(name,url,manual){if(manual&&manual!=="auto")return manual;const s=(name+" "+url).toLowerCase();if(s.includes(".pdf"))return"pdf";if(/\.(doc|docx)/.test(s))return"word";if(/\.(png|jpg|jpeg|gif|webp)/.test(s))return"image";if(/\.(xls|xlsx|csv)/.test(s))return"excel";if(/\.(mp4|mov|webm)/.test(s))return"video";if(/\.(mp3|wav|m4a)/.test(s))return"audio";return"other"}
window.publishAnnouncement=()=>{const t=announcementBody.value.trim();const attachments=announcementLinks.filter(x=>x.url.trim()).map(x=>({name:x.name.trim()||"Google Drive 附件",url:x.url.trim(),openUrl:driveOpen(x.url.trim()),previewUrl:drivePreview(x.url.trim()),type:inferType(x.name,x.url,x.type)}));if(!t&&!attachments.length)return alert("請輸入公告內容或加入附件");data.announcements.unshift({id:"a"+Date.now(),classId:data.currentClassId,target:announcementTarget.value,level:announcementLevel.value,text:t,date:nowText(),readBy:[],attachments});announcementLinks=[{name:"",url:"",type:"auto"}];save();alert("公告已發布")};
function renderAttachments(files,id,scope){if(!files.length)return"";return `<div>${files.map((f,i)=>`<div class="file-preview"><div class="attachment-row"><b>${esc(f.name)}</b><a class="btn secondary" href="${esc(f.openUrl||f.url)}" target="_blank">在 Google Drive 開啟</a></div><div class="attachment-target" data-key="${scope}-${id}-${i}" data-preview="${esc(f.previewUrl||f.url)}" data-name="${esc(f.name)}"></div></div>`).join("")}</div>`}
function hydrateAttachments(scope){document.querySelectorAll(`.attachment-target[data-key^="${scope}-"]`).forEach(box=>{box.innerHTML=`<iframe src="${box.dataset.preview}" title="${esc(box.dataset.name)}"></iframe>`})}

function renderParents(){parents.innerHTML=`<div class="card panel"><div class="panel-head"><h2>家長留言</h2></div><div class="list">${data.parentMessages.map(m=>`<div class="list-item"><b>${esc(m.studentName)}</b><div>${esc(m.text)}</div><div class="small muted">${esc(m.date)}</div>${m.needReply?'<span class="badge warn">需要老師回覆</span>':""}</div>`).join("")||'<div class="muted">目前沒有留言</div>'}</div></div>`}
function renderPreview(){
 const ss=classStudents();preview.innerHTML=`<div class="card panel"><div class="panel-head"><h2>家長預覽區</h2><select id="previewStudent" onchange="renderPreviewCard(this.value)">${ss.map(s=>`<option value="${s.id}">${s.seat}號 ${esc(s.name)}</option>`).join("")}</select></div><div id="previewCard"></div></div>`;
 if(ss[0])setTimeout(()=>renderPreviewCard(ss[0].id),0);
}
window.renderPreviewCard=id=>{const s=studentById(id);if(!s)return;const anns=data.announcements.filter(a=>a.classId===s.classId&&(a.target==="all"||a.target===id));const ns=data.notices.filter(n=>n.classId===s.classId&&!n.teacherOnly&&(n.target==="class"||n.target===id));previewCard.innerHTML=`<div class="safe-box"><b>這是家長畫面預覽，不會真的勾選閱覽。</b></div><h3>${s.seat}號 ${esc(s.name)}家長</h3><h4>公告</h4><div class="list">${anns.map(a=>`<div class="list-item"><b>${esc(a.level)}</b><div>${esc(a.text)}</div>${renderAttachments(a.attachments||[],a.id,"preview")}<label><input type="checkbox" disabled> 我已閱畢</label></div>`).join("")||'<div class="muted">無公告</div>'}</div><h4>今日聯絡事項</h4><div class="list">${ns.map(n=>`<div class="list-item"><span class="badge">${esc(n.subject)}</span><div>${esc(n.body)}</div><label><input type="checkbox" disabled> 我已閱畢</label></div>`).join("")||'<div class="muted">無聯絡事項</div>'}</div>`;setTimeout(()=>hydrateAttachments("preview"),0)};

function renderSubjects(){subjects.innerHTML=`<div class="card panel"><div class="panel-head"><h2>科別管理</h2><button class="btn" onclick="addSubject()">＋自訂科別</button></div><div class="subject-chips">${data.subjects.map(s=>`<span class="subject-chip">${esc(s.name)} ${s.custom?"（自訂）":""}<input type="checkbox" style="width:auto" ${s.enabled?"checked":""} onchange="toggleSubject('${s.id}',this.checked)">${s.custom?`<button onclick="deleteSubject('${s.id}')" style="border:0;background:transparent">×</button>`:""}</span>`).join("")}</div></div>`}
window.addSubject=()=>{const name=(prompt("自訂科別名稱")||"").trim();if(name){data.subjects.push({id:"s"+Date.now(),name,enabled:true,custom:true});save()}};
window.toggleSubject=(id,on)=>{data.subjects.find(s=>s.id===id).enabled=on;save()};
window.deleteSubject=id=>{data.subjects=data.subjects.filter(s=>s.id!==id);save()};

function renderReports(){
 reports.innerHTML=`<div class="card panel"><div class="panel-head"><h2>Excel 匯入／匯出</h2></div><p class="muted">可匯出個別、選取學生或全班資料，包含基本資料、家長資料、升學意向、出缺勤、日常表現、聯絡事項及家長留言。</p>
 <div class="toolbar"><select id="reportStudent">${classStudents().map(s=>`<option value="${s.id}">${s.seat}號 ${esc(s.name)}</option>`).join("")}</select><button class="btn" onclick="exportStudent(reportStudent.value)">匯出個別學生</button><button class="btn secondary" onclick="exportSelected()">匯出學生頁已選取者</button><button class="btn" onclick="exportClass()">匯出全班</button><button class="btn secondary" onclick="backupJSON()">完整備份 JSON</button></div></div>`;
}
function exportRows(ids){return ids.map(id=>{const s=studentById(id);const att=data.attendance.filter(a=>a.studentId===id).map(a=>`${a.date} ${a.status}${a.leaveType?"/"+a.leaveType:""} 到${a.arrivalTime||"-"} 離${a.leaveTime||"-"} ${a.notifyMethod||""}`).join("；");const ns=data.notices.filter(n=>n.target===id||n.target==="class").map(n=>`${n.date} ${n.subject}:${n.body}`).join("；");const pm=data.parentMessages.filter(m=>m.studentId===id).map(m=>`${m.date}:${m.text}`).join("；");return {"座號":s.seat,"姓名":s.name,"學號":s.studentNo,"性別":s.gender,"生日":s.birthday,"學生電話":s.phone,"學生地址":s.address,"家長姓名":s.parentName,"家長電話":s.parentPhone,"家長地址":s.parentAddress,"升學意向":s.advancement,"出缺勤紀錄":att,"聯絡紀錄":ns,"家長留言":pm}})}
function exportExcel(ids,name){const wb=XLSX.utils.book_new();const ws=XLSX.utils.json_to_sheet(exportRows(ids));XLSX.utils.book_append_sheet(wb,ws,"學生綜合資料");const att=data.attendance.filter(a=>ids.includes(a.studentId)).map(a=>{const s=studentById(a.studentId)||{};return {"日期":a.date,"座號":s.seat,"姓名":s.name,"到校狀態":a.status,"請假別":a.leaveType,"到校時間":a.arrivalTime,"離校／請假時間":a.leaveTime,"請假方式":a.notifyMethod,"補充":a.note}});XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(att),"出缺勤明細");const ns=data.notices.filter(n=>n.target==="class"||ids.includes(n.target)).map(n=>({"日期":n.date,"對象":n.target==="class"?"全班":studentById(n.target)?.name||"","類別":n.subject,"內容":n.body,"家長可見":n.teacherOnly?"否":"是","已閱覽":n.readBy?.length||0}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ns),"聯絡紀錄");XLSX.writeFile(wb,name)}
window.exportStudent=id=>exportExcel([id],`${studentById(id).name}_個別資料.xlsx`);
window.exportSelected=()=>{const ids=[...document.querySelectorAll(".studentPick:checked")].map(x=>x.value);if(!ids.length)return alert("請先到學生資料頁勾選學生");exportExcel(ids,"選取學生資料.xlsx")};
window.exportClass=()=>exportExcel(classStudents().map(s=>s.id),`${currentClass().name||"全班"}_學生資料.xlsx`);
window.backupJSON=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="親師聯絡簿_v10_完整備份.json";a.click();URL.revokeObjectURL(a.href)};

function renderSettings(){settings.innerHTML=`<div class="card panel"><div class="panel-head"><h2>設定</h2></div><div class="field"><label>教師顯示名稱</label><input id="teacherNameInput" value="${esc(data.settings.teacherName||"Meng")}"></div><div class="safe-box">品牌簽名固定顯示為 <b><i>Meng</i></b>；原始封面不裁切、不修改。</div><button class="btn" onclick="saveSettings()" style="margin-top:12px">儲存</button></div>`}
window.saveSettings=()=>{data.settings.teacherName=teacherNameInput.value.trim()||"Meng";save();alert("已儲存")};

function renderParent(){
 const s=currentParent;const anns=data.announcements.filter(a=>a.classId===s.classId&&(a.target==="all"||a.target===s.id)).slice().reverse();
 const ns=data.notices.filter(n=>n.classId===s.classId&&!n.teacherOnly&&(n.target==="class"||n.target===s.id)).slice().reverse();
 parentContent.innerHTML=`<h3>${s.seat}號 ${esc(s.name)}家長</h3><h4>公告</h4><div class="list">${anns.map(a=>`<div class="list-item"><b>${esc(a.level)}</b><div>${esc(a.text)}</div>${renderAttachments(a.attachments||[],a.id,"parent")}<label><input type="checkbox" ${a.readBy?.includes(s.id)?"checked":""} onchange="parentReadAnnouncement('${a.id}',this.checked)"> 我已閱畢</label>${a.readAt?.[s.id]?`<div class="small muted">閱覽時間：${esc(a.readAt[s.id])}</div>`:""}</div>`).join("")||'<div class="muted">無公告</div>'}</div>
 <h4>今日聯絡事項</h4><div class="list">${ns.map(n=>`<div class="list-item"><span class="badge">${esc(n.subject)}</span><div style="white-space:pre-wrap">${esc(n.body)}</div><label><input type="checkbox" ${n.readBy?.includes(s.id)?"checked":""} onchange="parentReadNotice('${n.id}',this.checked)"> 我已閱畢</label>${n.readAt?.[s.id]?`<div class="small muted">閱覽時間：${esc(n.readAt[s.id])}</div>`:""}</div>`).join("")||'<div class="muted">無聯絡事項</div>'}</div>
 <div class="field"><label>留言給老師</label><textarea id="parentMessageText"></textarea></div><label><input id="needTeacherReply" type="checkbox" style="width:auto"> 需要老師回覆</label><br><button class="btn" onclick="sendParentMessage()" style="margin-top:10px">送出留言</button>`;setTimeout(()=>hydrateAttachments("parent"),0);
}
window.parentReadNotice=(id,on)=>{const n=data.notices.find(x=>x.id===id);n.readBy ||= [];n.readAt ||= {};n.readBy=on?[...new Set([...n.readBy,currentParent.id])]:n.readBy.filter(x=>x!==currentParent.id);if(on)n.readAt[currentParent.id]=nowText();else delete n.readAt[currentParent.id];save();renderParent()};
window.parentReadAnnouncement=(id,on)=>{const a=data.announcements.find(x=>x.id===id);a.readBy ||= [];a.readAt ||= {};a.readBy=on?[...new Set([...a.readBy,currentParent.id])]:a.readBy.filter(x=>x!==currentParent.id);if(on)a.readAt[currentParent.id]=nowText();else delete a.readAt[currentParent.id];save();renderParent()};
window.sendParentMessage=()=>{const t=parentMessageText.value.trim();if(!t)return;data.parentMessages.unshift({id:"m"+Date.now(),studentId:currentParent.id,studentName:currentParent.name,text:t,needReply:needTeacherReply.checked,date:nowText()});save();renderParent();alert("留言已送出")};

renderAll();
</script>
<script>
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));
</script>
</body>
</html>
