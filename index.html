async function sha256(text){
 const data=new TextEncoder().encode(String(text));
 const hash=await crypto.subtle.digest("SHA-256",data);
 return [...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,"0")).join("");
}
function accountForStudent(s,c){

async function ensureStudentCredential(s,c,force=false){
 s.account ||= accountForStudent(s,c);
 s.accountStatus ||= "active";
 s.forcePasswordChange = s.forcePasswordChange ?? true;

 const newDefaultHash=await sha256("Ab123456");
 const oldDefaultHash=await sha256("123456");

 // V15.1：舊版預設密碼 123456 自動遷移成 Ab123456。
 if(s.password==="123456" || s.passwordHash===oldDefaultHash){
   s.passwordHash=newDefaultHash;
   delete s.password;
   s.forcePasswordChange=true;
   return;
 }

 if(force || (!s.passwordHash && !s.password)){
   s.passwordHash=newDefaultHash;
   delete s.password;
   s.forcePasswordChange=true;
 }
}

async function saveAttachBlob(file){

 await new Promise((resolve,reject)=>{const tx=db.transaction("files","readwrite");tx.objectStore("files").put(item);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});

}

}

function activeClasses(){
 return D.classes.filter(c=>c.status!=="deleted"&&c.status!=="disabled");
}
function classCode(c){
 return c?`${Number(c.grade||0)}${String(Number(c.classNo||0)).padStart(2,"0")}`:"";
}
function inferStudentClassCode(s){
 if(s.classCode)return String(s.classCode);
 if(s.account && /^\d{5}$/.test(String(s.account))){
   return String(s.account).slice(0,3);
 }
 if(s.history?.length){
   const h=[...s.history].reverse().find(x=>x.grade&&x.classNo);
   if(h)return `${Number(h.grade)}${String(Number(h.classNo)).padStart(2,"0")}`;
 }
 if(s.previousClassId){
   const old=D.classes.find(c=>c.id===s.previousClassId);
   if(old)return classCode(old);
 }
 return "";
}
function findBestClassForStudent(s){
 let direct=D.classes.find(c=>c.id===s.classId&&c.status!=="deleted"&&c.status!=="disabled");
 if(direct)return direct;

 const code=inferStudentClassCode(s);
 let candidates=activeClasses();

 if(code){
   const byCode=candidates.filter(c=>classCode(c)===code);
   if(byCode.length===1)return byCode[0];
   if(byCode.length>1){
     // Prefer same school year when history gives one, otherwise latest.
     const years=(s.history||[]).map(h=>Number(h.schoolYear)).filter(Number.isFinite);
     const y=years.length?Math.max(...years):null;
     if(y){
       const sameYear=byCode.find(c=>Number(c.schoolYear)===y);
       if(sameYear)return sameYear;
     }
     return [...byCode].sort((a,b)=>Number(b.schoolYear||0)-Number(a.schoolYear||0))[0];
   }
 }

 // If only one active class exists, use it as a final safe repair target.
 if(candidates.length===1)return candidates[0];

 // Prefer current selected class if it exists and code is compatible.
 const current=D.classes.find(c=>c.id===D.currentClassId&&c.status!=="deleted"&&c.status!=="disabled");
 if(current && (!code || classCode(current)===code))return current;

 return null;
}
function repairStudentClassLink(s,saveNow=false){
 const oldId=s.classId;
 const found=findBestClassForStudent(s);
 if(!found)return {ok:false,changed:false,classObj:null};
 if(s.classId!==found.id){
   s.previousClassId=s.classId||s.previousClassId||"";
   s.classId=found.id;
   s.classCode=classCode(found);
   if(saveNow)localStorage.setItem("pcb_v15",JSON.stringify(D));
   return {ok:true,changed:true,classObj:found,oldId};
 }
 s.classCode=classCode(found);
 return {ok:true,changed:false,classObj:found,oldId};
}
function repairAllStudentClassLinks(showMessage=true){
 let changed=0,unresolved=[];
 for(const s of D.students){
   if(s.archived)continue;
   const r=repairStudentClassLink(s,false);
   if(r.changed)changed++;
   if(!r.ok)unresolved.push(s);
 }
 localStorage.setItem("pcb_v15",JSON.stringify(D));
 if(showMessage){
   alert(unresolved.length
     ? `已修復 ${changed} 位學生的班級關聯；仍有 ${unresolved.length} 位無法自動判斷，請到班級／學年度確認。`
     : `班級關聯檢查完成。已修復 ${changed} 位學生。`);
 }
 return {changed,unresolved};
}

function buildSentenceVariant(){
 let courses=selected("course"), events=[...selected("learn"),...selected("behave")], handles=selected("handle"), keyword=kw.value.trim();
 if(!events.length&&!keyword)return null;
 let pieces=[];
 if(courses.length)pieces.push(`今日於${courses.join("、")}課程中，`);
 if(events.length){
  let chosen=events.map(ev=>{let list=PHRASE_BANK[ev]; if(list?.length)return list[Math.floor(Math.random()*list.length)]; return [`今日觀察到「${ev}」的情形，老師已持續關心。`,`今日課程／班級活動中曾出現「${ev}」的情形，已依實際狀況提供提醒或協助。`,`今日在學習或生活表現上有「${ev}」的情形，後續將持續觀察與協助。`][Math.floor(Math.random()*3)]});
  // remove repeated 今日 prefix when already course lead
  if(courses.length)chosen=chosen.map(s=>s.replace(/^今日(?:課程中|課堂中|課程進行期間|課堂討論時|學習過程中|活動過程中|與同學互動時|在人際互動中|在團體活動中|課堂用品準備|未能備妥|仍有|尚未|部分|學習活動進行時)?/,""));
  pieces.push(chosen.join(""));
 }
 if(handles.length)pieces.push(`老師已採取的處理方式包括：${handles.join("、")}。`);
 if(keyword)pieces.push(`補充觀察：${keyword}。`);
 return {courses,events,handles,keyword,text:pieces.join("")}
}

function purgeClass(id){
 let c=D.classes.find(x=>x.id===id); if(!c)return;
 if(!confirm(`永久刪除 ${c.grade}${String(c.classNo).padStart(2,"0")} 班及其學生與相關紀錄？此操作無法復原。`))return;
 const sids=D.students.filter(s=>s.classId===id).map(s=>s.id);
 D.classes=D.classes.filter(x=>x.id!==id);

 D.announcements=D.announcements.filter(x=>x.classId!==id);
 D.notices=D.notices.filter(x=>x.classId!==id&&!sids.includes(x.sid));

function deleteClass(id){

首頁、班級選單與所有功能會立即停止顯示此班，但資料暫時保留，可復原。`))return;

 if(D.currentClassId===id){

function promoteCurrent(){
 let c=C(); if(!c)return alert("目前沒有可升級的班級");
 if(c.status==="graduated")return alert("此班已畢業封存");
 c.history ||= [];
 if(!c.history.some(h=>Number(h.schoolYear)===Number(c.schoolYear)&&Number(h.grade)===Number(c.grade)&&Number(h.classNo)===Number(c.classNo))){
   c.history.push({schoolYear:c.schoolYear,grade:c.grade,classNo:c.classNo,name:c.name||""});
 }
 if(c.grade>=9){
   if(!confirm("九年級完成後將設為「畢業封存」。三年學生、家長、聯絡與輔導歷程仍會保留。確定嗎？"))return;
   c.status="graduated"; c.graduatedAt=N(); save(); return;
 }
 c.schoolYear=Number(c.schoolYear)+1;
 c.grade=Number(c.grade)+1;
 c.history.push({schoolYear:c.schoolYear,grade:c.grade,classNo:c.classNo,name:c.name||""});

async function importStudents(e){
 let f=e.target.files[0]; if(!f)return;
 try{
   let wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:true});
   let rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:"",raw:false});
   if(!rows.length)throw new Error("Excel 沒有資料");
   let imported=0, updated=0, createdClasses=0;
   for(const r of rows){
     let seat=Number(String(r["座號"]||"").trim()); let name=String(r["姓名"]||"").trim();
     if(!seat||!name)continue;
     let rawClass=String(r["班級"]||"").trim();
     let year=Number(String(r["學年度"]||"").replace(/\D/g,""))||C()?.schoolYear||115;
     let target=C();
     if(rawClass){
       let digits=rawClass.replace(/\D/g,"");
       let grade=digits.length>=3?Number(digits[0]):(C()?.grade||7);
       let classNo=digits.length>=3?Number(digits.slice(1)):(Number(digits)||C()?.classNo||1);
       let className=String(r["班名"]||"").trim();
       target=D.classes.find(c=>c.status!=="deleted"&&Number(c.schoolYear)===year&&Number(c.grade)===grade&&Number(c.classNo)===classNo);
       if(!target){
         target={id:"c"+Date.now()+Math.random(),schoolYear:year,grade,classNo,name:className,teacher:"Meng",status:"active",history:[{schoolYear:year,grade,classNo,name:className}]};
         D.classes.push(target); createdClasses++;
       } else if(className && !target.name) target.name=className;
     }
     if(!target){
       target={id:"c"+Date.now()+Math.random(),schoolYear:year,grade:7,classNo:1,name:String(r["班名"]||""),teacher:"Meng",status:"active",history:[{schoolYear:year,grade:7,classNo:1,name:String(r["班名"]||"")}]};
       D.classes.push(target); createdClasses++;
     }
     D.currentClassId=target.id;
     let s=D.students.find(x=>x.classId===target.id&&Number(x.seat)===seat);
     let isNew=!s;
     if(!s){s={id:"s"+Date.now()+Math.random(),classId:target.id,history:[]};D.students.push(s)}
     Object.assign(s,{
       classId:target.id, archived:false, seat, name,
       studentNo:String(r["學號"]||""),gender:String(r["性別"]||""),birthday:String(r["生日"]||""),
       phone:String(r["學生電話"]||""),address:String(r["學生地址"]||""),
       parent1Name:String(r["家長1姓名"]||""),parent1Relation:String(r["家長1關係"]||r["關係"]||""),
       parent1Phone:String(r["家長1電話"]||r["電話"]||""),parent1Email:String(r["家長1 Email"]||r["Email"]||""),
       parent1Line:String(r["家長1 Line ID"]||r["Line ID"]||""),
       parent2Name:String(r["家長2姓名"]||""),parent2Relation:String(r["家長2關係"]||""),
       parent2Phone:String(r["家長2電話"]||""),parent2Email:String(r["家長2 Email"]||""),
       parent2Line:String(r["家長2 Line ID"]||""),
       emergencyName:String(r["緊急聯絡人"]||""),emergencyPhone:String(r["緊急聯絡電話"]||""),advancement:String(r["升學意向"]||"未定"),notes:String(r["備註"]||"")
     });
     s.account ||= `${target.grade}${String(target.classNo).padStart(2,"0")}${String(seat).padStart(2,"0")}`;
     s.history ||= [];
     if(!s.history.some(h=>Number(h.schoolYear)===Number(target.schoolYear)&&Number(h.grade)===Number(target.grade))){
       s.history.push({schoolYear:target.schoolYear,grade:target.grade,classNo:target.classNo,seat});
     }
     await ensureStudentCredential(s,target,isNew);
     isNew?imported++:updated++;
   }
   save();
   alert(`Excel 匯入完成\n新增學生：${imported} 人\n更新學生：${updated} 人\n自動建立班級：${createdClasses} 個`);
 }catch(err){
   console.error(err);
   alert("Excel 匯入失敗："+err.message+"\n請確認至少有「座號、姓名」欄；若尚未建立班級，請再加上「班級」欄，例如 706。");
 }
 e.target.value="";
}

const DEFAULT_SUBJECTS=["國文","英文","數學","自然","歷史","地理","公民","健康教育","體育","音樂","視覺藝術","表演藝術","科技","綜合活動"];
const EXAMS=["第一次段考","第二次段考","第三次段考","平時成績"];
function gradeCfg(){
 const c=C();if(!c)return null;
 if(!D.gradeConfigs[c.id])D.gradeConfigs[c.id]={
   subjects:[{id:"sub1",name:"國文",weight:5},{id:"sub2",name:"英文",weight:5},{id:"sub3",name:"數學",weight:5},{id:"sub4",name:"自然",weight:4},{id:"sub5",name:"歷史",weight:2},{id:"sub6",name:"地理",weight:2},{id:"sub7",name:"公民",weight:2}],
   examWeights:{"第一次段考":30,"第二次段考":30,"第三次段考":30,"平時成績":10},
   passing:60,excellent:90,term:"上"
 };
 return D.gradeConfigs[c.id];
}
function gradeKey(exam,sid,subid){let c=C(),cfg=gradeCfg();return `${c.id}|${c.schoolYear}|${cfg.term}|${exam}|${sid}|${subid}`}
function examStatusKey(exam,sid){let c=C(),cfg=gradeCfg();return `${c.id}|${c.schoolYear}|${cfg.term}|${exam}|${sid}`}
function scoreOf(exam,sid,subid){let v=D.gradeScores[gradeKey(exam,sid,subid)];return v===undefined||v===""?null:Number(v)}
function saveScore(exam,sid,subid,value){
 let v=String(value).trim(),key=gradeKey(exam,sid,subid);
 if(v===""){delete D.gradeScores[key]}else{let n=Math.max(0,Math.min(100,Number(v)));D.gradeScores[key]=Number.isFinite(n)?n:""}
 localStorage.setItem("pcb_v15",JSON.stringify(D));refreshGradeComputed(exam,sid);
}
function weightedExam(exam,sid){
 let cfg=gradeCfg(),sum=0,w=0;
 for(const sub of cfg.subjects){let s=scoreOf(exam,sid,sub.id);if(s!==null&&Number.isFinite(s)){sum+=s*Number(sub.weight||0);w+=Number(sub.weight||0)}}
 return w?sum/w:null;
}
function semesterAvg(sid){
 let cfg=gradeCfg(),sum=0,w=0;
 for(const exam of EXAMS){let v=weightedExam(exam,sid),ew=Number(cfg.examWeights[exam]||0);if(v!==null&&ew>0){sum+=v*ew;w+=ew}}
 return w?sum/w:null;
}
function gradeTrend(sid){
 return EXAMS.slice(0,3).map(e=>weightedExam(e,sid)).filter(v=>v!==null);
}

function gradeNarrative(sid){
 const s=S(sid),vals=EXAMS.slice(0,3).map(e=>weightedExam(e,sid)),available=vals.filter(v=>v!==null);
 if(!available.length)return "目前尚無足夠成績資料可供分析。";
 let parts=[],first=available[0],last=available[available.length-1],diff=last-first;
 if(available.length>=2){
   if(diff>=10)parts.push(`目前已輸入的段考加權平均呈現較明顯的上升變化（約增加 ${diff.toFixed(1)} 分）。`);
   else if(diff>=3)parts.push(`目前已輸入的段考加權平均呈現小幅上升（約增加 ${diff.toFixed(1)} 分）。`);
   else if(diff<=-10)parts.push(`目前已輸入的段考加權平均較先前下降約 ${Math.abs(diff).toFixed(1)} 分，建議進一步了解各科學習狀況。`);
   else parts.push("目前已輸入的段考加權平均變化幅度不大，可持續觀察後續學習表現。");
 }
 const cfg=gradeCfg(),exam=EXAMS.find(e=>weightedExam(e,sid)!==null)||EXAMS[0];
 const subVals=cfg.subjects.map(sub=>({name:sub.name,v:scoreOf(exam,sid,sub.id)})).filter(x=>x.v!==null).sort((a,b)=>a.v-b.v);
 if(subVals.length){parts.push(`就目前資料而言，${subVals[0].name}分數相對較低，可作為後續複習與協助的參考；此為成績資料整理，不代表對學生能力或態度的定論。`)}
 return parts.join("");
}
function radarChart(sid,exam){
 const cfg=gradeCfg(),vals=cfg.subjects.map(sub=>({name:sub.name,v:scoreOf(exam,sid,sub.id)})).filter(x=>x.v!==null).slice(0,8);
 if(vals.length<3)return '<div class="muted small">至少需要三科成績才顯示科目雷達圖。</div>';
 const size=230,cx=115,cy=115,r=78,n=vals.length,pt=(i,rr)=>{let a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]};
 const rings=[.25,.5,.75,1].map(k=>`<polygon points="${vals.map((_,i)=>pt(i,r*k).join(",")).join(" ")}" fill="none" stroke="currentColor" opacity=".16"/>`).join("");
 const axes=vals.map((_,i)=>{let q=pt(i,r);return `<line x1="${cx}" y1="${cy}" x2="${q[0]}" y2="${q[1]}" stroke="currentColor" opacity=".16"/>`}).join("");
 const poly=vals.map((x,i)=>pt(i,r*x.v/100).join(",")).join(" ");
 const labels=vals.map((x,i)=>{let q=pt(i,r+22);return `<text x="${q[0]}" y="${q[1]}" font-size="10" text-anchor="middle" dominant-baseline="middle">${E(x.name)}</text>`}).join("");
 return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" aria-label="科目雷達圖">${rings}${axes}<polygon points="${poly}" fill="currentColor" fill-opacity=".12" stroke="currentColor" stroke-width="2"/>${labels}</svg>`;
}

function sparkline(vals){
 if(!vals.length)return '<span class="muted">尚無資料</span>';
 const w=170,h=48,p=4,min=0,max=100;
 const pts=vals.map((v,i)=>`${p+(w-2*p)*(vals.length===1?.5:i/(vals.length-1))},${h-p-(v-min)/(max-min)*(h-2*p)}`).join(" ");
 return `<svg class="mini-chart" viewBox="0 0 ${w} ${h}" aria-label="成績趨勢"><polyline fill="none" stroke="currentColor" stroke-width="2.5" points="${pts}"/>${pts.split(" ").map(pt=>{let [x,y]=pt.split(",");return `<circle cx="${x}" cy="${y}" r="3" fill="currentColor"/>`}).join("")}</svg>`;
}

function gradeAnalysisHtml(ss){

 return `<div class="stats">${stat("學期班平均",avg===null?"—":avg.toFixed(2))}${stat("最高",max===null?"—":max.toFixed(2))}${stat("最低",min===null?"—":min.toFixed(2))}${stat("及格率",pass===null?"—":pass.toFixed(1)+"%")}</div><div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>座號</th><th>姓名</th>${EXAMS.map(e=>`<th>${e}</th>`).join("")}<th>學期參考</th><th>趨勢</th><th>提示</th></tr></thead><tbody>${ss.map(s=>{let ex=EXAMS.map(e=>weightedExam(e,s.id)),sem=semesterAvg(s.id),trend=gradeTrend(s.id),imp=trend.length>=2?trend[trend.length-1]-trend[0]:null;let tip=sem!==null&&sem<60?"需持續關心":imp!==null&&imp>=10?"進步幅度明顯":"—";return `<tr><td>${s.seat}</td><td><button class="btn secondary" onclick="showStudentPortfolio('${s.id}')">${E(s.name)}</button></td>${ex.map(v=>`<td>${v===null?"—":v.toFixed(2)}</td>`).join("")}<td><b>${sem===null?"—":sem.toFixed(2)}</b></td><td>${sparkline(trend)}</td><td>${tip}</td></tr>`}).join("")}</tbody></table></div>`;

async function importExam(e,exam){
 let f=e.target.files[0];if(!f)return;
 try{
  let wb=XLSX.read(await f.arrayBuffer(),{type:"array"}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""}),cfg=gradeCfg(),n=0;
  for(const r of rows){let seat=Number(r["座號"]),s=classStudents().find(x=>Number(x.seat)===seat);if(!s)continue;for(const sub of cfg.subjects){let v=r[sub.name];if(v!==""&&v!==undefined){let num=Number(v);if(Number.isFinite(num))D.gradeScores[gradeKey(exam,s.id,sub.id)]=Math.max(0,Math.min(100,num))}}if(r["狀態"])D.examStatus[examStatusKey(exam,s.id)]=String(r["狀態"]);if(r["教師備註"]!==undefined)D.gradeNotes[examStatusKey(exam,s.id)]=String(r["教師備註"]);n++}
  save();alert(`已匯入 ${n} 位學生的 ${exam} 成績`);
 }catch(err){console.error(err);alert("成績 Excel 匯入失敗："+err.message)}
 e.target.value="";

function renderReports(){
 if(!C()){reports.innerHTML=noClassCard("<button class=\"btn secondary\" onclick=\"go(\'students\')\">前往匯入學生</button>");return;}
 reports.innerHTML=`<div class="card panel"><div class="head"><h2>Excel 匯入／匯出</h2></div><p class="muted">所有歷程匯出皆保留日期、時間、對象、地點、問題描述、內容、處理方式與來源。</p><div class="grid2"><div class="field"><label>學生</label><select id="rs">${classStudents().map(s=>`<option value="${s.id}">${s.seat}號 ${E(s.name)}</option>`).join("")}</select></div><div class="field"><label>匯出</label><div class="toolbar"><button class="btn" onclick="exp([rs.value],S(rs.value).name+'_學生三年歷程.xlsx')">個別學生</button><button class="btn secondary" onclick="exp(classStudents().map(x=>x.id),'全班學生歷程.xlsx')">全班</button></div></div></div></div>`;
}
function exp(ids,name){let wb=XLSX.utils.book_new(),basic=D.students.filter(x=>ids.includes(x.id));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(basic),"學生家長資料");
let attendance=D.attendance.filter(x=>ids.includes(x.sid)).map(x=>({"日期":x.date,"時間":x.time,"學生":S(x.sid)?.name,"到校狀態":x.status,"請假別":x.leave,"到校時間":x.arrival,"離校／請假時間":x.leaveTime,"請假方式":x.method}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(attendance),"出缺勤");
let notices=D.notices.filter(x=>ids.includes(x.sid)).map(x=>({"日期":x.date,"時間":x.time||"","學生":S(x.sid)?.name,"類型":x.type,"課程":(x.courses||[]).join("、"),"內容":x.content,"處理方式":(x.handling||[]).join?x.handling.join("、"):x.handling,"家長可見":x.parentVisible?"是":"否"}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(notices),"學生事件與提醒");
let contacts=D.contacts.filter(x=>ids.includes(x.sid)).map(x=>({"日期時間":x.date,"學生":S(x.sid)?.name,"對象":"家長","內容":x.content,"處理狀態":x.status||""}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(contacts),"親師聯繫");
let counseling=D.counseling.filter(x=>ids.includes(x.sid)).map(x=>({"日期":x.date,"時間":x.time,"學生":S(x.sid)?.name,"晤談對象":x.object,"地點":x.location,"問題類型":x.problemType,"問題描述":x.problemDesc,"晤談內容":x.content,"處理方式":x.handling,"後續追蹤":x.follow,"來源":x.source,"建立教師":x.teacher}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(counseling),"輔導晤談");
let sign=D.signatures.filter(x=>ids.includes(x.sid)).map(x=>({"日期":x.date,"簽閱時間":x.time,"學生":S(x.sid)?.name}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sign),"家長簽閱");
let anns=D.announcements.filter(x=>x.classId===D.currentClassId).map(x=>({"日期時間":x.date,"類型":x.type,"標題":x.title,"內容":x.text,"附件":x.file,"連結":x.url}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(anns),"學校班級公告");
let history=D.classes.filter(c=>c.id===D.currentClassId).flatMap(c=>(c.history||[]).map(h=>({"學年度":h.schoolYear,"年級":h.grade,"班級":h.classNo,"班名":c.name,"狀態":c.status})));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(history),"班級學年歷程");
let gradeRows=[];let cfg=D.gradeConfigs[D.currentClassId];if(cfg){for(const sid of ids){for(const exam of EXAMS){let s=S(sid);let r={"學年度":C()?.schoolYear,"學期":cfg.term,"學生":s?.name,"座號":s?.seat,"評量":exam};cfg.subjects.forEach(sub=>r[sub.name]=scoreOf(exam,sid,sub.id)??"");r["科目加權平均"]=weightedExam(exam,sid)?.toFixed(2)||"";r["狀態"]=D.examStatus[examStatusKey(exam,sid)]||"正常";r["教師備註"]=D.gradeNotes[examStatusKey(exam,sid)]||"";gradeRows.push(r)}}}XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(gradeRows),"教師成績紀錄");
let logs=D.loginLogs.filter(x=>ids.includes(x.sid)).map(x=>({"時間":x.time,"學生":S(x.sid)?.name,"結果":x.result,"裝置":x.device}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(logs),"家長登入紀錄");
XLSX.writeFile(wb,name)}
function exportTimetable(){let days=["星期一","星期二","星期三","星期四","星期五"],rows=[1,2,3,4,5,6,7].map(p=>{let r={"節次":`第${p}節`};days.forEach(d=>r[d]=D.timetable[D.currentClassId+"|"+d+"-"+p]||"");return r}),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"功課表");XLSX.writeFile(wb,"班級功課表.xlsx")}

function parentSharedGradesHtml(s,c){
 try{
   let cfg=D.gradeConfigs?.[c.id];
   if(!cfg)return "";
   let parts=[];
   for(const exam of EXAMS){
     let key=`${c.id}|${c.schoolYear}|${cfg.term}|${exam}`;
     if(!D.gradeShare?.[key])continue;
     let vals=(cfg.subjects||[]).map(sub=>({name:sub.name,score:scoreOf(exam,s.id,sub.id)})).filter(x=>x.score!==null),avg=weightedExam(exam,s.id);
     parts.push(`<div class="item"><b>${E(exam)}</b><div>${vals.map(x=>`${E(x.name)}：${x.score}`).join("｜")||"尚無成績"}</div><div>科目加權平均：<b>${avg===null?"—":avg.toFixed(2)}</b></div></div>`);
   }
   return parts.length?`<h4>老師分享的成績</h4>${parts.join("")}`:"";
 }catch(err){
   console.error("parentSharedGradesHtml",err);
   return "";
 }
}
function parentPasswordForm(forced=false){
 return `<div class="card panel" style="box-shadow:none;margin-top:12px"><h3>修改密碼</h3><div class="field"><label>目前密碼</label><input id="oldPw" type="password"></div><div class="field"><label>新密碼（至少6碼）</label><input id="newPw" type="password"></div><div class="field"><label>再次輸入新密碼</label><input id="newPw2" type="password"></div><button class="btn" onclick="changeParentPassword(${forced})">儲存新密碼</button></div>`;
}
function renderParentFallback(err){
 const pv=document.getElementById("parentView");
 if(!pv)return;
 pv.innerHTML=`<div class="card panel"><div class="head"><h2>家長專區</h2><button class="btn secondary" onclick="exitParent()">登出</button></div><div class="warn">登入成功，但部分資料載入時發生錯誤。帳號與學生資料仍保留。</div><div class="safe" style="margin-top:10px">學生：<b>${E(CP?.name||"")}</b><br>座號：${E(CP?.seat||"")}<br>班級：${E(CP?.classCode||"")}</div><button class="btn" style="margin-top:12px" onclick="tryRenderParentAgain()">重新載入家長頁</button><details style="margin-top:12px"><summary>錯誤資訊</summary><pre style="white-space:pre-wrap">${E(String(err?.message||err||"未知錯誤"))}</pre></details></div>`;
}
function tryRenderParentAgain(){try{renderParent()}catch(err){renderParentFallback(err)}}
function exitParent(){CP=null;parent.classList.add("hidden");login.classList.remove("hidden")}
function renderParent(){
 try{
   let s=CP;
   if(!s)throw new Error("找不到目前登入的家長學生資料");

   let c=null;
   try{c=findBestClassForStudent(s)}catch(e){console.warn("parent class lookup",e)}
   c=c || (D.classes||[]).find(x=>x.id===s.classId&&x.status!=="deleted"&&x.status!=="disabled")
       || (D.classes||[]).find(x=>x.status!=="deleted"&&x.status!=="disabled");
   if(!c)throw new Error("找不到目前有效班級");
   if(s.classId!==c.id){s.classId=c.id;s.classCode=classCode(c)}
   D.currentClassId=c.id;
   try{localStorage.setItem("pcb_v15",JSON.stringify(D));}catch(e){console.warn("parent save skipped",e);}

   const pv=document.getElementById("parentView");
   if(!pv)throw new Error("找不到家長頁容器");

   if(s.forcePasswordChange){
     pv.innerHTML=`<div class="card panel"><div class="head"><h2>${E(s.seat)}號 ${E(s.name)}家長</h2><button class="btn secondary" onclick="exitParent()">登出</button></div><div class="warn"><b>首次登入／密碼已重設</b><br>為保護帳號，請先修改密碼後再使用聯絡簿。</div>${parentPasswordForm(true)}</div>`;
     return;
   }

   const today=T();
   let hw=(D.homework||[]).filter(x=>x.classId===c.id&&x.date===today);
   let an=(D.announcements||[]).filter(x=>x.classId===c.id);
   let ns=(D.notices||[]).filter(x=>x.sid===s.id&&x.parentVisible&&String(x.date||"").startsWith(today));
   let sg=(D.signatures||[]).find(x=>x.sid===s.id&&x.date===today);

   pv.innerHTML=`<div class="card panel"><div class="head"><h2>${E(s.seat)}號 ${E(s.name)}家長</h2><div><button class="btn secondary" onclick="showParentSettings()">帳號／聯絡資料設定</button> <button class="btn secondary" onclick="exitParent()">登出</button></div></div>
   <div class="safe">班級：${E(classCode(c))}${c.name?`（${E(c.name)}）`:""}｜${E(c.schoolYear)}學年度</div>
   <h4>今日功課與提醒</h4>${hw.map(x=>`<div class="item"><b>${E(x.subject||"提醒事項")}</b>｜${E(x.content||"")}</div>`).join("")||'<div class="muted">今日尚無功課／提醒。</div>'}
   <h4>學校／班級公告</h4>${an.map(x=>`<div class="item"><b>${E(x.type||"公告")}｜${E(x.title||"")}</b><div>${E(x.text||"")}</div>${typeof attachmentButtons==="function"?attachmentButtons(x):""}${(x.links||[]).map(l=>`<div><a target="_blank" rel="noopener" href="${E(l.url)}">${E(l.label||"連結")}</a></div>`).join("")}${x.url?`<a target="_blank" rel="noopener" href="${E(x.url)}">${E(x.file||"附件")}</a>`:""}</div>`).join("")||'<div class="muted">目前沒有公告。</div>'}
   <h4>學習與生活提醒</h4>${ns.map(x=>`<div class="item">${E(x.content||"")}</div>`).join("")||'<div class="muted">今日沒有個別提醒。</div>'}
   ${parentSharedGradesHtml(s,c)}
   <h4>親師聯繫（選填）</h4><textarea id="pm" placeholder="有需要反應或提問時再填寫"></textarea>
   <label class="checkitem"><input id="ps" type="checkbox" ${sg?"checked disabled":""}><span>我已詳閱今日聯絡簿內容</span></label>
   <button class="btn" onclick="submitP()" ${sg?"disabled":""} style="margin-top:9px">${sg?"今日已簽閱":"送出並簽閱"}</button>
   ${sg?`<div class="muted small">簽閱時間：${E(sg.time||"")}</div>`:""}</div>`;
 }catch(err){
   console.error("renderParent",err);
   renderParentFallback(err);
 }
}
async function changeParentPassword(forced=false){
 try{
   let old=document.getElementById("oldPw")?.value||"",nw=document.getElementById("newPw")?.value||"",nw2=document.getElementById("newPw2")?.value||"";
   if(nw.length<6)return alert("新密碼至少6碼");
   if(nw!==nw2)return alert("兩次新密碼不一致");
   let ok=CP.passwordHash?(await sha256(old))===CP.passwordHash:(old===String(CP.password||""));
   if(!ok)return alert("目前密碼不正確");
   CP.passwordHash=await sha256(nw);delete CP.password;CP.forcePasswordChange=false;addAudit("家長自行修改密碼",CP.id,"");
   localStorage.setItem("pcb_v15",JSON.stringify(D));
   renderParent();alert("密碼已更新");
 }catch(err){console.error(err);alert("修改密碼時發生錯誤，請重新整理後再試")}
}
function showParentSettings(){
 let s=CP;
 showModal("家長帳號／聯絡資料設定",`${parentPasswordForm(false)}<div class="card panel" style="box-shadow:none"><h3>聯絡資料</h3><div class="field"><label>家長姓名</label><input id="setPName" value="${E(s.parent1Name||"")}"></div><div class="field"><label>電話</label><input id="setPPhone" value="${E(s.parent1Phone||"")}"></div><div class="field"><label>Email</label><input id="setPEmail" value="${E(s.parent1Email||"")}"></div><div class="field"><label>Line ID</label><input id="setPLine" value="${E(s.parent1Line||"")}"></div><button class="btn" onclick="saveParentContact()">儲存聯絡資料</button></div>`);
}
function saveParentContact(){
 try{
   CP.parent1Name=document.getElementById("setPName").value;
   CP.parent1Phone=document.getElementById("setPPhone").value;
   CP.parent1Email=document.getElementById("setPEmail").value;
   CP.parent1Line=document.getElementById("setPLine").value;
   addAudit("家長更新聯絡資料",CP.id,"");
   localStorage.setItem("pcb_v15",JSON.stringify(D));
   closeModal();renderParent();alert("聯絡資料已更新");
 }catch(err){console.error(err);alert("聯絡資料儲存失敗")}
}
function submitP(){if(!ps.checked)return alert("請先勾選已詳閱");if(pm.value.trim())D.contacts.unshift({id:"pc"+Date.now(),date:N(),sid:CP.id,content:pm.value.trim(),status:"尚未處理"});D.signatures.push({date:T(),time:N(),sid:CP.id});save();renderParent();alert("已完成今日簽閱")}

window.addEventListener("error",e=>{console.error("Global error",e.error||e.message);if(!parent.classList.contains("hidden")&&CP){renderParentFallback(e.error||new Error(e.message||"頁面載入錯誤"))}});
window.addEventListener("unhandledrejection",e=>{console.error("Unhandled rejection",e.reason);if(!parent.classList.contains("hidden")&&CP){renderParentFallback(e.reason||new Error("非同步載入錯誤"))}});
try{
  renderAll();
  window.__PCB_BOOT_OK__=true;
}catch(err){
  console.error("PCB boot error",err);
  window.__PCB_BOOT_OK__=false;
  const card=document.querySelector(".loginCard");
  if(card){
    const msg=document.createElement("div");
    msg.className="warn";
    msg.style.marginTop="12px";
    msg.textContent="系統初始化發生錯誤，請重新整理頁面；若仍無法使用，請回報此畫面。";
    card.appendChild(msg);
  }
}
</script>
</body>
</html>
