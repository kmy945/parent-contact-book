<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#178aa8">
<title>親師聯絡簿 v11 整合版</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--ink:#173950;--muted:#6f8491;--blue:#278cc5;--aqua:#3ab6c8;--bg:#edf8fc;--paper:#fff;--line:#d8e8ef;--shadow:0 12px 28px rgba(34,101,134,.13)}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:13px}
.btn{border:0;border-radius:13px;padding:10px 15px;background:linear-gradient(135deg,var(--blue),var(--aqua));color:#fff;font-weight:800}.btn.secondary{background:#eef8fb;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:#fff1f1;color:#a23f3f}
.card{background:#fff;border-radius:20px;box-shadow:var(--shadow);border:1px solid #fff}.panel{padding:20px;margin-bottom:16px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.head h2,.head h3{margin:0}
.field{display:grid;gap:7px;margin:10px 0}.field label{font-weight:800}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:#fff;color:var(--ink)}textarea{min-height:105px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.stat{padding:14px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#fff,#f5fbfe)}.stat b{display:block;font-size:26px}
.list{display:grid;gap:9px}.item{padding:12px;border:1px solid var(--line);border-radius:14px;background:#fbfdff}.safe{padding:12px;border-radius:13px;background:#eaf8f1;border:1px solid #c7e6d5}.warn{padding:12px;border-radius:13px;background:#fff6df;border:1px solid #edd9a1}
.options{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.opt{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff}.opt label{display:flex;gap:7px;align-items:flex-start}.opt input{width:auto;margin-top:3px}.sub{display:grid;gap:6px;margin:8px 0 0 21px}.sub label{font-weight:400}
.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{position:sticky;top:0;height:100vh;padding:16px 11px;background:linear-gradient(#f9fdff,#eaf7fd);border-right:1px solid var(--line);overflow:auto}.brand{padding:10px 13px 17px;font-size:22px;font-weight:900}.brand em{display:block;font-family:"Brush Script MT","Segoe Script",cursive;font-size:22px;color:#177698}.nav{width:100%;border:0;background:transparent;border-radius:12px;padding:10px 11px;text-align:left;margin:3px 0;color:var(--ink)}.nav.on,.nav:hover{background:#dff2fa;color:#176f99;font-weight:900}
.header{padding:20px 24px 45px;background:radial-gradient(circle at 12% 20%,rgba(255,255,255,.8) 0 8px,transparent 9px),radial-gradient(circle at 38% 35%,rgba(255,255,255,.65) 0 14px,transparent 15px),linear-gradient(#dcf4ff,#98d8e9);position:relative;overflow:hidden}.header:after{content:"";position:absolute;left:-5%;right:-5%;bottom:-34px;height:84px;background:rgba(255,255,255,.78);border-radius:50% 45% 0 0/40% 35% 0 0}.header h1{position:relative;z-index:2;margin:24px 0 5px;font-size:31px}.headerRow{position:relative;z-index:2;display:flex;justify-content:space-between;gap:12px}.content{padding:0 22px 40px;margin-top:-22px;position:relative;z-index:3}
.login{min-height:100vh;position:relative;background:#eaf5fb url("cover-clean.jpg") center/cover no-repeat;display:grid;place-items:center}.login:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,43,64,.04),rgba(234,245,251,.25))}.loginCard{position:relative;width:min(430px,calc(100% - 28px));padding:27px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);margin-left:min(48vw,620px)}.tabs{display:flex;gap:6px;background:#eaf5fa;padding:5px;border-radius:14px;margin:18px 0}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:10px}.tabs .on{background:#fff;font-weight:800}.sign{text-align:right;margin-top:18px;color:#597586}.sign em{display:block;font-family:"Brush Script MT","Segoe Script",cursive;font-size:27px;color:#177698}
.bottom{display:none}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.options{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.login{background-position:center}.loginCard{margin:38vh auto 16px}.app{display:block}.side{display:none}.content{padding:0 11px 80px}.header{padding:16px 15px 40px}.headerRow{display:block}.grid2,.options{grid-template-columns:1fr}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line)}.bottom button{border:0;background:#fff;padding:10px 3px;font-size:12px;color:var(--ink)}}
</style>
</head>
<body>
<section id="login" class="login">
 <div class="card loginCard">
  <h1 style="margin:0">親師聯絡簿</h1><p class="muted">今日功課、公告、個別聯絡與家長簽閱一次完成</p>
  <div class="tabs"><button id="tt" class="on" onclick="tab('t')">教師登入</button><button id="pt" onclick="tab('p')">家長登入</button></div>
  <div id="tlogin"><button class="btn" style="width:100%;margin-bottom:9px" onclick="enterTeacher()">使用 Google 帳號登入</button><button class="btn secondary" style="width:100%" onclick="enterTeacher()">訪客體驗</button></div>
  <div id="plogin" class="hidden"><div class="field"><label>家長帳號</label><input id="pa" value="70601"></div><div class="field"><label>密碼</label><input id="pp" type="password" value="123456"></div><button class="btn" style="width:100%" onclick="enterParent()">登入</button></div>
  <div class="sign">Designed by <em>Meng</em></div>
 </div>
</section>

<section id="teacher" class="app hidden">
 <aside class="side">
  <div class="brand">親師聯絡簿<em>Meng</em></div>
  <button class="nav on" data-p="home" onclick="go('home')">首頁</button>
  <button class="nav" data-p="daily" onclick="go('daily')">今日聯絡簿</button>
  <button class="nav" data-p="schedule" onclick="go('schedule')">課表與功課</button>
  <button class="nav" data-p="students" onclick="go('students')">班級與學生</button>
  <button class="nav" data-p="contacts" onclick="go('contacts')">親師聯繫</button>
  <button class="nav" data-p="counseling" onclick="go('counseling')">輔導／晤談</button>
  <button class="nav" data-p="preview" onclick="go('preview')">家長預覽</button>
  <button class="nav" data-p="reports" onclick="go('reports')">Excel 匯入／匯出</button>
  <button class="nav" onclick="location.reload()">登出</button>
 </aside>
 <main>
  <header class="header"><div class="headerRow"><div><select><option>115學年度・706班（六出奇技）</option></select><div class="safe" style="display:inline-block;margin-top:8px;padding:7px 10px">教師雲端模式・已同步</div></div><button class="btn secondary" onclick="location.reload()">登出</button></div><h1>706班（六出奇技）</h1><div>115學年度｜Meng老師</div></header>
  <div class="content">
   <section id="home" class="page"></section><section id="daily" class="page hidden"></section><section id="schedule" class="page hidden"></section><section id="students" class="page hidden"></section><section id="contacts" class="page hidden"></section><section id="counseling" class="page hidden"></section><section id="preview" class="page hidden"></section><section id="reports" class="page hidden"></section>
  </div>
 </main>
 <nav class="bottom"><button onclick="go('home')">首頁</button><button onclick="go('daily')">今日</button><button onclick="go('schedule')">功課</button><button onclick="go('preview')">預覽</button><button onclick="go('reports')">匯出</button></nav>
</section>

<section id="parent" class="hidden" style="min-height:100vh;padding:15px;background:#edf8fc"><div style="max-width:760px;margin:auto"><div class="card panel"><div class="head"><h2>今日聯絡簿</h2><button class="btn secondary" onclick="location.reload()">登出</button></div><div id="parentView"></div></div></div></section>

<script>
const Courses=["國文","英語","數學","自然","社會","音樂","體育","視覺藝術","表演藝術","科技","綜合活動","班會","自訂"];
const Learn=["未完成作業","未帶課本","未帶習作","未帶文具／用品","上課精神不佳","專注力較不穩定","未參與討論","活動完成度待加強","學習態度良好","主動發言","主動協助同學","自訂"];
const Behave=["與同學交談","擅自離座","使用手機","課堂飲食","影響課程進行","未依課堂規範","情緒起伏","人際互動需引導","自律良好","禮貌良好","自訂"];
const Handle=["已口頭提醒","已個別提醒","已協助完成","已聯絡家長","已與學生晤談","持續觀察","已鼓勵","已獎勵","已轉介","自訂"];
const phrases={
"未完成作業":"今日作業尚未於規定時間內完成，老師已提醒利用時間補齊。",
"未帶課本":"今日課程所需課本尚未備妥，老師已協助孩子參與課程，並提醒下次課前確認。",
"未帶習作":"今日尚未攜帶課程所需習作，已提醒於下次上課前備妥。",
"未帶文具／用品":"今日課程所需用品尚未備妥，老師已協助孩子參與課程。",
"上課精神不佳":"今日課程中觀察到孩子精神較為疲倦，老師已適時關心。",
"專注力較不穩定":"今日課堂中專注情形偶有中斷，老師已適時提醒。",
"未參與討論":"今日課堂討論時參與程度較低，老師已鼓勵孩子表達想法。",
"活動完成度待加強":"今日課堂活動尚未在指定時間內完成，老師已提供協助與提醒。",
"學習態度良好":"今日能依照課程指示投入學習活動，值得肯定。",
"主動發言":"今日能主動回應課堂提問，展現良好的參與態度。",
"主動協助同學":"今日能主動協助同學或班級事務，值得鼓勵。",
"與同學交談":"今日課堂中曾有與同學交談的情形，老師已於當下提醒。",
"擅自離座":"今日課堂中曾有離開座位的情形，老師已提醒依課程需要在座位上參與活動。",
"使用手機":"今日課程進行期間曾使用手機，老師已依班級規範提醒。",
"課堂飲食":"今日課程進行期間曾有飲食情形，老師已提醒留意課堂規範。",
"影響課程進行":"今日課堂中曾有影響課程進行的情形，老師已適時引導。",
"未依課堂規範":"今日課堂中曾有未依課程指示進行的情形，老師已說明並提醒。",
"情緒起伏":"今日在課堂或班級活動中情緒反應較為明顯，老師已適時關心並協助調整。",
"人際互動需引導":"今日與同學互動時曾出現意見不同的情形，老師已陪同釐清並引導合宜表達。",
"自律良好":"今日能遵守課堂與班級規範，展現良好的自律表現。",
"禮貌良好":"今日與師長及同學互動時能使用合宜的表達方式，值得肯定。"
};
const D=JSON.parse(localStorage.getItem("pcb_v11_integrated")||"null")||{students:[{id:"s1",seat:1,name:"王小明",parent:"王媽媽",phone:"0912-000-001",account:"70601",password:"123456",adv:"高中"},{id:"s2",seat:2,name:"李小華",parent:"李爸爸",phone:"0912-000-002",account:"70602",password:"123456",adv:"高職"}],homework:[],ann:[],notices:[],attendance:[],sign:[],contacts:[],counseling:[],timetable:{}};
let CP=null;const T=()=>new Date().toISOString().slice(0,10),N=()=>new Date().toLocaleString("zh-TW"),E=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])),S=id=>D.students.find(x=>x.id===id);
function save(){localStorage.setItem("pcb_v11_integrated",JSON.stringify(D));renderAll()}
function tab(x){tlogin.classList.toggle("hidden",x!=="t");plogin.classList.toggle("hidden",x!=="p");tt.classList.toggle("on",x==="t");pt.classList.toggle("on",x==="p")}
function enterTeacher(){login.classList.add("hidden");teacher.classList.remove("hidden");renderAll()}
function enterParent(){let s=D.students.find(x=>x.account===pa.value&&x.password===pp.value);if(!s)return alert("帳號或密碼不正確");CP=s;login.classList.add("hidden");parent.classList.remove("hidden");renderParent()}
function go(id){document.querySelectorAll(".page").forEach(x=>x.classList.toggle("hidden",x.id!==id));document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("on",x.dataset.p===id));if(id==="preview")renderPreview();scrollTo({top:0,behavior:"smooth"})}
const stat=(l,n)=>`<div class="stat"><span>${l}</span><b>${n}</b></div>`;
function renderAll(){renderHome();renderDaily();renderSchedule();renderStudents();renderContacts();renderCounseling();renderPreview();renderReports()}
function renderHome(){let signed=D.sign.filter(x=>x.date===T()).length;home.innerHTML=`<div class="card panel"><div class="head"><h2>今日概況</h2><span>${T()}</span></div><div class="stats">${stat("今日功課",D.homework.filter(x=>x.date===T()).length)}${stat("今日公告",D.ann.filter(x=>x.date.startsWith(T())).length)}${stat("個別聯絡",D.notices.filter(x=>x.date.startsWith(T())).length)}${stat("已簽閱",signed+"/"+D.students.length)}</div></div><div class="card panel"><div class="head"><h2>今日簽閱</h2></div><div class="list">${D.students.map(s=>{let x=D.sign.find(v=>v.date===T()&&v.sid===s.id);return `<div class="item">${s.seat}號 ${E(s.name)}｜${x?"✅ "+E(x.time):"❌ 未簽閱"}</div>`}).join("")}</div></div>`}
function checks(arr,cls){return arr.map(x=>`<label><input type="checkbox" class="${cls}" value="${E(x)}"> ${E(x)}</label>`).join("")}
function renderDaily(){daily.innerHTML=`<div class="card panel"><div class="head"><h2>今日聯絡簿</h2><span class="badge">全班與個別內容整合在同一頁</span></div>
<h3>全班內容</h3><div class="grid2"><div class="field"><label>日期</label><input id="dDate" type="date" value="${T()}"></div><div class="field"><label>今日提醒</label><input id="classReminder" placeholder="例如：明天穿運動服、帶直笛"></div></div>
<div class="grid2"><div class="field"><label>功課科目</label><input id="hwSub" placeholder="國文"></div><div class="field"><label>功課內容</label><input id="hwText" placeholder="習作 P.32"></div></div><button class="btn secondary" onclick="addHW()">加入今日功課</button>
<div class="field"><label>統一公告</label><textarea id="classAnn" placeholder="一次發布，全班家長都能看到"></textarea></div><div class="grid2"><div class="field"><label>附件名稱</label><input id="fileName" placeholder="校外教學通知.pdf"></div><div class="field"><label>Google Drive 分享連結</label><input id="fileUrl" placeholder="https://drive.google.com/..."></div></div><button class="btn" onclick="publishClass()">發布全班內容</button></div>
<div class="card panel"><div class="head"><h2>個別學生聯絡</h2><span class="badge">直接選座號／姓名</span></div><div class="grid2"><div class="field"><label>學生與家長</label><select id="dStudent">${D.students.map(s=>`<option value="${s.id}">${s.seat}號 ${E(s.name)}｜家長：${E(s.parent)}</option>`).join("")}</select></div><div class="field"><label>日期</label><input id="iDate" type="date" value="${T()}"></div></div><div class="safe">送出前會再次顯示學生及家長姓名，避免誤傳。</div>
<h3>出缺勤</h3><div class="grid2"><div class="field"><label>到校狀態</label><select id="status"><option>準時到校</option><option>遲到</option><option>未到</option><option>早退</option></select></div><div class="field"><label>請假別</label><select id="leave"><option value="">空白（表示到校）</option><option>事假</option><option>病假</option><option>喪假</option><option>未請假</option></select></div><div class="field"><label>到校時間</label><input id="arr" type="time"></div><div class="field"><label>離校／請假時間</label><input id="levt" type="time"></div><div class="field"><label>請假方式</label><select id="method"><option value="">空白（表示到校）</option><option>家長來電</option><option>家長用 LINE 通知</option><option>學生告知</option><option>因未到校聯繫告知</option></select></div></div>
<h3>發生在哪一堂課？（可複選）</h3><div class="options">${checks(Courses,"course")}</div><h3>學習狀況（可複選）</h3><div class="options">${checks(Learn,"learn")}</div><h3>日常／課堂表現（可複選）</h3><div class="options">${checks(Behave,"behave")}</div><h3>處理方式（可複選）</h3><div class="options">${checks(Handle,"handle")}</div>
<div class="field"><label>老師關鍵字</label><input id="kw" placeholder="例如：第二節、提醒兩次、已改善"></div><div class="field"><label>家長可見防禦性文字</label><textarea id="out"></textarea></div><button class="btn secondary" onclick="gen()">產生文字</button> <button class="btn" onclick="sendDaily()">確認對象並送出</button></div>`}
function addHW(){if(!hwSub.value.trim()||!hwText.value.trim())return;D.homework.push({date:dDate.value,subject:hwSub.value.trim(),content:hwText.value.trim()});save();alert("已加入今日功課")}
function publishClass(){if(classReminder.value.trim())D.homework.push({date:dDate.value,subject:"明日提醒",content:classReminder.value.trim()});if(classAnn.value.trim()||fileUrl.value.trim())D.ann.unshift({date:dDate.value+" "+new Date().toLocaleTimeString("zh-TW"),target:"all",text:classAnn.value.trim(),file:fileName.value.trim(),url:fileUrl.value.trim()});save();alert("全班內容已發布")}
function selected(cls){return [...document.querySelectorAll("."+cls+":checked")].map(x=>x.value)}
function gen(){let c=selected("course"),l=selected("learn"),b=selected("behave"),h=selected("handle"),parts=[];if(c.length)parts.push(`今日於${c.join("、")}課程中，`);let issues=[...l,...b];if(issues.length){let generated=issues.map(x=>phrases[x]||`觀察到「${x}」的情形。`).join("");parts.push(generated)}if(h.length)parts.push(`處理方式：${h.join("、")}。`);if(kw.value.trim())parts.push(`補充觀察：${kw.value.trim()}。`);out.value=parts.join("")}
function sendDaily(){let s=S(dStudent.value);if(!out.value.trim())return alert("請先產生或輸入內容");if(!confirm(`即將送給：${s.seat}號 ${s.name}\n家長：${s.parent||"未填"}\n\n確定送出？`))return;D.attendance.push({date:iDate.value,time:new Date().toLocaleTimeString("zh-TW"),sid:s.id,status:status.value,leave:leave.value,arrival:arr.value,leaveTime:levt.value,method:method.value});D.notices.push({date:iDate.value+" "+new Date().toLocaleTimeString("zh-TW"),sid:s.id,content:out.value,object:s.parent||"家長",handling:selected("handle").join("、")});save();alert("已送出")}
function renderSchedule(){let days=["星期一","星期二","星期三","星期四","星期五"],periods=[1,2,3,4,5,6,7];schedule.innerHTML=`<div class="card panel"><div class="head"><h2>課表與功課</h2><button class="btn secondary" onclick="exportTable()">匯出 Excel 課表</button></div><div style="overflow:auto"><table style="width:100%;min-width:700px;border-collapse:collapse"><tr><th>節次</th>${days.map(d=>`<th>${d}</th>`).join("")}</tr>${periods.map(p=>`<tr><td>第${p}節</td>${days.map(d=>`<td><input value="${E(D.timetable[d+"-"+p]||"")}" onchange="D.timetable['${d}-${p}']=this.value;save()"></td>`).join("")}</tr>`).join("")}</table></div></div>`}
function renderStudents(){students.innerHTML=`<div class="card panel"><div class="head"><h2>班級與學生</h2><button class="btn secondary" onclick="template()">下載 Excel 範本</button></div><div class="list">${D.students.map(s=>`<div class="item">${s.seat}號 ${E(s.name)}｜家長：${E(s.parent)}｜電話：${E(s.phone)}｜升學意向：${E(s.adv)}</div>`).join("")}</div></div>`}
function renderContacts(){contacts.innerHTML=`<div class="card panel"><div class="head"><h2>親師聯繫</h2><span class="badge">可一鍵轉入輔導紀錄</span></div><div class="list">${D.contacts.map(c=>`<div class="item"><b>${E(c.date)}｜${E(S(c.sid)?.name)}</b><div>${E(c.content)}</div><button class="btn secondary" onclick="toCounsel('${c.id}')">加入輔導紀錄</button></div>`).join("")||'<div class="muted">尚無家長反應或提問</div>'}</div></div>`}
function toCounsel(id){let c=D.contacts.find(x=>x.id===id);D.counseling.push({date:c.date.split(" ")[0],time:c.date.split(" ")[1]||"",sid:c.sid,object:"家長",content:c.content,handling:"待補充",source:"親師聯繫"});save();alert("已加入輔導紀錄")}
function renderCounseling(){counseling.innerHTML=`<div class="card panel"><div class="head"><h2>輔導／晤談紀錄</h2></div><div class="grid2"><div class="field"><label>日期</label><input id="cDate" type="date" value="${T()}"></div><div class="field"><label>時間</label><input id="cTime" type="time"></div><div class="field"><label>學生</label><select id="cStudent">${D.students.map(s=>`<option value="${s.id}">${s.seat}號 ${E(s.name)}</option>`).join("")}</select></div><div class="field"><label>晤談對象</label><select id="cObj"><option>學生</option><option>家長</option><option>任課老師</option><option>輔導老師</option><option>學務處</option><option>校護</option><option>其他</option></select></div></div><div class="field"><label>內容</label><textarea id="cContent"></textarea></div><div class="field"><label>處理方式</label><textarea id="cHandling"></textarea></div><button class="btn" onclick="addCounsel()">儲存</button><div class="list" style="margin-top:13px">${D.counseling.map(c=>`<div class="item"><b>${E(c.date)} ${E(c.time)}｜${E(S(c.sid)?.name)}｜${E(c.object)}</b><div>${E(c.content)}</div><div class="small">處理方式：${E(c.handling)}</div></div>`).join("")||'<div class="muted">尚無紀錄</div>'}</div></div>`}
function addCounsel(){D.counseling.push({date:cDate.value,time:cTime.value,sid:cStudent.value,object:cObj.value,content:cContent.value.trim(),handling:cHandling.value.trim(),source:"教師建立"});save()}
function renderPreview(){preview.innerHTML=`<div class="card panel"><div class="head"><h2>家長預覽</h2><select id="pv" onchange="previewCard(this.value)">${D.students.map(s=>`<option value="${s.id}">${s.seat}號 ${E(s.name)}</option>`).join("")}</select></div><div id="pvbox"></div></div>`;if(D.students[0])setTimeout(()=>previewCard(D.students[0].id),0)}
function previewCard(id){let s=S(id),hw=D.homework.filter(x=>x.date===T()),an=D.ann.filter(x=>x.target==="all"||x.target===id),ns=D.notices.filter(x=>x.sid===id&&x.date.startsWith(T()));pvbox.innerHTML=`<h3>${s.seat}號 ${E(s.name)}家長</h3><h4>今日功課與提醒</h4>${hw.map(x=>`<div class="item"><b>${E(x.subject)}</b>｜${E(x.content)}</div>`).join("")||"無"}<h4>統一／個別公告</h4>${an.map(x=>`<div class="item">${E(x.text)} ${x.url?`<a target="_blank" href="${E(x.url)}">${E(x.file||"附件")}</a>`:""}</div>`).join("")||"無"}<h4>個別聯絡</h4>${ns.map(x=>`<div class="item">${E(x.content)}</div>`).join("")||"無"}<h4>親師聯繫（選填）</h4><textarea disabled placeholder="有需要反應或提問時再填寫"></textarea><label><input type="checkbox" disabled style="width:auto"> 我已詳閱今日聯絡簿內容</label>`}
function renderReports(){reports.innerHTML=`<div class="card panel"><div class="head"><h2>Excel 匯入／匯出</h2></div><p>學生歷程 Excel 包含日期、時間、晤談對象、內容、處理方式與建立來源。</p><select id="rs">${D.students.map(s=>`<option value="${s.id}">${s.seat}號 ${E(s.name)}</option>`).join("")}</select><br><button class="btn" onclick="exp([rs.value],S(rs.value).name+'_學生歷程.xlsx')" style="margin-top:9px">匯出個別學生</button> <button class="btn secondary" onclick="exp(D.students.map(x=>x.id),'全班學生歷程.xlsx')">匯出全班</button></div>`}
function exp(ids,name){let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.students.filter(x=>ids.includes(x.id))),"學生資料");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.attendance.filter(x=>ids.includes(x.sid)).map(x=>({"日期":x.date,"時間":x.time,"學生":S(x.sid)?.name,"到校狀態":x.status,"請假別":x.leave,"到校時間":x.arrival,"離校／請假時間":x.leaveTime,"請假方式":x.method}))),"出缺勤");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.notices.filter(x=>ids.includes(x.sid)).map(x=>({"日期時間":x.date,"學生":S(x.sid)?.name,"聯繫對象":x.object,"內容":x.content,"處理方式":x.handling}))),"個別聯絡");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.contacts.filter(x=>ids.includes(x.sid)).map(x=>({"日期時間":x.date,"學生":S(x.sid)?.name,"對象":"家長","內容":x.content,"處理方式":"待處理"}))),"親師聯繫");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.counseling.filter(x=>ids.includes(x.sid)).map(x=>({"日期":x.date,"時間":x.time,"學生":S(x.sid)?.name,"晤談對象":x.object,"內容":x.content,"處理方式":x.handling,"來源":x.source}))),"輔導晤談");XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.sign.filter(x=>ids.includes(x.sid)).map(x=>({"日期":x.date,"簽閱時間":x.time,"學生":S(x.sid)?.name}))),"家長簽閱");XLSX.writeFile(wb,name)}
function template(){let ws=XLSX.utils.aoa_to_sheet([["座號","姓名","家長姓名","家長電話","家長地址","升學意向"],[1,"王小明","王媽媽","0912-000-000","","高中"]]),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"學生家長資料");XLSX.writeFile(wb,"學生家長資料範本.xlsx")}
function exportTable(){let days=["星期一","星期二","星期三","星期四","星期五"],rows=[1,2,3,4,5,6,7].map(p=>{let r={"節次":`第${p}節`};days.forEach(d=>r[d]=D.timetable[d+"-"+p]||"");return r}),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"功課表");XLSX.writeFile(wb,"班級功課表.xlsx")}
function renderParent(){let s=CP,hw=D.homework.filter(x=>x.date===T()),an=D.ann.filter(x=>x.target==="all"||x.target===s.id),ns=D.notices.filter(x=>x.sid===s.id&&x.date.startsWith(T())),sg=D.sign.find(x=>x.sid===s.id&&x.date===T());parentView.innerHTML=`<h3>${s.seat}號 ${E(s.name)}家長</h3><h4>今日功課與提醒</h4>${hw.map(x=>`<div class="item"><b>${E(x.subject)}</b>｜${E(x.content)}</div>`).join("")||"無"}<h4>統一／個別公告</h4>${an.map(x=>`<div class="item">${E(x.text)} ${x.url?`<a target="_blank" href="${E(x.url)}">${E(x.file||"附件")}</a>`:""}</div>`).join("")||"無"}<h4>個別聯絡</h4>${ns.map(x=>`<div class="item">${E(x.content)}</div>`).join("")||"無"}<h4>親師聯繫（選填）</h4><textarea id="pm" placeholder="有需要反應或提問時再填寫"></textarea><label><input id="ps" type="checkbox" style="width:auto" ${sg?"checked disabled":""}> 我已詳閱今日聯絡簿內容</label><br><button class="btn" onclick="submitP()" ${sg?"disabled":""} style="margin-top:9px">${sg?"今日已簽閱":"送出並簽閱"}</button>${sg?`<div class="muted">簽閱時間：${E(sg.time)}</div>`:""}`}
function submitP(){if(!ps.checked)return alert("請先勾選已詳閱");if(pm.value.trim())D.contacts.unshift({id:"pc"+Date.now(),date:N(),sid:CP.id,content:pm.value.trim()});D.sign.push({date:T(),time:N(),sid:CP.id});save();renderParent();alert("已完成今日簽閱")}
renderAll();
</script>
</body>
</html>
