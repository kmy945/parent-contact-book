<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1587a8">
<link rel="manifest" href="manifest.webmanifest">
<title>親師聯絡簿 v9.3</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<style>
:root{
  --navy:#153653;--blue:#258aca;--aqua:#35b8c7;--mint:#49b99a;
  --paper:#fff;--bg:#eef8fd;--line:#d8e8f0;--muted:#6d8190;
  --shadow:0 12px 30px rgba(42,102,138,.12);--radius:22px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--navy);background:var(--bg)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:13px}
.btn{border:0;border-radius:14px;padding:11px 16px;background:linear-gradient(135deg,var(--blue),var(--aqua));color:#fff;font-weight:700}
.btn.secondary{background:#edf7fb;color:var(--navy);border:1px solid var(--line)}
.btn.danger{background:#fff1f1;color:#a23e3e;border:1px solid #f2cccc}
.field{display:grid;gap:7px;margin:12px 0}.field label{font-weight:700}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px 12px;background:#fff;color:var(--navy)}
textarea{min-height:110px;resize:vertical}
.card{background:rgba(255,255,255,.95);border:1px solid rgba(255,255,255,.9);border-radius:var(--radius);box-shadow:var(--shadow)}
/* Original cover remains unchanged */
.login-screen{
  min-height:100vh;
  position:relative;
  overflow:hidden;
  background:#eaf5fb;
}
.cover-pane{
  position:absolute;
  inset:0;
  background-color:#eaf5fb;
  background-image:url("cover-clean.jpg");
  background-position:center center;
  background-repeat:no-repeat;
  background-size:contain;
  min-height:100vh;
}
.login-pane{
  position:relative;
  z-index:2;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  padding:clamp(18px,4vw,56px);
  background:linear-gradient(90deg,rgba(234,245,251,0) 0%,rgba(234,245,251,.16) 48%,rgba(234,245,251,.78) 70%,rgba(234,245,251,.94) 100%);
}
.login-box{
  width:min(460px,100%);
  padding:30px;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(12px);
}
.brand-title{font-size:32px;margin:0 0 8px}.login-tabs{display:flex;gap:8px;background:#eaf5fa;padding:5px;border-radius:15px;margin:20px 0}
.login-tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:11px}
.login-tabs button.on{background:white;box-shadow:0 5px 14px rgba(22,75,105,.1);font-weight:700}
.app{min-height:100vh;display:grid;grid-template-columns:228px 1fr}
.sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(#f8fdff,#eaf7fd);border-right:1px solid var(--line);padding:18px 12px;overflow:auto}
.side-brand{padding:12px 14px 20px;font-size:24px;font-weight:800}
.nav-btn{width:100%;border:0;background:transparent;border-radius:13px;padding:11px 12px;text-align:left;margin:3px 0;color:var(--navy)}
.nav-btn:hover,.nav-btn.on{background:#dff2fb;color:#166c9b;font-weight:800}
.main{min-width:0}
.ocean-header{position:relative;overflow:hidden;min-height:220px;padding:24px 28px;background:
radial-gradient(circle at 15% 20%,rgba(255,255,255,.85) 0 9px,transparent 10px),
radial-gradient(circle at 35% 35%,rgba(255,255,255,.7) 0 15px,transparent 16px),
radial-gradient(circle at 70% 18%,rgba(255,255,255,.75) 0 22px,transparent 23px),
linear-gradient(180deg,#dff5ff 0%,#bfeafa 52%,#85d0e5 100%)}
.ocean-header:after{content:"";position:absolute;left:-5%;right:-5%;bottom:-35px;height:100px;background:rgba(255,255,255,.75);border-radius:50% 45% 0 0/40% 35% 0 0;transform:rotate(-2deg)}
.header-row{position:relative;z-index:2;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.header-tools{display:flex;gap:10px;align-items:center}
.sync{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border-radius:999px;background:#ffffffc7;color:#268269;font-weight:700}
.class-title{position:relative;z-index:2;margin-top:36px}
.class-title h1{font-size:36px;margin:0 0 8px}
.content{padding:0 24px 40px;position:relative;margin-top:-24px;z-index:4}
.panel{padding:22px;margin-bottom:18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.panel-head h2{margin:0;font-size:21px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.stat{padding:16px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(150deg,#fff,#f5fbfe)}
.stat b{display:block;font-size:28px;margin-top:4px}.stat span{font-size:13px;color:var(--muted)}
.quick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.quick{border:1px solid var(--line);border-radius:17px;background:#fff;padding:17px 10px;text-align:center}
.quick strong{display:block;margin-top:7px}
.columns{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
.list{display:grid;gap:9px}.list-item{padding:12px;border:1px solid var(--line);border-radius:14px;background:#fbfdff}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}
th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8f6fb;font-size:12px}
.badge.good{background:#e8f8ef;color:#28734c}.badge.warn{background:#fff4dc;color:#95620a}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.check-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.check-item{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:13px;padding:10px;background:#fff}
.check-item input{width:auto;margin-top:3px}
.risk-box{padding:13px;border-radius:14px;background:#fff8e8;border:1px solid #f1dda7}
.safe-box{padding:13px;border-radius:14px;background:#edf9f3;border:1px solid #c5e7d5}
.subject-chips{display:flex;gap:8px;flex-wrap:wrap}.subject-chip{padding:8px 12px;border-radius:999px;background:#eaf6fb;border:1px solid var(--line)}
.bottom-nav{display:none}
.modal{position:fixed;inset:0;background:rgba(14,47,68,.48);display:grid;place-items:center;padding:16px;z-index:100}
.dialog{width:min(720px,100%);max-height:90vh;overflow:auto;padding:22px}
@media(max-width:1050px){
  .stats,.quick-grid{grid-template-columns:repeat(3,1fr)}
  .columns{grid-template-columns:1fr}
}

@media(min-width:801px) and (max-width:1200px){
  .cover-pane{
    background-size:contain;
    background-position:left center;
  }
  .login-pane{
    padding:28px;
    background:linear-gradient(90deg,rgba(234,245,251,0) 0%,rgba(234,245,251,.08) 42%,rgba(234,245,251,.82) 66%,#eaf5fb 100%);
  }
  .login-box{width:min(430px,46vw)}
}

@media(max-width:800px){
  .login-screen{min-height:100vh}
  .cover-pane{
    position:absolute;
    inset:0;
    min-height:100vh;
    background-size:contain;
    background-position:center top;
  }
  .login-pane{
    min-height:100vh;
    align-items:flex-end;
    justify-content:center;
    padding:16px 14px max(20px,env(safe-area-inset-bottom));
    background:linear-gradient(180deg,rgba(234,245,251,0) 0%,rgba(234,245,251,.06) 48%,rgba(234,245,251,.88) 72%,#eaf5fb 100%);
  }
  .login-box{
    width:min(520px,100%);
    padding:22px;
    margin-bottom:8px;
  }
  .app{display:block}.sidebar{display:none}.content{padding:0 12px 90px}.ocean-header{min-height:190px;padding:18px}
  .class-title h1{font-size:28px}.stats,.quick-grid{grid-template-columns:repeat(2,1fr)}
  .form-grid,.check-grid{grid-template-columns:1fr}
  .bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:white;border-top:1px solid var(--line);z-index:50}
  .bottom-nav button{border:0;background:#fff;padding:10px 4px;font-size:12px;color:var(--navy)}
}

.student-card{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}
.student-card.active{outline:3px solid #9ddff1}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.notice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:800px){.notice-grid{grid-template-columns:1fr}}

.file-preview{margin-top:10px;border:1px solid var(--line);border-radius:14px;padding:12px;background:#fbfdff}
.file-preview img{max-width:100%;max-height:520px;border-radius:10px;display:block;margin:auto}
.file-preview iframe,.file-preview object{width:100%;height:560px;border:0;border-radius:10px;background:#fff}
.docx-preview{max-height:560px;overflow:auto;background:#fff;padding:18px;border-radius:10px;color:#222}
.attachment-row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.attachment-row:last-child{border-bottom:0}
</style>
</head>
<body>
<section id="loginScreen" class="login-screen">
  <div class="cover-pane" aria-label="使用者原本設計的親師聯絡簿封面"></div>
  <div class="login-pane">
    <div class="card login-box">
      <h1 class="brand-title">親師聯絡簿</h1>
      <p class="muted">用心陪伴・溫暖支持・一起陪伴孩子成長</p>
      <div class="login-tabs">
        <button id="teacherTab" class="on" onclick="switchLogin('teacher')">教師登入</button>
        <button id="parentTab" onclick="switchLogin('parent')">家長登入</button>
      </div>
      <div id="teacherLogin">
        <button class="btn" style="width:100%;margin-bottom:10px" onclick="googleLogin()">使用 Google 帳號登入</button>
        <button class="btn secondary" style="width:100%" onclick="visitorLogin()">訪客體驗</button>
      </div>
      <div id="parentLogin" class="hidden">
        <div class="field"><label>家長帳號</label><input id="parentAccount" placeholder="例如：70601"></div>
        <div class="field"><label>密碼</label><input id="parentPassword" type="password"></div>
        <button class="btn" style="width:100%" onclick="parentSignIn()">登入查看</button>
      </div>
    </div>
  </div>
</section>

<section id="teacherApp" class="app hidden">
  <aside class="sidebar">
    <div class="side-brand">親師聯絡簿</div>
    <button class="nav-btn on" data-page="dashboard" onclick="go('dashboard',this)">首頁</button>
    <button class="nav-btn" data-page="contact" onclick="go('contact',this)">今日聯絡簿</button>
    <button class="nav-btn" data-page="classes" onclick="go('classes',this)">班級／學年度</button>
    <button class="nav-btn" data-page="students" onclick="go('students',this)">學生資料</button>
    <button class="nav-btn" data-page="studentDetail" onclick="go('studentDetail',this)">學生個別頁面</button>
    <button class="nav-btn" data-page="subjects" onclick="go('subjects',this)">科別管理</button>
    <button class="nav-btn" data-page="parents" onclick="go('parents',this)">家長留言</button>
    <button class="nav-btn" data-page="announcements" onclick="go('announcements',this)">統一／個別公告</button>
    <button class="nav-btn" data-page="preview" onclick="go('preview',this)">家長預覽區</button>
    <button class="nav-btn" data-page="reports" onclick="go('reports',this)">統計與匯出</button>
    <button class="nav-btn" data-page="settings" onclick="go('settings',this)">設定</button>
    <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
    <button class="nav-btn" onclick="go('assistant',this)">AI 通知助手</button>
    <button class="nav-btn" onclick="logout()">登出</button>
  </aside>
  <main class="main">
    <header class="ocean-header">
      <div class="header-row">
        <div>
          <select id="classSelect" onchange="changeClass()" style="min-width:280px"></select>
          <div class="sync" id="syncBadge">☁ 教師雲端模式・同步中</div>
        </div>
        <div class="header-tools">
          <button class="btn secondary" onclick="searchStudent()">搜尋</button>
          <button class="btn secondary" onclick="logout()">登出</button>
        </div>
      </div>
      <div class="class-title">
        <div class="muted" id="greeting">Meng老師，晚上好！</div>
        <h1 id="className">706班（六出奇技）</h1>
        <div id="schoolYear">115學年度</div>
      </div>
    </header>
    <div class="content">
      <section id="dashboard" class="page"></section>
      <section id="contact" class="page hidden"></section>
      <section id="classes" class="page hidden"></section>
      <section id="students" class="page hidden"></section>
      <section id="studentDetail" class="page hidden"></section>
      <section id="subjects" class="page hidden"></section>
      <section id="parents" class="page hidden"></section>
      <section id="announcements" class="page hidden"></section>
      <section id="preview" class="page hidden"></section>
      <section id="reports" class="page hidden"></section>
      <section id="settings" class="page hidden"></section>
      <section id="assistant" class="page hidden"></section>
    </div>
  </main>
  <nav class="bottom-nav">
    <button onclick="go('dashboard')">首頁</button><button onclick="go('contact')">聯絡簿</button>
    <button onclick="go('students')">學生</button><button onclick="go('reports')">統計</button><button onclick="go('settings')">設定</button>
  </nav>
</section>

<section id="parentApp" class="hidden" style="min-height:100vh;padding:18px;background:#eef8fd">
  <div style="max-width:760px;margin:auto">
    <div class="card panel">
      <div class="panel-head"><h2>家長專區</h2><button class="btn secondary" onclick="logout()">登出</button></div>
      <div id="parentContent"></div>
    </div>
  </div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-storage.js";

const firebaseConfig={
  apiKey:"AIzaSyBNr-1S-xSeDvESdq3tYbWjIQ8pmgOjpd8",
  authDomain:"parent-contact-book.firebaseapp.com",
  projectId:"parent-contact-book",
  storageBucket:"parent-contact-book.firebasestorage.app",
  messagingSenderId:"241202878085",
  appId:"1:241202878085:web:fb598315e315aa33cbbbec"
};
let app,auth,db,storage;
try{app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);storage=getStorage(app)}catch(e){console.warn(e)}

const defaultSubjects=["國文","英語","數學","自然","社會","健康與體育","音樂","視覺藝術","表演藝術","資訊科技","生活科技","輔導","家政","童軍","班級事務","導師時間"];
const safeTemplates={
 "課堂交談":"今日課堂中，孩子曾有與同學交談的情形，老師已於當下提醒；經提醒後，孩子已能逐步回到課程活動。",
 "作業未交":"今日尚未在規定時間內完成作業繳交，老師已提醒補交；敬請家長協助孩子確認後續完成情形。",
 "精神不濟":"今日課堂中，孩子曾出現精神較為疲倦的情形，經提醒後已恢復參與；敬請家長協助留意近期作息。",
 "遲到":"孩子今日於規定時間後到校，老師已完成到校紀錄並提醒留意時間安排；敬請家長共同協助。",
 "手機使用":"今日課程進行期間，孩子曾使用手機，老師已依班級規範提醒並協助收妥；後續將持續引導孩子遵守課堂使用規定。",
 "人際互動":"今日與同學互動時曾出現意見不同的情形，老師已陪同釐清並引導合宜表達；目前雙方已能回到課程活動。",
 "優良表現":"孩子今日能主動參與課堂活動，並依照指示完成任務，值得肯定與鼓勵。"
};
const riskyWords=["很懶","很皮","沒家教","故意","問題學生","態度很差","白目","愛找麻煩","很糟糕","不受教","沒禮貌","笨","散漫"];

const defaultData={
 version:"9.2",
 classes:[{id:"c706",schoolYear:115,grade:7,classNo:6,name:"六出奇技",teacher:"Meng",status:"active"}],
 currentClassId:"c706",
 subjects:defaultSubjects.map((name,i)=>({id:"s"+i,name,enabled:true,custom:false})),
 students:[
  {id:"stu1",classId:"c706",seat:1,name:"王小明",studentNo:"",gender:"",birthday:"",phone:"",address:"",parentName:"王媽媽",parentPhone:"",parentAddress:"",account:"70601",password:"123456",status:"到校",advancement:"高中",notes:""},
  {id:"stu2",classId:"c706",seat:2,name:"李小華",studentNo:"",gender:"",birthday:"",phone:"",address:"",parentName:"李爸爸",parentPhone:"",parentAddress:"",account:"70602",password:"123456",status:"到校",advancement:"高職",notes:""}
 ],
 notices:[],
 announcements:[],
 attendance:[],
 parentMessages:[],
 settings:{teacherName:"Meng",positiveReminder:true}
};

let data=JSON.parse(localStorage.getItem("pcb_v9_2_data")||"null")||structuredClone(defaultData);
data.classes ||= defaultData.classes; data.students ||= []; data.notices ||= []; data.announcements ||= [];
data.attendance ||= []; data.parentMessages ||= []; data.subjects ||= defaultData.subjects; data.settings ||= defaultData.settings;
let mode="visitor",uid=null,currentParent=null,selectedStudentId=null,announcementFiles=[];

function save(){
 localStorage.setItem("pcb_v9_2_data",JSON.stringify(data));
 if(mode==="cloud"&&uid&&db) setDoc(doc(db,"teachers",uid,"appData","contactBookV92"),data,{merge:true}).catch(console.error);
 renderAll();
}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function currentClass(){return data.classes.find(c=>c.id===data.currentClassId)||data.classes[0]}
function classStudents(){return data.students.filter(s=>s.classId===data.currentClassId).sort((a,b)=>Number(a.seat)-Number(b.seat))}
function studentById(id){return data.students.find(s=>s.id===id)}
function today(){return new Date().toISOString().slice(0,10)}
function download(name,text,type="text/csv;charset=utf-8"){const blob=new Blob(["\ufeff"+text],{type});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}
function csvCell(v){return `"${String(v??"").replaceAll('"','""')}"`}
function switchLogin(type){
 teacherLogin.classList.toggle("hidden",type!=="teacher");parentLogin.classList.toggle("hidden",type!=="parent");
 teacherTab.classList.toggle("on",type==="teacher");parentTab.classList.toggle("on",type==="parent");
}
window.switchLogin=switchLogin;
window.visitorLogin=()=>{mode="visitor";enterTeacher()};
window.googleLogin=async()=>{
 try{
  const result=await signInWithPopup(auth,new GoogleAuthProvider());uid=result.user.uid;mode="cloud";
  const snap=await getDoc(doc(db,"teachers",uid,"appData","contactBookV92"));
  if(snap.exists())data=snap.data(); else await setDoc(doc(db,"teachers",uid,"appData","contactBookV92"),data);
  enterTeacher();
 }catch(e){alert("Google 登入失敗："+e.message)}
};
function enterTeacher(){loginScreen.classList.add("hidden");parentApp.classList.add("hidden");teacherApp.classList.remove("hidden");renderAll()}
window.parentSignIn=()=>{
 const student=data.students.find(s=>s.account===parentAccount.value.trim()&&s.password===parentPassword.value);
 if(!student)return alert("帳號或密碼不正確");
 currentParent=student;loginScreen.classList.add("hidden");teacherApp.classList.add("hidden");parentApp.classList.remove("hidden");renderParent();
};
window.logout=async()=>{try{if(auth?.currentUser)await signOut(auth)}catch(e){} location.reload()};
window.go=(id,btn)=>{
 document.querySelectorAll(".page").forEach(x=>x.classList.toggle("hidden",x.id!==id));
 document.querySelectorAll(".nav-btn").forEach(x=>x.classList.toggle("on",x.dataset.page===id));
 window.scrollTo({top:0,behavior:"smooth"});
};
window.changeClass=()=>{data.currentClassId=classSelect.value;selectedStudentId=null;save()};
window.searchStudent=()=>{const q=prompt("輸入座號或姓名");if(!q)return;const s=classStudents().find(x=>String(x.seat)===q||x.name.includes(q));if(!s)return alert("找不到學生");selectedStudentId=s.id;go("studentDetail");renderStudentDetail()};

function renderAll(){
 renderHeader();renderDashboard();renderClasses();renderStudents();renderStudentDetail();renderSubjects();
 renderContact();renderParents();renderAnnouncements();renderPreview();renderReports();renderSettings();renderAssistant();
}
function renderHeader(){
 const c=currentClass();classSelect.innerHTML=data.classes.filter(x=>x.status!=="graduated").map(x=>`<option value="${x.id}">${x.schoolYear}學年度・${x.grade}${String(x.classNo).padStart(2,"0")}班（${esc(x.name)}）</option>`).join("");

window.downloadStudentTemplate=()=>{
 const ws=XLSX.utils.aoa_to_sheet([
  ["座號","姓名","學號","性別","生日","學生電話","學生地址","家長姓名","家長電話","家長地址","升學意向"],
  [1,"王小明","","","2013/01/01","","","王媽媽","","","高中"]
 ]);
 ws["!cols"]=[{wch:8},{wch:14},{wch:14},{wch:8},{wch:14},{wch:16},{wch:28},{wch:14},{wch:16},{wch:28},{wch:12}];
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"學生與家長資料");
 XLSX.writeFile(wb,"學生家長資料匯入範本.xlsx");

window.importStudentsExcel=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  const buffer=await f.arrayBuffer();const wb=XLSX.read(buffer,{type:"array",cellDates:true});
  const ws=wb.Sheets[wb.SheetNames[0]];const rows=XLSX.utils.sheet_to_json(ws,{defval:"",raw:false});
  if(!rows.length)return alert("Excel 沒有可匯入的資料");
  rows.forEach(r=>{
   const seat=Number(r["座號"]);if(!seat)return;
   const old=classStudents().find(s=>Number(s.seat)===seat);
   const s=old||{id:"stu"+Date.now()+Math.random(),classId:data.currentClassId,status:"到校",password:"123456"};
   Object.assign(s,{
    seat,name:String(r["姓名"]||s.name||""),studentNo:String(r["學號"]||""),gender:String(r["性別"]||""),
    birthday:String(r["生日"]||""),phone:String(r["學生電話"]||""),address:String(r["學生地址"]||""),
    parentName:String(r["家長姓名"]||""),parentPhone:String(r["家長電話"]||""),parentAddress:String(r["家長地址"]||""),
    advancement:String(r["升學意向"]||"未定")
   });
   if(!old){const c=currentClass();s.account=`${c.grade}${String(c.classNo).padStart(2,"0")}${String(seat).padStart(2,"0")}`;data.students.push(s)}
  });
  save();alert(`已匯入 ${rows.length} 筆 Excel 資料`);
 }catch(err){console.error(err);alert("Excel 匯入失敗，請確認使用範本欄位")}
 e.target.value="";
};

window.handleAnnouncementFiles=async e=>{
 const files=[...e.target.files];
 const max=15*1024*1024;
 announcementFiles=[];
 for(const file of files){
  if(file.size>max){alert(`${file.name} 超過 15MB，未加入`);continue}
  const item={name:file.name,type:file.type||guessMime(file.name),file,localUrl:URL.createObjectURL(file)};
  announcementFiles.push(item);
 }
 newAttachmentPreview.innerHTML=announcementFiles.map((f,i)=>`<div class="file-preview"><div class="attachment-row"><b>${esc(f.name)}</b><button class="btn danger" onclick="removePendingAttachment(${i})">移除</button></div><div id="pendingPreview${i}"></div></div>`).join("");
 announcementFiles.forEach((f,i)=>previewRawFile(f.file,document.getElementById(`pendingPreview${i}`)));
};
window.removePendingAttachment=i=>{announcementFiles.splice(i,1);announcementFileInput.value="";newAttachmentPreview.innerHTML=announcementFiles.map((f,j)=>`<div class="file-preview"><div class="attachment-row"><b>${esc(f.name)}</b><button class="btn danger" onclick="removePendingAttachment(${j})">移除</button></div><div id="pendingPreview${j}"></div></div>`).join("");announcementFiles.forEach((f,j)=>previewRawFile(f.file,document.getElementById(`pendingPreview${j}`)))};
function guessMime(name){const n=name.toLowerCase();if(n.endsWith(".pdf"))return"application/pdf";if(n.endsWith(".docx"))return"application/vnd.openxmlformats-officedocument.wordprocessingml.document";if(n.endsWith(".doc"))return"application/msword";if(/\.(png|jpg|jpeg|gif|webp)$/i.test(n))return"image/"+n.split(".").pop().replace("jpg","jpeg");return"application/octet-stream"}
async function previewRawFile(file,box){
 if(!box)return;const type=file.type||guessMime(file.name);const url=URL.createObjectURL(file);
 if(type.startsWith("image/"))box.innerHTML=`<img src="${url}" alt="${esc(file.name)}">`;
 else if(type==="application/pdf")box.innerHTML=`<iframe src="${url}" title="${esc(file.name)}"></iframe>`;
 else if(file.name.toLowerCase().endsWith(".docx")){
  try{const result=await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()});box.innerHTML=`<div class="docx-preview">${result.value}</div>`}
  catch(e){box.innerHTML='<div class="risk-box">Word 預覽失敗，但仍可上傳與下載。</div>'}
 }else box.innerHTML='<div class="muted">此 Word 格式無法在瀏覽器直接預覽，發布後仍可下載查看。</div>';
}
async function persistAttachment(item){
 if(mode==="cloud"&&uid&&storage){
  const safeName=item.name.replace(/[^\w.\-\u4e00-\u9fff]/g,"_");
  const storageRef=ref(storage,`announcements/${uid}/${Date.now()}_${safeName}`);
  await uploadBytes(storageRef,item.file,{contentType:item.type});const url=await getDownloadURL(storageRef);
  return{name:item.name,type:item.type,url};
 }
 const dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(item.file)});
 return{name:item.name,type:item.type,url:dataUrl};
}
window.publishAnnouncement=async()=>{
 const t=announcementBody.value.trim();if(!t&&!announcementFiles.length)return alert("請輸入公告內容或上傳附件");
 const btn=event?.target;try{
  if(btn){btn.disabled=true;btn.textContent="上傳中…"}
  const attachments=[];
  for(const item of announcementFiles)attachments.push(await persistAttachment(item));
  data.announcements.unshift({id:"a"+Date.now(),classId:data.currentClassId,target:announcementTarget.value,level:announcementLevel.value,text:t,date:new Date().toLocaleString("zh-TW"),readBy:[],attachments});
  announcementFiles=[];save();alert("公告與附件已發布");
 }catch(err){console.error(err);alert("附件上傳失敗，請檢查 Firebase Storage 設定或網路連線")}
 finally{if(btn){btn.disabled=false;btn.textContent="發布公告"}}
};
function renderAttachmentList(files,announcementId,scope){
 if(!files.length)return"";
 return `<div style="margin-top:10px">${files.map((f,i)=>`<div class="file-preview"><div class="attachment-row"><b>${esc(f.name)}</b><a class="btn secondary" href="${f.url}" target="_blank" rel="noopener">另開／下載</a></div><div class="attachment-preview-target" data-url="${esc(f.url)}" data-name="${esc(f.name)}" data-type="${esc(f.type||"")}" data-key="${scope}-${announcementId}-${i}"></div></div>`).join("")}</div>`;
}
async function hydrateAttachmentPreviews(scope){
 const nodes=[...document.querySelectorAll(`.attachment-preview-target[data-key^="${scope}-"]`)];
 for(const box of nodes){
  const url=box.dataset.url,name=box.dataset.name,type=box.dataset.type||guessMime(name);
  if(type.startsWith("image/"))box.innerHTML=`<img src="${url}" alt="${esc(name)}">`;
  else if(type==="application/pdf"||name.toLowerCase().endsWith(".pdf"))box.innerHTML=`<iframe src="${url}" title="${esc(name)}"></iframe>`;
  else if(name.toLowerCase().endsWith(".docx")){
   try{const buf=await fetch(url).then(r=>r.arrayBuffer());const result=await mammoth.convertToHtml({arrayBuffer:buf});box.innerHTML=`<div class="docx-preview">${result.value}</div>`}
   catch(e){box.innerHTML='<div class="risk-box">目前無法載入 Word 線上預覽，請使用「另開／下載」。</div>'}
  }else box.innerHTML='<div class="muted">舊式 DOC 檔請使用「另開／下載」查看。</div>';
 }
}

function renderPreview(){
 preview.innerHTML=`<div class="card panel"><div class="panel-head"><h2>家長預覽區</h2><select id="previewStudent" onchange="renderPreviewCard(this.value)">${classStudents().map(s=>`<option value="${s.id}">${s.seat}號 ${esc(s.name)}</option>`).join("")}</select></div><div id="previewCard"></div></div>`;
 const first=classStudents()[0];if(first)setTimeout(()=>renderPreviewCard(first.id),0);
}
window.renderPreviewCard=id=>{const s=studentById(id);if(!s)return;const announcements=data.announcements.filter(a=>a.classId===s.classId&&(a.target==="all"||a.target===s.id));const notices=data.notices.filter(n=>n.classId===s.classId&&(n.target==="class"||n.target===s.id));previewCard.innerHTML=`<div class="safe-box"><b>這是家長登入後會看到的畫面預覽，不會改動實際閱覽狀態。</b></div><h3>${s.seat}號 ${esc(s.name)}家長</h3><h4>公告</h4><div class="list">${announcements.map(a=>`<div class="list-item"><b>${esc(a.level)}</b>｜${esc(a.text)}${renderAttachmentList(a.attachments||[],a.id,"preview")}</div>`).join("")||'<div class="muted">無公告</div>'}</div><h4>聯絡事項</h4><div class="list">${notices.map(n=>`<div class="list-item"><span class="badge">${esc(n.subject)}</span><div>${esc(n.body)}</div><label><input type="checkbox" disabled> 家長閱覽勾選</label></div>`).join("")||'<div class="muted">無聯絡事項</div>'}</div>`;setTimeout(()=>hydrateAttachmentPreviews("preview"),0)};

function renderReports(){
 reports.innerHTML=`<div class="card panel"><div class="panel-head"><h2>個別／選取／全班 Excel 匯出</h2></div><p class="muted">Excel 匯出內容包含基本資料、家長資料、升學意向、出缺勤、聯絡事項及家長留言，可作為輔導或晤談紀錄。</p>
 <div class="toolbar"><select id="reportStudent">${classStudents().map(s=>`<option value="${s.id}">${s.seat}號 ${esc(s.name)}</option>`).join("")}</select><button class="btn" onclick="exportStudent(reportStudent.value)">匯出個別學生</button><button class="btn secondary" onclick="exportSelected()">匯出學生頁已選取者</button><button class="btn" onclick="exportClass()">匯出全班</button><button class="btn secondary" onclick="backupJSON()">完整備份 JSON</button></div></div>`;
}
function studentExportRows(ids){
 return ids.map(id=>{const s=studentById(id);const at=data.attendance.filter(a=>a.studentId===id).map(a=>`${a.date} ${a.type}/${a.leaveType} 到${a.arrivalTime||"-"} 離${a.leaveTime||"-"} ${a.notifyMethod}`).join("；");const ns=data.notices.filter(n=>n.target===id||n.target==="class").map(n=>`${n.date} ${n.subject}:${n.body}`).join("；");const pm=data.parentMessages.filter(m=>m.studentId===id).map(m=>`${m.date}:${m.text}`).join("；");return {"座號":s.seat,"姓名":s.name,"學號":s.studentNo,"性別":s.gender,"生日":s.birthday,"學生電話":s.phone,"學生地址":s.address,"家長姓名":s.parentName,"家長電話":s.parentPhone,"家長地址":s.parentAddress,"升學意向":s.advancement,"出缺勤紀錄":at,"聯絡紀錄":ns,"家長留言":pm}})
}
function exportIdsExcel(ids,name){
 const wb=XLSX.utils.book_new();
 const ws=XLSX.utils.json_to_sheet(studentExportRows(ids));
 ws["!cols"]=[{wch:8},{wch:12},{wch:14},{wch:8},{wch:14},{wch:16},{wch:28},{wch:14},{wch:16},{wch:28},{wch:12},{wch:48},{wch:55},{wch:45}];
 XLSX.utils.book_append_sheet(wb,ws,"學生綜合資料");
 const attendanceRows=data.attendance.filter(a=>ids.includes(a.studentId)).map(a=>{const s=studentById(a.studentId)||{};return {"日期":a.date,"座號":s.seat,"姓名":s.name,"類型":a.type,"請假別":a.leaveType,"到校時間":a.arrivalTime,"離校／請假時間":a.leaveTime,"請假方式":a.notifyMethod}});
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(attendanceRows),"出缺勤明細");
 const noticeRows=data.notices.filter(n=>n.target==="class"||ids.includes(n.target)).map(n=>({"日期":n.date,"科別／分類":n.subject,"對象":n.target==="class"?"全班":studentById(n.target)?.name||"","內容":n.body,"已閱覽人數":n.readBy?.length||0}));
 XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(noticeRows),"聯絡紀錄");
 XLSX.writeFile(wb,name);
}
window.exportStudent=id=>exportIdsExcel([id],`${studentById(id).name}_個別資料.xlsx`);
window.exportSelected=()=>{const ids=[...document.querySelectorAll(".studentPick:checked")].map(x=>x.value);if(!ids.length)return alert("請先到學生資料頁勾選學生");exportIdsExcel(ids,"選取學生資料.xlsx")};
window.exportClass=()=>exportIdsExcel(classStudents().map(s=>s.id),`${currentClass().name||"全班"}_學生資料.xlsx`);
window.backupJSON=()=>download("親師聯絡簿完整備份.json",JSON.stringify(data,null,2),"application/json");

function renderSettings(){settings.innerHTML=`<div class="card panel"><div class="panel-head"><h2>設定</h2></div><div class="field"><label>教師顯示名稱</label><input id="teacherNameInput" value="${esc(data.settings.teacherName)}"></div><button class="btn" onclick="saveSettings()">儲存</button></div>`}
window.saveSettings=()=>{data.settings.teacherName=teacherNameInput.value.trim()||"Meng";save()};

function renderAssistant(){assistant.innerHTML=`<div class="card panel"><div class="panel-head"><h2>防禦性評語助手</h2></div><div class="field"><label>情境</label><select id="assistantType">${Object.keys(safeTemplates).map(k=>`<option>${k}</option>`).join("")}</select></div><div class="field"><label>可觀察事實</label><input id="assistantFact" placeholder="例如：第三節課提醒兩次後已停止交談"></div><button class="btn" onclick="generateSafeText()">產生</button><div class="field"><textarea id="assistantOutput"></textarea></div></div>`}
window.generateSafeText=()=>{assistantOutput.value=(assistantFact.value.trim()?`觀察紀錄：${assistantFact.value.trim()}\n`:"")+(safeTemplates[assistantType.value]||"")};

function renderParent(){
 const s=currentParent;
 const anns=data.announcements.filter(a=>a.classId===s.classId&&(a.target==="all"||a.target===s.id)).slice().reverse();
 const ns=data.notices.filter(n=>n.classId===s.classId&&(n.target==="class"||n.target===s.id)).slice().reverse();
 parentContent.innerHTML=`<h3>${s.seat}號 ${esc(s.name)}家長</h3><h4>公告</h4><div class="list">${anns.map(a=>`<div class="list-item"><b>${esc(a.level)}</b><div>${esc(a.text)}</div>${renderAttachmentList(a.attachments||[],a.id,"parent")}<label><input type="checkbox" ${a.readBy?.includes(s.id)?"checked":""} onchange="parentReadAnnouncement('${a.id}',this.checked)"> 已閱覽</label></div>`).join("")||'<div class="muted">無公告</div>'}</div><h4>聯絡事項</h4><div class="list">${ns.map(n=>`<div class="list-item"><span class="badge">${esc(n.subject)}</span><div style="white-space:pre-wrap">${esc(n.body)}</div><label><input type="checkbox" ${n.readBy?.includes(s.id)?"checked":""} onchange="parentReadNotice('${n.id}',this.checked)"> 已閱覽</label></div>`).join("")||'<div class="muted">無聯絡事項</div>'}</div><div class="field"><label>留言給老師</label><textarea id="parentMessageText"></textarea></div><button class="btn" onclick="sendParentMessage()">送出留言</button>`;setTimeout(()=>hydrateAttachmentPreviews("parent"),0);
}
window.parentReadNotice=(id,on)=>{const n=data.notices.find(x=>x.id===id);n.readBy ||= [];n.readBy=on?[...new Set([...n.readBy,currentParent.id])]:n.readBy.filter(x=>x!==currentParent.id);save();renderParent()};
window.parentReadAnnouncement=(id,on)=>{const a=data.announcements.find(x=>x.id===id);a.readBy ||= [];a.readBy=on?[...new Set([...a.readBy,currentParent.id])]:a.readBy.filter(x=>x!==currentParent.id);save();renderParent()};
window.sendParentMessage=()=>{const t=parentMessageText.value.trim();if(!t)return;data.parentMessages.unshift({id:"m"+Date.now(),studentId:currentParent.id,studentName:currentParent.name,text:t,date:new Date().toLocaleString("zh-TW")});save();renderParent()};

renderAll();
</script>

if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));
