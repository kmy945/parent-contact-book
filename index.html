<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1587a8">
<link rel="manifest" href="manifest.webmanifest">
<title>親師聯絡簿 v9.0</title>
<style>
:root{
  --navy:#153653;--blue:#258aca;--aqua:#35b8c7;--mint:#49b99a;
  --paper:#fff;--bg:#eef8fd;--line:#d8e8f0;--muted:#6d8190;
  --shadow:0 12px 30px rgba(42,102,138,.12);--radius:22px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--navy);background:var(--bg)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.muted{color:var(--muted)}.small{font-size:13px}
.btn{border:0;border-radius:14px;padding:11px 16px;background:linear-gradient(135deg,var(--blue),var(--aqua));color:#fff;font-weight:700}
.btn.secondary{background:#edf7fb;color:var(--navy);border:1px solid var(--line)}
.btn.danger{background:#fff1f1;color:#a23e3e;border:1px solid #f2cccc}
.field{display:grid;gap:7px;margin:12px 0}.field label{font-weight:700}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px 12px;background:#fff;color:var(--navy)}
textarea{min-height:110px;resize:vertical}
.card{background:rgba(255,255,255,.95);border:1px solid rgba(255,255,255,.9);border-radius:var(--radius);box-shadow:var(--shadow)}
/* Original cover remains unchanged */
.login-screen{min-height:100vh;display:grid;grid-template-columns:minmax(320px,45%) 1fr;background:#f6fbfe}
.cover-pane{background:url("cover-clean.jpg") center/cover no-repeat;min-height:100vh}
.login-pane{display:grid;place-items:center;padding:28px}
.login-box{width:min(520px,100%);padding:30px}
.brand-title{font-size:32px;margin:0 0 8px}.login-tabs{display:flex;gap:8px;background:#eaf5fa;padding:5px;border-radius:15px;margin:20px 0}
.login-tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:11px}
.login-tabs button.on{background:white;box-shadow:0 5px 14px rgba(22,75,105,.1);font-weight:700}
.app{min-height:100vh;display:grid;grid-template-columns:228px 1fr}
.sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(#f8fdff,#eaf7fd);border-right:1px solid var(--line);padding:18px 12px;overflow:auto}
.side-brand{padding:12px 14px 20px;font-size:24px;font-weight:800}
.nav-btn{width:100%;border:0;background:transparent;border-radius:13px;padding:11px 12px;text-align:left;margin:3px 0;color:var(--navy)}
.nav-btn:hover,.nav-btn.on{background:#dff2fb;color:#166c9b;font-weight:800}
.main{min-width:0}
.ocean-header{position:relative;overflow:hidden;min-height:220px;padding:24px 28px;background:
radial-gradient(circle at 15% 20%,rgba(255,255,255,.85) 0 9px,transparent 10px),
radial-gradient(circle at 35% 35%,rgba(255,255,255,.7) 0 15px,transparent 16px),
radial-gradient(circle at 70% 18%,rgba(255,255,255,.75) 0 22px,transparent 23px),
linear-gradient(180deg,#dff5ff 0%,#bfeafa 52%,#85d0e5 100%)}
.ocean-header:after{content:"";position:absolute;left:-5%;right:-5%;bottom:-35px;height:100px;background:rgba(255,255,255,.75);border-radius:50% 45% 0 0/40% 35% 0 0;transform:rotate(-2deg)}
.header-row{position:relative;z-index:2;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.header-tools{display:flex;gap:10px;align-items:center}
.sync{display:inline-flex;gap:8px;align-items:center;padding:8px 12px;border-radius:999px;background:#ffffffc7;color:#268269;font-weight:700}
.class-title{position:relative;z-index:2;margin-top:36px}
.class-title h1{font-size:36px;margin:0 0 8px}
.content{padding:0 24px 40px;position:relative;margin-top:-24px;z-index:4}
.panel{padding:22px;margin-bottom:18px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.panel-head h2{margin:0;font-size:21px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.stat{padding:16px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(150deg,#fff,#f5fbfe)}
.stat b{display:block;font-size:28px;margin-top:4px}.stat span{font-size:13px;color:var(--muted)}
.quick-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.quick{border:1px solid var(--line);border-radius:17px;background:#fff;padding:17px 10px;text-align:center}
.quick strong{display:block;margin-top:7px}
.columns{display:grid;grid-template-columns:1.2fr 1fr;gap:18px}
.list{display:grid;gap:9px}.list-item{padding:12px;border:1px solid var(--line);border-radius:14px;background:#fbfdff}
.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}
th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8f6fb;font-size:12px}
.badge.good{background:#e8f8ef;color:#28734c}.badge.warn{background:#fff4dc;color:#95620a}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.check-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.check-item{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:13px;padding:10px;background:#fff}
.check-item input{width:auto;margin-top:3px}
.risk-box{padding:13px;border-radius:14px;background:#fff8e8;border:1px solid #f1dda7}
.safe-box{padding:13px;border-radius:14px;background:#edf9f3;border:1px solid #c5e7d5}
.subject-chips{display:flex;gap:8px;flex-wrap:wrap}.subject-chip{padding:8px 12px;border-radius:999px;background:#eaf6fb;border:1px solid var(--line)}
.bottom-nav{display:none}
.modal{position:fixed;inset:0;background:rgba(14,47,68,.48);display:grid;place-items:center;padding:16px;z-index:100}
.dialog{width:min(720px,100%);max-height:90vh;overflow:auto;padding:22px}
@media(max-width:1050px){
  .stats,.quick-grid{grid-template-columns:repeat(3,1fr)}
  .columns{grid-template-columns:1fr}
}
@media(max-width:800px){
  .login-screen{grid-template-columns:1fr}.cover-pane{min-height:42vh}.login-pane{padding:16px}
  .app{display:block}.sidebar{display:none}.content{padding:0 12px 90px}.ocean-header{min-height:190px;padding:18px}
  .class-title h1{font-size:28px}.stats,.quick-grid{grid-template-columns:repeat(2,1fr)}
  .form-grid,.check-grid{grid-template-columns:1fr}
  .bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:white;border-top:1px solid var(--line);z-index:50}
  .bottom-nav button{border:0;background:#fff;padding:10px 4px;font-size:12px;color:var(--navy)}
}
</style>
</head>
<body>
<section id="loginScreen" class="login-screen">
  <div class="cover-pane" aria-label="使用者原本設計的親師聯絡簿封面"></div>
  <div class="login-pane">
    <div class="card login-box">
      <h1 class="brand-title">親師聯絡簿</h1>
      <p class="muted">用心陪伴・溫暖支持・一起陪伴孩子成長</p>
      <div class="login-tabs">
        <button id="teacherTab" class="on" onclick="switchLogin('teacher')">教師登入</button>
        <button id="parentTab" onclick="switchLogin('parent')">家長登入</button>
      </div>
      <div id="teacherLogin">
        <button class="btn" style="width:100%;margin-bottom:10px" onclick="googleLogin()">使用 Google 帳號登入</button>
        <button class="btn secondary" style="width:100%" onclick="visitorLogin()">訪客體驗</button>
      </div>
      <div id="parentLogin" class="hidden">
        <div class="field"><label>家長帳號</label><input id="parentAccount" placeholder="例如：70601"></div>
        <div class="field"><label>密碼</label><input id="parentPassword" type="password"></div>
        <button class="btn" style="width:100%" onclick="parentSignIn()">登入查看</button>
      </div>
    </div>
  </div>
</section>

<section id="teacherApp" class="app hidden">
  <aside class="sidebar">
    <div class="side-brand">親師聯絡簿</div>
    <button class="nav-btn on" data-page="dashboard" onclick="go('dashboard',this)">首頁</button>
    <button class="nav-btn" data-page="contact" onclick="go('contact',this)">今日聯絡簿</button>
    <button class="nav-btn" data-page="students" onclick="go('students',this)">學生資料</button>
    <button class="nav-btn" data-page="subjects" onclick="go('subjects',this)">科別管理</button>
    <button class="nav-btn" data-page="parents" onclick="go('parents',this)">家長留言</button>
    <button class="nav-btn" data-page="announcements" onclick="go('announcements',this)">公告管理</button>
    <button class="nav-btn" data-page="reports" onclick="go('reports',this)">統計與匯出</button>
    <button class="nav-btn" data-page="settings" onclick="go('settings',this)">設定</button>
    <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
    <button class="nav-btn" onclick="go('assistant',this)">AI 通知助手</button>
    <button class="nav-btn" onclick="logout()">登出</button>
  </aside>
  <main class="main">
    <header class="ocean-header">
      <div class="header-row">
        <div>
          <select id="classSelect" onchange="changeClass()" style="min-width:280px"></select>
          <div class="sync" id="syncBadge">☁ 教師雲端模式・同步中</div>
        </div>
        <div class="header-tools">
          <button class="btn secondary" onclick="searchStudent()">搜尋</button>
          <button class="btn secondary" onclick="logout()">登出</button>
        </div>
      </div>
      <div class="class-title">
        <div class="muted" id="greeting">Meng老師，晚上好！</div>
        <h1 id="className">706班（六出奇技）</h1>
        <div id="schoolYear">115學年度</div>
      </div>
    </header>
    <div class="content">
      <section id="dashboard" class="page"></section>
      <section id="contact" class="page hidden"></section>
      <section id="students" class="page hidden"></section>
      <section id="subjects" class="page hidden"></section>
      <section id="parents" class="page hidden"></section>
      <section id="announcements" class="page hidden"></section>
      <section id="reports" class="page hidden"></section>
      <section id="settings" class="page hidden"></section>
      <section id="assistant" class="page hidden"></section>
    </div>
  </main>
  <nav class="bottom-nav">
    <button onclick="go('dashboard')">首頁</button><button onclick="go('contact')">聯絡簿</button>
    <button onclick="go('students')">學生</button><button onclick="go('reports')">統計</button><button onclick="go('settings')">設定</button>
  </nav>
</section>

<section id="parentApp" class="hidden" style="min-height:100vh;padding:18px;background:#eef8fd">
  <div style="max-width:760px;margin:auto">
    <div class="card panel">
      <div class="panel-head"><h2>家長專區</h2><button class="btn secondary" onclick="logout()">登出</button></div>
      <div id="parentContent"></div>
    </div>
  </div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyBNr-1S-xSeDvESdq3tYbWjIQ8pmgOjpd8",
  authDomain:"parent-contact-book.firebaseapp.com",
  projectId:"parent-contact-book",
  storageBucket:"parent-contact-book.firebasestorage.app",
  messagingSenderId:"241202878085",
  appId:"1:241202878085:web:fb598315e315aa33cbbbec"
};
let app,auth,db;
try{app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app)}catch(e){console.warn(e)}

const defaultSubjects=["國文","英語","數學","自然","社會","健康與體育","音樂","視覺藝術","表演藝術","資訊科技","生活科技","輔導","家政","童軍","班級事務","導師時間"];
const defaultData={
  classes:[{id:"c706",schoolYear:115,grade:7,classNo:6,name:"六出奇技",teacher:"Meng"}],
  currentClassId:"c706",
  subjects:defaultSubjects.map((name,i)=>({id:"s"+i,name,enabled:true,custom:false})),
  students:[
    {id:"stu1",classId:"c706",seat:1,name:"王小明",account:"70601",password:"123456",status:"到校"},
    {id:"stu2",classId:"c706",seat:2,name:"李小華",account:"70602",password:"123456",status:"到校"},
    {id:"stu3",classId:"c706",seat:3,name:"張小美",account:"70603",password:"123456",status:"事假"}
  ],
  notices:[],
  announcements:[],
  parentMessages:[],
  settings:{teacherName:"Meng",positiveReminder:true}
};
let data=JSON.parse(localStorage.getItem("pcb_v9_data")||"null")||structuredClone(defaultData);
let mode="visitor",uid=null,currentParent=null;

const riskyWords=["很懶","很皮","沒家教","故意","問題學生","態度很差","白目","愛找麻煩","很糟糕","不受教","沒禮貌","笨","散漫"];
const safeTemplates={
 "課堂交談":"今日課堂中，孩子曾有與同學交談的情形，老師已於當下提醒；經提醒後，孩子已能逐步回到課程活動。",
 "作業未交":"今日尚未在規定時間內完成作業繳交，老師已提醒補交；敬請家長協助孩子確認後續完成情形。",
 "精神不濟":"今日課堂中，孩子曾出現精神較為疲倦的情形，經提醒後已恢復參與；敬請家長協助留意近期作息。",
 "遲到":"孩子今日於規定時間後到校，老師已完成到校紀錄並提醒留意時間安排；敬請家長共同協助。",
 "手機使用":"今日課程進行期間，孩子曾使用手機，老師已依班級規範提醒並協助收妥；後續將持續引導孩子遵守課堂使用規定。",
 "人際互動":"今日與同學互動時曾出現意見不同的情形，老師已陪同釐清並引導合宜表達；目前雙方已能回到課程活動。",
 "優良表現":"孩子今日能主動參與課堂活動，並依照指示完成任務，值得肯定與鼓勵。"
};

function save(){
 localStorage.setItem("pcb_v9_data",JSON.stringify(data));
 if(mode==="cloud"&&uid&&db) setDoc(doc(db,"teachers",uid,"appData","contactBookV9"),data,{merge:true}).catch(console.error);
 renderAll();
}
function currentClass(){return data.classes.find(c=>c.id===data.currentClassId)||data.classes[0]}
function classStudents(){return data.students.filter(s=>s.classId===data.currentClassId)}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function today(){return new Date().toLocaleDateString("zh-TW")}
function switchLogin(type){
 teacherLogin.classList.toggle("hidden",type!=="teacher");parentLogin.classList.toggle("hidden",type!=="parent");
 teacherTab.classList.toggle("on",type==="teacher");parentTab.classList.toggle("on",type==="parent");
}
window.switchLogin=switchLogin;
window.visitorLogin=()=>{mode="visitor";enterTeacher()};
window.googleLogin=async()=>{
 try{
   const result=await signInWithPopup(auth,new GoogleAuthProvider());uid=result.user.uid;mode="cloud";
   const snap=await getDoc(doc(db,"teachers",uid,"appData","contactBookV9"));
   if(snap.exists())data=snap.data(); else await setDoc(doc(db,"teachers",uid,"appData","contactBookV9"),data);
   enterTeacher();
 }catch(e){alert("Google 登入失敗："+e.message)}
};
function enterTeacher(){loginScreen.classList.add("hidden");parentApp.classList.add("hidden");teacherApp.classList.remove("hidden");renderAll()}
window.parentSignIn=()=>{
 const a=parentAccount.value.trim(),p=parentPassword.value;
 const student=data.students.find(s=>s.account===a&&s.password===p);
 if(!student)return alert("帳號或密碼不正確");
 currentParent=student;loginScreen.classList.add("hidden");teacherApp.classList.add("hidden");parentApp.classList.remove("hidden");renderParent();
};
window.logout=async()=>{try{if(auth?.currentUser)await signOut(auth)}catch(e){} location.reload()};
window.go=(id,btn)=>{
 document.querySelectorAll(".page").forEach(x=>x.classList.toggle("hidden",x.id!==id));
 document.querySelectorAll(".nav-btn").forEach(x=>x.classList.toggle("on",x.dataset.page===id));
 window.scrollTo({top:0,behavior:"smooth"});
};
window.changeClass=()=>{data.currentClassId=classSelect.value;save()};
window.searchStudent=()=>{
 const q=prompt("輸入座號或姓名");if(!q)return;
 const s=classStudents().find(x=>String(x.seat)===q||x.name.includes(q));
 alert(s?`${s.seat}號 ${s.name}｜${s.status}`:"找不到學生");
};

function renderAll(){
 renderHeader();renderDashboard();renderContact();renderStudents();renderSubjects();renderParents();renderAnnouncements();renderReports();renderSettings();renderAssistant();
}
function renderHeader(){
 const c=currentClass();classSelect.innerHTML=data.classes.map(x=>`<option value="${x.id}">${x.schoolYear}學年度・${x.grade}${String(x.classNo).padStart(2,"0")}班（${esc(x.name)}）</option>`).join("");
 classSelect.value=c.id;className.textContent=`${c.grade}${String(c.classNo).padStart(2,"0")}班（${c.name}）`;schoolYear.textContent=`${c.schoolYear}學年度`;
 greeting.textContent=`${data.settings.teacherName||c.teacher||"老師"}老師，您好！`;
 syncBadge.textContent=mode==="cloud"?"☁ 教師雲端模式・已同步":"💾 訪客模式・本機儲存";
}
function renderDashboard(){
 const ss=classStudents(),leave=ss.filter(s=>s.status!=="到校").length;
 const signed=data.notices.filter(n=>n.classId===data.currentClassId).reduce((a,n)=>a+(n.signed?.length||0),0);
 dashboard.innerHTML=`
 <div class="card panel">
  <div class="panel-head"><h2>今日概況</h2><span class="muted">${today()}</span></div>
  <div class="stats">
   ${stat("學生人數",ss.length)}${stat("到校人數",ss.length-leave)}${stat("請假人數",leave)}${stat("家長留言",data.parentMessages.length)}${stat("未簽閱",Math.max(ss.length-signed,0))}
  </div>
 </div>
 <div class="card panel"><div class="panel-head"><h2>快速功能</h2></div>
  <div class="quick-grid">
   ${quick("今日聯絡簿","contact")}${quick("學生資料","students")}${quick("科別管理","subjects")}${quick("統計分析","reports")}${quick("公告管理","announcements")}
   ${quick("家長留言","parents")}${quick("AI通知助手","assistant")}${quick("匯出資料","reports")}${quick("設定","settings")}${quick("自訂科別","subjects")}
  </div>
 </div>
 <div class="columns">
  <div class="card panel"><div class="panel-head"><h2>最新聯絡事項</h2></div><div class="list">${
    data.notices.slice(-5).reverse().map(n=>`<div class="list-item"><b>${esc(n.subject)}</b>｜${esc(n.body)}<div class="small muted">${esc(n.date)}</div></div>`).join("")||'<div class="muted">尚無聯絡事項</div>'
  }</div></div>
  <div class="card panel"><div class="panel-head"><h2>今日請假學生</h2></div><div class="list">${
    ss.filter(s=>s.status!=="到校").map(s=>`<div class="list-item">${s.seat}號 ${esc(s.name)} <span class="badge warn">${esc(s.status)}</span></div>`).join("")||'<div class="muted">今日無請假紀錄</div>'
  }</div></div>
 </div>`;
}
function stat(label,num){return `<div class="stat"><span>${label}</span><b>${num}</b></div>`}
function quick(label,page){return `<button class="quick" onclick="go('${page}')"><span style="font-size:25px">◉</span><strong>${label}</strong></button>`}

function renderContact(){
 const subjects=data.subjects.filter(s=>s.enabled);
 contact.innerHTML=`
 <div class="card panel"><div class="panel-head"><h2>發布今日聯絡簿</h2><span class="badge good">防禦性評語檢查已開啟</span></div>
 <div class="form-grid">
  <div class="field"><label>科別</label><select id="noticeSubject">${subjects.map(s=>`<option>${esc(s.name)}</option>`).join("")}</select></div>
  <div class="field"><label>對象</label><select id="noticeTarget"><option value="class">全班</option>${classStudents().map(s=>`<option value="${s.id}">${s.seat}號 ${esc(s.name)}</option>`).join("")}</select></div>
 </div>
 <div class="field"><label>快速情境</label><select id="templateSelect" onchange="useTemplate()"><option value="">請選擇</option>${Object.keys(safeTemplates).map(k=>`<option>${k}</option>`).join("")}</select></div>
 <div class="field"><label>聯絡內容</label><textarea id="noticeBody" oninput="checkRisk()"></textarea></div>
 <div id="riskResult" class="safe-box">目前未偵測到可能造成誤解的標籤或貶抑詞語。</div>
 <div class="field"><label>需要家長協助（選填）</label><input id="parentHelp" placeholder="例如：敬請協助提醒攜帶課本"></div>
 <button class="btn" onclick="publishNotice()">發布聯絡事項</button>
 </div>`;
}
window.useTemplate=()=>{noticeBody.value=safeTemplates[templateSelect.value]||"";checkRisk()};
window.checkRisk=()=>{
 const text=noticeBody.value;const hit=riskyWords.filter(w=>text.includes(w));
 riskResult.className=hit.length?"risk-box":"safe-box";
 riskResult.innerHTML=hit.length?`偵測到可能造成爭議的用語：<b>${hit.join("、")}</b><br>建議改為可觀察的行為、時間、老師已採取的處理及後續合作方式。`:"目前未偵測到可能造成誤解的標籤或貶抑詞語。";
};
window.publishNotice=()=>{
 const body=noticeBody.value.trim();if(!body)return alert("請輸入聯絡內容");
 const hit=riskyWords.filter(w=>body.includes(w));if(hit.length&&!confirm("仍含可能造成爭議的用語，確定發布嗎？"))return;
 data.notices.push({id:"n"+Date.now(),classId:data.currentClassId,subject:noticeSubject.value,target:noticeTarget.value,body:body+(parentHelp.value.trim()?`\n家校合作：${parentHelp.value.trim()}`:""),date:new Date().toLocaleString("zh-TW"),signed:[],comments:[]});
 save();alert("已發布");
};

function renderStudents(){
 students.innerHTML=`<div class="card panel"><div class="panel-head"><h2>學生資料</h2><button class="btn" onclick="addStudent()">＋新增學生</button></div>
 <div class="table-wrap"><table><thead><tr><th>座號</th><th>姓名</th><th>到校狀態</th><th>家長帳號</th><th>操作</th></tr></thead><tbody>${
 classStudents().map(s=>`<tr><td>${s.seat}</td><td>${esc(s.name)}</td><td><select onchange="setStatus('${s.id}',this.value)"><option ${s.status==="到校"?"selected":""}>到校</option><option ${s.status==="病假"?"selected":""}>病假</option><option ${s.status==="事假"?"selected":""}>事假</option><option ${s.status==="遲到"?"selected":""}>遲到</option><option ${s.status==="公假"?"selected":""}>公假</option></select></td><td>${esc(s.account)}</td><td><button class="btn danger" onclick="deleteStudent('${s.id}')">刪除</button></td></tr>`).join("")
 }</tbody></table></div></div>`;
}
window.addStudent=()=>{
 const seat=prompt("座號");if(!seat)return;const name=prompt("姓名")||"";
 const c=currentClass(),account=`${c.grade}${String(c.classNo).padStart(2,"0")}${String(seat).padStart(2,"0")}`;
 data.students.push({id:"stu"+Date.now(),classId:c.id,seat:Number(seat),name,account,password:"123456",status:"到校"});save();
};
window.deleteStudent=id=>{if(confirm("確定刪除？")){data.students=data.students.filter(s=>s.id!==id);save()}};
window.setStatus=(id,v)=>{const s=data.students.find(x=>x.id===id);if(s)s.status=v;save()};

function renderSubjects(){
 subjects.innerHTML=`<div class="card panel"><div class="panel-head"><h2>科別管理</h2><button class="btn" onclick="addSubject()">＋自訂科別</button></div>
 <p class="muted">內建國中課程，可依班級需求啟用、停用並新增自訂科別。</p>
 <div class="subject-chips">${data.subjects.map(s=>`<span class="subject-chip">${esc(s.name)} ${s.custom?"（自訂）":""} <input type="checkbox" ${s.enabled?"checked":""} onchange="toggleSubject('${s.id}',this.checked)" style="width:auto"> ${s.custom?`<button onclick="deleteSubject('${s.id}')" style="border:0;background:transparent">×</button>`:""}</span>`).join("")}</div></div>`;
}
window.addSubject=()=>{const name=(prompt("輸入自訂科別名稱")||"").trim();if(name){data.subjects.push({id:"s"+Date.now(),name,enabled:true,custom:true});save()}};
window.toggleSubject=(id,on)=>{const s=data.subjects.find(x=>x.id===id);if(s)s.enabled=on;save()};
window.deleteSubject=id=>{data.subjects=data.subjects.filter(s=>s.id!==id);save()};

function renderParents(){
 parents.innerHTML=`<div class="card panel"><div class="panel-head"><h2>家長留言</h2></div><div class="list">${
 data.parentMessages.map(m=>`<div class="list-item"><b>${esc(m.studentName)}</b><div>${esc(m.text)}</div><div class="small muted">${esc(m.date)}</div></div>`).join("")||'<div class="muted">目前沒有家長留言</div>'
 }</div></div>`;
}
function renderAnnouncements(){
 announcements.innerHTML=`<div class="card panel"><div class="panel-head"><h2>公告管理</h2></div>
 <div class="field"><label>公告內容</label><textarea id="announcementBody"></textarea></div>
 <button class="btn" onclick="publishAnnouncement()">發布公告</button>
 <div class="list" style="margin-top:18px">${data.announcements.map(a=>`<div class="list-item"><b>${esc(a.date)}</b><div>${esc(a.text)}</div></div>`).join("")||'<div class="muted">尚無公告</div>'}</div></div>`;
}
window.publishAnnouncement=()=>{const t=announcementBody.value.trim();if(!t)return;data.announcements.unshift({id:"a"+Date.now(),classId:data.currentClassId,text:t,date:today()});save()};

function renderReports(){
 reports.innerHTML=`<div class="card panel"><div class="panel-head"><h2>統計與匯出</h2></div>
 <div class="stats">${stat("學生",classStudents().length)}${stat("聯絡事項",data.notices.length)}${stat("公告",data.announcements.length)}${stat("家長留言",data.parentMessages.length)}${stat("自訂科別",data.subjects.filter(s=>s.custom).length)}</div>
 <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="btn" onclick="exportCSV('students')">匯出學生名冊 CSV</button><button class="btn" onclick="exportCSV('notices')">匯出聯絡紀錄 CSV</button><button class="btn secondary" onclick="backupJSON()">完整備份 JSON</button></div>
 </div>`;
}
function download(name,text,type="text/csv;charset=utf-8"){
 const blob=new Blob(["\ufeff"+text],{type});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);
}
window.exportCSV=type=>{
 if(type==="students"){download("學生名冊.csv","班級,座號,姓名,狀態,家長帳號\n"+classStudents().map(s=>[currentClass().name,s.seat,s.name,s.status,s.account].join(",")).join("\n"))}
 else{download("聯絡紀錄.csv","日期,科別,對象,內容\n"+data.notices.map(n=>[n.date,n.subject,n.target,JSON.stringify(n.body)].join(",")).join("\n"))}
};
window.backupJSON=()=>download("親師聯絡簿完整備份.json",JSON.stringify(data,null,2),"application/json");

function renderSettings(){
 settings.innerHTML=`<div class="card panel"><div class="panel-head"><h2>設定</h2></div>
 <div class="field"><label>教師顯示名稱</label><input id="teacherNameInput" value="${esc(data.settings.teacherName)}"></div>
 <label class="check-item"><input id="positiveReminder" type="checkbox" ${data.settings.positiveReminder?"checked":""}>發布多則提醒時，提示加入正向回饋</label>
 <button class="btn" onclick="saveSettings()">儲存設定</button></div>`;
}
window.saveSettings=()=>{data.settings.teacherName=teacherNameInput.value.trim()||"Meng";data.settings.positiveReminder=positiveReminder.checked;save();alert("已儲存")};

function renderAssistant(){
 assistant.innerHTML=`<div class="card panel"><div class="panel-head"><h2>AI 通知助手</h2><span class="badge good">客觀・中性・可核對</span></div>
 <p>選擇情境後，系統會產生不貼標籤、不推測動機，並清楚交代事實與處理方式的文字。</p>
 <div class="field"><label>情境</label><select id="assistantType">${Object.keys(safeTemplates).map(k=>`<option>${k}</option>`).join("")}</select></div>
 <div class="field"><label>補充可觀察事實</label><input id="assistantFact" placeholder="例如：第二節數學課，提醒兩次後已停止交談"></div>
 <button class="btn" onclick="generateSafeText()">產生評語</button>
 <div class="field"><label>建議文字</label><textarea id="assistantOutput"></textarea></div>
 <button class="btn secondary" onclick="copySafeText()">複製文字</button></div>`;
}
window.generateSafeText=()=>{
 let t=safeTemplates[assistantType.value]||"";const f=assistantFact.value.trim();
 assistantOutput.value=f?`觀察紀錄：${f}\n${t}`:t;
};
window.copySafeText=async()=>{await navigator.clipboard.writeText(assistantOutput.value);alert("已複製")};

function renderParent(){
 const n=data.notices.filter(x=>x.classId===currentParent.classId&&(x.target==="class"||x.target===currentParent.id)).slice().reverse();
 parentContent.innerHTML=`<h3>${currentParent.seat}號 ${esc(currentParent.name)}</h3>
 <div class="list">${n.map(x=>`<div class="list-item"><span class="badge">${esc(x.subject)}</span><div style="white-space:pre-wrap;margin:8px 0">${esc(x.body)}</div><div class="small muted">${esc(x.date)}</div><button class="btn secondary" onclick="parentSign('${x.id}')">${x.signed.includes(currentParent.id)?"已簽閱":"簽閱"}</button></div>`).join("")||'<div class="muted">目前沒有聯絡事項</div>'}</div>
 <div class="field"><label>留言給老師</label><textarea id="parentMessageText"></textarea></div><button class="btn" onclick="sendParentMessage()">送出留言</button>`;
}
window.parentSign=id=>{const n=data.notices.find(x=>x.id===id);if(n&&!n.signed.includes(currentParent.id))n.signed.push(currentParent.id);save();renderParent()};
window.sendParentMessage=()=>{const t=parentMessageText.value.trim();if(!t)return;data.parentMessages.unshift({id:"m"+Date.now(),studentId:currentParent.id,studentName:currentParent.name,text:t,date:new Date().toLocaleString("zh-TW")});save();renderParent()};

renderAll();
</script>
<script>
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));
</script>
</body>
</html>
