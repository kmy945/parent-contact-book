function buildSentenceVariant(){
 let courses=selected("course"), events=[...selected("learn"),...selected("behave")], handles=selected("handle"), keyword=kw.value.trim();
 if(!events.length&&!keyword)return null;
 let pieces=[];
 if(courses.length)pieces.push(`今日於${courses.join("、")}課程中，`);
 if(events.length){
  let chosen=events.map(ev=>{let list=PHRASE_BANK[ev]; if(list?.length)return list[Math.floor(Math.random()*list.length)]; return [`今日觀察到「${ev}」的情形，老師已持續關心。`,`今日課程／班級活動中曾出現「${ev}」的情形，已依實際狀況提供提醒或協助。`,`今日在學習或生活表現上有「${ev}」的情形，後續將持續觀察與協助。`][Math.floor(Math.random()*3)]});
  // remove repeated 今日 prefix when already course lead
  if(courses.length)chosen=chosen.map(s=>s.replace(/^今日(?:課程中|課堂中|課程進行期間|課堂討論時|學習過程中|活動過程中|與同學互動時|在人際互動中|在團體活動中|課堂用品準備|未能備妥|仍有|尚未|部分|學習活動進行時)?/,""));
  pieces.push(chosen.join(""));
 }
 if(handles.length)pieces.push(`老師已採取的處理方式包括：${handles.join("、")}。`);
 if(keyword)pieces.push(`補充觀察：${keyword}。`);
 return {courses,events,handles,keyword,text:pieces.join("")}
}

function promoteCurrent(){
 let c=C(); if(!c)return alert("目前沒有可升級的班級");
 if(c.status==="graduated")return alert("此班已畢業封存");
 c.history ||= [];
 if(!c.history.some(h=>Number(h.schoolYear)===Number(c.schoolYear)&&Number(h.grade)===Number(c.grade)&&Number(h.classNo)===Number(c.classNo))){
   c.history.push({schoolYear:c.schoolYear,grade:c.grade,classNo:c.classNo,name:c.name||""});
 }
 if(c.grade>=9){
   if(!confirm("九年級完成後將設為「畢業封存」。三年學生、家長、聯絡與輔導歷程仍會保留。確定嗎？"))return;
   c.status="graduated"; c.graduatedAt=N(); save(); return;
 }
 c.schoolYear=Number(c.schoolYear)+1;
 c.grade=Number(c.grade)+1;
 c.history.push({schoolYear:c.schoolYear,grade:c.grade,classNo:c.classNo,name:c.name||""});
 D.students.filter(s=>s.classId===c.id&&!s.archived).forEach(s=>{
   s.history ||= [];
   if(!s.history.some(h=>Number(h.schoolYear)===Number(c.schoolYear)&&Number(h.grade)===Number(c.grade)))s.history.push({schoolYear:c.schoolYear,grade:c.grade,classNo:c.classNo,seat:s.seat});
   s.account=`${c.grade}${String(c.classNo).padStart(2,"0")}${String(s.seat).padStart(2,"0")}`;
 });
 save();
 alert(`已升級為 ${c.schoolYear}學年度 ${c.grade}${String(c.classNo).padStart(2,"0")}班。所有歷程均已保留。`);
}

async function importStudents(e){
 let f=e.target.files[0]; if(!f)return;
 try{
   let wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:true});
   let rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:"",raw:false});
   if(!rows.length)throw new Error("Excel 沒有資料");
   let imported=0, updated=0, createdClasses=0;
   for(const r of rows){
     let seat=Number(String(r["座號"]||"").trim()); let name=String(r["姓名"]||"").trim();
     if(!seat||!name)continue;
     let rawClass=String(r["班級"]||"").trim();
     let year=Number(String(r["學年度"]||"").replace(/\D/g,""))||C()?.schoolYear||115;
     let target=C();
     if(rawClass){
       let digits=rawClass.replace(/\D/g,"");
       let grade=digits.length>=3?Number(digits[0]):(C()?.grade||7);
       let classNo=digits.length>=3?Number(digits.slice(1)):(Number(digits)||C()?.classNo||1);
       let className=String(r["班名"]||"").trim();
       target=D.classes.find(c=>c.status!=="deleted"&&Number(c.schoolYear)===year&&Number(c.grade)===grade&&Number(c.classNo)===classNo);
       if(!target){
         target={id:"c"+Date.now()+Math.random(),schoolYear:year,grade,classNo,name:className,teacher:"Meng",status:"active",history:[{schoolYear:year,grade,classNo,name:className}]};
         D.classes.push(target); createdClasses++;
       } else if(className && !target.name) target.name=className;
     }
     if(!target){
       target={id:"c"+Date.now()+Math.random(),schoolYear:year,grade:7,classNo:1,name:String(r["班名"]||""),teacher:"Meng",status:"active",history:[{schoolYear:year,grade:7,classNo:1,name:String(r["班名"]||"")}]};
       D.classes.push(target); createdClasses++;
     }
     D.currentClassId=target.id;
     let s=D.students.find(x=>x.classId===target.id&&Number(x.seat)===seat);
     let isNew=!s;
     if(!s){s={id:"s"+Date.now()+Math.random(),classId:target.id,password:"123456",history:[]};D.students.push(s)}
     Object.assign(s,{
       classId:target.id, archived:false, seat, name,
       studentNo:String(r["學號"]||""),gender:String(r["性別"]||""),birthday:String(r["生日"]||""),
       phone:String(r["學生電話"]||""),address:String(r["學生地址"]||""),
       parent1Name:String(r["家長1姓名"]||""),parent1Relation:String(r["家長1關係"]||r["關係"]||""),
       parent1Phone:String(r["家長1電話"]||r["電話"]||""),parent1Email:String(r["家長1 Email"]||r["Email"]||""),
       parent1Line:String(r["家長1 Line ID"]||r["Line ID"]||""),
       parent2Name:String(r["家長2姓名"]||""),parent2Relation:String(r["家長2關係"]||""),
       parent2Phone:String(r["家長2電話"]||""),parent2Email:String(r["家長2 Email"]||""),
       parent2Line:String(r["家長2 Line ID"]||""),
       advancement:String(r["升學意向"]||"未定"),notes:String(r["備註"]||"")
     });
     s.account ||= `${target.grade}${String(target.classNo).padStart(2,"0")}${String(seat).padStart(2,"0")}`;
     s.history ||= [];
     if(!s.history.some(h=>Number(h.schoolYear)===Number(target.schoolYear)&&Number(h.grade)===Number(target.grade))){
       s.history.push({schoolYear:target.schoolYear,grade:target.grade,classNo:target.classNo,seat});
     }
     isNew?imported++:updated++;
   }
   save();
   alert(`Excel 匯入完成\n新增學生：${imported} 人\n更新學生：${updated} 人\n自動建立班級：${createdClasses} 個`);
 }catch(err){
   console.error(err);
   alert("Excel 匯入失敗："+err.message+"\n請確認至少有「座號、姓名」欄；若尚未建立班級，請再加上「班級」欄，例如 706。");
 }
 e.target.value="";
}

 counseling.innerHTML=`<div class="card panel"><div class="head"><h2>輔導／晤談紀錄</h2><span class="badge good">可從學生事件匯入，也可自行新增</span></div>
 <div class="grid3"><div class="field"><label>日期</label><input id="cDate" type="date" value="${T()}"></div><div class="field"><label>時間</label><input id="cTime" type="time"></div><div class="field"><label>學生</label><select id="cStudent">${ss.map(s=>`<option value="${s.id}">${s.seat}號 ${E(s.name)}</option>`).join("")}</select></div>
 <div class="field"><label>晤談對象</label><select id="cObject">${OBJECTS.map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label>地點</label><select id="cLocation">${LOCATIONS.map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label>問題類型</label><select id="cProblemType" onchange="renderProblemGuides()">${PROBLEM_TYPES.map(x=>`<option>${x}</option>`).join("")}</select></div></div><div class="grid2"><div class="field"><label>其他問題類型（選填）</label><input id="cProblemOther" placeholder="選「其他」時可填"></div><div class="field"><label>地點補充（選填）</label><input id="cLocationOther" placeholder="例如：圖書館旁、家長來校"></div></div>
 <div class="field"><label>問題描述（可用 AI 指引詞句逐句加入）</label><div id="problemGuides" class="list"></div><textarea id="cProblemDesc" placeholder="描述具體可觀察情形，不使用人格標籤或推測動機"></textarea></div>
 <div class="field"><label>晤談內容</label><textarea id="cContent"></textarea></div>
 <div class="field"><label>處理方式</label><div class="checkgrid">${HANDLING.map(x=>`<label class="checkitem"><input type="checkbox" class="cHandle" value="${E(x)}"><span>${E(x)}</span></label>`).join("")}</div><textarea id="cHandling" placeholder="可勾選後再補充"></textarea></div>
 <div class="field"><label>後續追蹤</label><textarea id="cFollow" placeholder="例如：持續觀察、兩週後再晤談、視需要與家長聯繫"></textarea></div>
 <div class="safe" id="cSourceBox">來源：教師手動建立</div>
 <div class="toolbar" style="margin-top:10px"><button class="btn" onclick="saveCounsel()">儲存輔導／晤談紀錄</button><button class="btn secondary" onclick="clearCounsel()">清空</button></div>
 <div class="list" style="margin-top:15px">${D.counseling.filter(c=>S(c.sid)?.classId===D.currentClassId).map(c=>`<div class="item"><b>${E(c.date)} ${E(c.time)}｜${E(S(c.sid)?.name||"")}｜${E(c.object)}｜${E(c.location)}</b><div><b>${E(c.problemType)}</b>：${E(c.problemDesc)}</div><div>${E(c.content)}</div><div class="small muted">處理方式：${E(c.handling)}｜後續：${E(c.follow||"")}｜來源：${E(c.source)}</div></div>`).join("")||'<div class="muted">尚無紀錄</div>'}</div></div>`;
 setTimeout(()=>{renderProblemGuides();loadCounselDraft()},0)
}
function renderProblemGuides(){let box=document.getElementById("problemGuides");if(!box)return;let t=cProblemType.value,list=PROBLEM_GUIDES[t]||["請以具體可觀察的事件、學生自述或家長反映內容進行描述。"];box.innerHTML=list.map((x,i)=>`<div class="item">${E(x)} <button class="btn secondary" onclick="appendProblemGuide(${i})">＋加入</button></div>`).join("")}
function appendProblemGuide(i){let list=PROBLEM_GUIDES[cProblemType.value]||[];if(list[i])cProblemDesc.value+=(cProblemDesc.value?"\n":"")+list[i]}
function loadCounselDraft(){let raw=sessionStorage.getItem("counselDraft");if(!raw)return;try{let d=JSON.parse(raw);if(d.sid)cStudent.value=d.sid;if(d.date)cDate.value=d.date;if(d.time)cTime.value=d.time;if(d.problemType)cProblemType.value=d.problemType;cProblemDesc.value=d.problemDesc||"";cContent.value=d.content||"";cHandling.value=d.handling||"";cSourceBox.textContent=`來源：${d.source||"學生事件"}${d.sourceId?`（${d.sourceId}）`:""}`;cSourceBox.dataset.source=d.source||"學生事件";cSourceBox.dataset.sourceId=d.sourceId||"";renderProblemGuides();sessionStorage.removeItem("counselDraft")}catch(e){}}
function saveCounsel(){let desc=cProblemDesc.value.trim(),content=cContent.value.trim();if(!desc&&!content)return alert("請至少填寫問題描述或晤談內容");let risky=RISKY.filter(w=>(desc+" "+content+" "+cHandling.value).includes(w));if(risky.length&&!confirm(`偵測到較容易造成誤解的用語：${risky.join("、")}。\n建議先改寫為具體行為與情境。仍要儲存嗎？`))return;let h=[...document.querySelectorAll(".cHandle:checked")].map(x=>x.value);if(cHandling.value.trim())h.push(cHandling.value.trim());D.counseling.push({id:"coun"+Date.now(),classId:D.currentClassId,date:cDate.value,time:cTime.value,sid:cStudent.value,object:cObject.value,location:cLocation.value,problemType:(cProblemType.value==="其他"&&cProblemOther.value.trim()?`其他：${cProblemOther.value.trim()}`:cProblemType.value),problemDesc:desc,content,handling:h.join("、"),follow:cFollow.value.trim(),locationNote:cLocationOther.value.trim(),source:cSourceBox.dataset.source||"教師手動建立",sourceId:cSourceBox.dataset.sourceId||"",teacher:"Meng"});save();alert("已儲存")}
function clearCounsel(){document.querySelectorAll("#counseling input[type=checkbox]").forEach(x=>x.checked=false);cProblemDesc.value="";cContent.value="";cHandling.value="";cFollow.value="";cSourceBox.textContent="來源：教師手動建立";cSourceBox.dataset.source="教師手動建立";cSourceBox.dataset.sourceId=""}

function renderPreview(){
 if(!C()){preview.innerHTML=noClassCard();return;}
 let ss=classStudents();preview.innerHTML=`<div class="card panel"><div class="head"><h2>家長預覽</h2><select id="pv" onchange="previewCard(this.value)">${ss.map(s=>`<option value="${s.id}">${s.seat}號 ${E(s.name)}</option>`).join("")}</select></div><div id="pvbox"></div></div>`;if(ss[0])setTimeout(()=>previewCard(ss[0].id),0)
}
function previewCard(id){let s=S(id),hw=D.homework.filter(x=>x.classId===D.currentClassId&&x.date===T()),an=D.announcements.filter(x=>x.classId===D.currentClassId),ns=D.notices.filter(x=>x.sid===id&&x.parentVisible&&x.date.startsWith(T()));pvbox.innerHTML=`<h3>${s.seat}號 ${E(s.name)}家長</h3><h4>今日功課與提醒</h4>${hw.map(x=>`<div class="item"><b>${E(x.subject)}</b>｜${E(x.content)}</div>`).join("")||"無"}<h4>學校／班級公告</h4>${an.map(x=>`<div class="item"><b>${E(x.type)}｜${E(x.title||"")}</b><div>${E(x.text)}</div>${(x.links||[]).map(l=>`<div><a href="${E(l.url)}" target="_blank">${E(l.label||"附件")}</a></div>`).join("")}${x.url?`<a href="${E(x.url)}" target="_blank">${E(x.file||"附件")}</a>`:""}</div>`).join("")||"無"}<h4>學習與生活提醒</h4>${ns.map(x=>`<div class="item">${E(x.content)}</div>`).join("")||"無"}<h4>親師聯繫（選填）</h4><textarea disabled placeholder="家長有需要反應或提問時再填寫"></textarea><label class="checkitem" style="margin-top:10px"><input type="checkbox" disabled><span>我已詳閱今日聯絡簿內容</span></label>`}

function renderReports(){
 if(!C()){reports.innerHTML=noClassCard("<button class=\"btn secondary\" onclick=\"go(\'students\')\">前往匯入學生</button>");return;}
 reports.innerHTML=`<div class="card panel"><div class="head"><h2>Excel 匯入／匯出</h2></div><p class="muted">所有歷程匯出皆保留日期、時間、對象、地點、問題描述、內容、處理方式與來源。</p><div class="grid2"><div class="field"><label>學生</label><select id="rs">${classStudents().map(s=>`<option value="${s.id}">${s.seat}號 ${E(s.name)}</option>`).join("")}</select></div><div class="field"><label>匯出</label><div class="toolbar"><button class="btn" onclick="exp([rs.value],S(rs.value).name+'_學生三年歷程.xlsx')">個別學生</button><button class="btn secondary" onclick="exp(classStudents().map(x=>x.id),'全班學生歷程.xlsx')">全班</button></div></div></div></div>`;
}
function exp(ids,name){let wb=XLSX.utils.book_new(),basic=D.students.filter(x=>ids.includes(x.id));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(basic),"學生家長資料");
let attendance=D.attendance.filter(x=>ids.includes(x.sid)).map(x=>({"日期":x.date,"時間":x.time,"學生":S(x.sid)?.name,"到校狀態":x.status,"請假別":x.leave,"到校時間":x.arrival,"離校／請假時間":x.leaveTime,"請假方式":x.method}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(attendance),"出缺勤");
let notices=D.notices.filter(x=>ids.includes(x.sid)).map(x=>({"日期":x.date,"時間":x.time||"","學生":S(x.sid)?.name,"類型":x.type,"課程":(x.courses||[]).join("、"),"內容":x.content,"處理方式":(x.handling||[]).join?x.handling.join("、"):x.handling,"家長可見":x.parentVisible?"是":"否"}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(notices),"學生事件與提醒");
let contacts=D.contacts.filter(x=>ids.includes(x.sid)).map(x=>({"日期時間":x.date,"學生":S(x.sid)?.name,"對象":"家長","內容":x.content,"處理狀態":x.status||""}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(contacts),"親師聯繫");
let counseling=D.counseling.filter(x=>ids.includes(x.sid)).map(x=>({"日期":x.date,"時間":x.time,"學生":S(x.sid)?.name,"晤談對象":x.object,"地點":x.location,"問題類型":x.problemType,"問題描述":x.problemDesc,"晤談內容":x.content,"處理方式":x.handling,"後續追蹤":x.follow,"來源":x.source,"建立教師":x.teacher}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(counseling),"輔導晤談");
let sign=D.signatures.filter(x=>ids.includes(x.sid)).map(x=>({"日期":x.date,"簽閱時間":x.time,"學生":S(x.sid)?.name}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sign),"家長簽閱");
let anns=D.announcements.filter(x=>x.classId===D.currentClassId).map(x=>({"日期時間":x.date,"類型":x.type,"標題":x.title,"內容":x.text,"附件":x.file,"連結":x.url}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(anns),"學校班級公告");
let history=D.classes.filter(c=>c.id===D.currentClassId).flatMap(c=>(c.history||[]).map(h=>({"學年度":h.schoolYear,"年級":h.grade,"班級":h.classNo,"班名":c.name,"狀態":c.status})));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(history),"班級學年歷程");
XLSX.writeFile(wb,name)}
function exportTimetable(){let days=["星期一","星期二","星期三","星期四","星期五"],rows=[1,2,3,4,5,6,7].map(p=>{let r={"節次":`第${p}節`};days.forEach(d=>r[d]=D.timetable[D.currentClassId+"|"+d+"-"+p]||"");return r}),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"功課表");XLSX.writeFile(wb,"班級功課表.xlsx")}

function renderParent(){let s=CP,c=D.classes.find(x=>x.id===s.classId)||C();D.currentClassId=c.id;let hw=D.homework.filter(x=>x.classId===c.id&&x.date===T()),an=D.announcements.filter(x=>x.classId===c.id),ns=D.notices.filter(x=>x.sid===s.id&&x.parentVisible&&x.date.startsWith(T())),sg=D.signatures.find(x=>x.sid===s.id&&x.date===T());parentView.innerHTML=`<h3>${s.seat}號 ${E(s.name)}家長</h3><h4>今日功課與提醒</h4>${hw.map(x=>`<div class="item"><b>${E(x.subject)}</b>｜${E(x.content)}</div>`).join("")||"無"}<h4>學校／班級公告</h4>${an.map(x=>`<div class="item"><b>${E(x.type)}｜${E(x.title||"")}</b><div>${E(x.text)}</div>${(x.links||[]).map(l=>`<div><a target="_blank" href="${E(l.url)}">${E(l.label||"附件")}</a></div>`).join("")}${x.url?`<a target="_blank" href="${E(x.url)}">${E(x.file||"附件")}</a>`:""}</div>`).join("")||"無"}<h4>學習與生活提醒</h4>${ns.map(x=>`<div class="item">${E(x.content)}</div>`).join("")||"無"}<h4>親師聯繫（選填）</h4><textarea id="pm" placeholder="有需要反應或提問時再填寫"></textarea><label class="checkitem"><input id="ps" type="checkbox" ${sg?"checked disabled":""}><span>我已詳閱今日聯絡簿內容</span></label><button class="btn" onclick="submitP()" ${sg?"disabled":""} style="margin-top:9px">${sg?"今日已簽閱":"送出並簽閱"}</button>${sg?`<div class="muted small">簽閱時間：${E(sg.time)}</div>`:""}`}
function submitP(){if(!ps.checked)return alert("請先勾選已詳閱");if(pm.value.trim())D.contacts.unshift({id:"pc"+Date.now(),date:N(),sid:CP.id,content:pm.value.trim(),status:"尚未處理"});D.signatures.push({date:T(),time:N(),sid:CP.id});save();renderParent();alert("已完成今日簽閱")}

try{
  renderAll();
  window.__PCB_BOOT_OK__=true;
}catch(err){
  console.error("PCB boot error",err);
  window.__PCB_BOOT_OK__=false;
  const card=document.querySelector(".loginCard");
  if(card){
    const msg=document.createElement("div");
    msg.className="warn";
    msg.style.marginTop="12px";
    msg.textContent="系統初始化發生錯誤，請重新整理頁面；若仍無法使用，請回報此畫面。";
    card.appendChild(msg);
  }
}
</script>
</body>
</html>
