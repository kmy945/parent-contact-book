<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>親師聯絡簿 v11 預覽</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>
:root{--ink:#17384f;--muted:#6f8592;--blue:#2389c2;--aqua:#3ab6c7;--bg:#eef8fc;--line:#d8e8f0;--shadow:0 12px 28px rgba(42,103,136,.12)}*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.btn{border:0;border-radius:13px;padding:10px 15px;background:linear-gradient(135deg,var(--blue),var(--aqua));color:white;font-weight:800}.secondary{background:#edf7fb;color:var(--ink);border:1px solid var(--line)}.card{background:white;border-radius:20px;box-shadow:var(--shadow);border:1px solid white}.panel{padding:20px;margin-bottom:16px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.head h2{margin:0}.field{display:grid;gap:6px;margin:10px 0}.field label{font-weight:800}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:white}textarea{min-height:105px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.stats,.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.stat,.q{border:1px solid var(--line);border-radius:15px;padding:14px;background:#fbfdff}.stat b{display:block;font-size:25px}.q{text-align:center}.list{display:grid;gap:9px}.item{padding:12px;border:1px solid var(--line);border-radius:14px;background:#fbfdff}.badge{padding:5px 9px;border-radius:999px;background:#e7f6fb;font-size:12px}.safe{padding:12px;background:#eaf8f1;border:1px solid #c6e6d5;border-radius:13px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.login{min-height:100vh;display:grid;grid-template-columns:1.3fr .7fr;background:#eaf5fb}.cover{min-height:100vh;background:url('cover-clean.jpg') center/cover no-repeat}.loginbox{display:grid;place-items:center;padding:28px;background:#f7fbfd}.loginbox .card{padding:28px;width:min(470px,100%)}.tabs{display:flex;background:#eaf5fa;padding:5px;border-radius:14px;margin:18px 0}.tabs button{flex:1;border:0;background:transparent;padding:10px;border-radius:10px}.tabs .on{background:white;font-weight:800}.sign{text-align:right;margin-top:20px;color:#55768a}.sign em{display:block;font:italic 28px "Brush Script MT","Segoe Script",cursive;color:#177698}.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{height:100vh;position:sticky;top:0;background:linear-gradient(#f9fdff,#eaf7fd);border-right:1px solid var(--line);padding:16px 11px;overflow:auto}.brand{font-size:22px;font-weight:900;padding:10px 12px 18px}.brand em{display:block;font:italic 21px "Brush Script MT","Segoe Script",cursive;color:#177698}.nav{width:100%;border:0;background:transparent;text-align:left;padding:10px 11px;border-radius:12px;margin:3px 0;color:var(--ink)}.nav.on,.nav:hover{background:#dff1fa;font-weight:900}.top{padding:20px 24px 44px;background:radial-gradient(circle at 14% 20%,#ffffffcc 0 9px,transparent 10px),linear-gradient(#dcf4ff,#99d8ea)}.top h1{margin:22px 0 4px}.content{padding:0 22px 40px;margin-top:-22px}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.opt{border:1px solid var(--line);border-radius:14px;padding:11px}.opt label{display:flex;gap:7px}.opt input{width:auto}.phrases{display:grid;gap:5px;margin:8px 0 0 20px}.muted{color:var(--muted);font-size:13px}@media(max-width:820px){.login{display:block}.cover{min-height:48vh}.loginbox{padding:14px}.app{display:block}.side{display:none}.content{padding:0 11px 30px}.grid2,.options{grid-template-columns:1fr}.stats,.quick{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<section id="login" class="login"><div class="cover"></div><div class="loginbox"><div class="card"><h1>親師聯絡簿</h1><p>每天一次完成功課、公告、個別聯絡與簽閱</p><div class="tabs"><button id="tt" class="on" onclick="tab('t')">教師登入</button><button id="pt" onclick="tab('p')">家長登入</button></div><div id="tl"><button class="btn" style="width:100%;margin-bottom:8px" onclick="teacher()">使用 Google 帳號登入</button><button class="btn secondary" style="width:100%" onclick="teacher()">訪客體驗</button></div><div id="pl" class="hidden"><div class="field"><label>家長帳號</label><input id="pa" value="70601"></div><div class="field"><label>密碼</label><input id="pp" type="password" value="123456"></div><button class="btn" style="width:100%" onclick="parent()">登入</button></div><div class="sign">Designed by <em>Meng</em></div></div></div></section>
<section id="teacherApp" class="app hidden"><aside class="side"><div class="brand">親師聯絡簿<em>Meng</em></div><button class="nav on" data-p="home" onclick="go('home')">首頁</button><button class="nav" data-p="daily" onclick="go('daily')">今日聯絡簿</button><button class="nav" data-p="schedule" onclick="go('schedule')">課表與功課</button><button class="nav" data-p="ann" onclick="go('ann')">統一／個別公告</button><button class="nav" data-p="students" onclick="go('students')">班級與學生</button><button class="nav" data-p="contacts" onclick="go('contacts')">親師聯繫</button><button class="nav" data-p="counsel" onclick="go('counsel')">輔導／晤談紀錄</button><button class="nav" data-p="preview" onclick="go('preview')">家長預覽</button><button class="nav" data-p="reports" onclick="go('reports')">Excel 匯入／匯出</button><button class="nav" onclick="location.reload()">登出</button></aside><main><header class="top"><select><option>115學年度・706班（六出奇技）</option></select><h1>706班（六出奇技）</h1><div>115學年度｜Meng老師</div></header><div class="content"><section id="home" class="page"></section><section id="daily" class="page hidden"></section><section id="schedule" class="page hidden"></section><section id="ann" class="page hidden"></section><section id="students" class="page hidden"></section><section id="contacts" class="page hidden"></section><section id="counsel" class="page hidden"></section><section id="preview" class="page hidden"></section><section id="reports" class="page hidden"></section></div></main></section>
<section id="parentApp" class="hidden" style="padding:16px"><div class="card panel" style="max-width:760px;margin:auto"><div class="head"><h2>今日聯絡簿</h2><button class="btn secondary" onclick="location.reload()">登出</button></div><div id="parentView"></div></div></section>
<script>
const B={"上課說話":["今日課堂中曾有與同學交談的情形，老師已於當下提醒。","今日課堂中偶有交談，提醒後已能逐步回到課程活動。"],"作業未完成":["今日作業尚未於規定時間內完成。","已提醒利用時間補齊，敬請家長協助確認後續繳交情形。"],"未帶用品":["今日課程所需用品尚未備妥，老師已協助孩子參與課程。"],"注意力較分散":["今日課堂中專注情形偶有中斷，老師已適時提醒。"],"使用手機":["今日課程進行期間曾使用手機，老師已依班級規範提醒。"],"積極參與":["今日能投入課程活動並完成任務，值得鼓勵。"]};
let D=JSON.parse(localStorage.getItem('pcb11')||'null')||{students:[{id:'s1',seat:1,name:'王小明',parent:'王媽媽',phone:'0912-000-001',account:'70601',password:'123456',adv:'高中'},{id:'s2',seat:2,name:'李小華',parent:'李爸爸',phone:'0912-000-002',account:'70602',password:'123456',adv:'高職'},{id:'s3',seat:3,name:'陳小美',parent:'陳媽媽',phone:'0912-000-003',account:'70603',password:'123456',adv:'五專'}],homework:[],ann:[],notices:[],att:[],sign:[],contacts:[],counsel:[],timetable:{}};let CP=null;const T=()=>new Date().toISOString().slice(0,10),N=()=>new Date().toLocaleString('zh-TW'),S=id=>D.students.find(x=>x.id===id),E=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function save(){localStorage.setItem('pcb11',JSON.stringify(D));render()}
function tab(x){tl.classList.toggle('hidden',x!='t');pl.classList.toggle('hidden',x!='p');tt.classList.toggle('on',x=='t');pt.classList.toggle('on',x=='p')}function teacher(){login.classList.add('hidden');teacherApp.classList.remove('hidden');render()}function parent(){CP=D.students.find(x=>x.account==pa.value&&x.password==pp.value);if(!CP)return alert('帳號或密碼不正確');login.classList.add('hidden');parentApp.classList.remove('hidden');renderParent()}function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('hidden',x.id!=p));document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('on',x.dataset.p==p));if(p=='preview')previewPage()}
function stat(a,b){return `<div class="stat"><span>${a}</span><b>${b}</b></div>`}function render(){home.innerHTML=`<div class="card panel"><div class="head"><h2>今日概況</h2><span>${T()}</span></div><div class="stats">${stat('今日公告',D.ann.filter(x=>x.today&&x.date.startsWith(T())).length)}${stat('個別聯絡',D.notices.filter(x=>x.date.startsWith(T())).length)}${stat('親師聯繫',D.contacts.filter(x=>x.date.startsWith(T())).length)}${stat('已簽閱',D.sign.filter(x=>x.date==T()).length+'/'+D.students.length)}</div></div><div class="card panel"><div class="head"><h2>今日簽閱</h2></div><div class="list">${D.students.map(s=>{let z=D.sign.find(x=>x.date==T()&&x.sid==s.id);return `<div class="item">${s.seat}號 ${E(s.name)}｜${z?'✅ '+E(z.time):'❌ 未簽閱'}</div>`}).join('')}</div></div>`;renderDaily();renderSchedule();renderAnn();renderStudents();renderContacts();renderCounsel();renderReports()}
function renderDaily(){daily.innerHTML=`<div class="card panel"><div class="head"><h2>今日聯絡簿－個別學生</h2><span class="badge">直接選座號／姓名</span></div><div class="grid2"><div class="field"><label>日期</label><input id="dDate" type="date" value="${T()}"></div><div class="field"><label>學生與家長</label><select id="dStudent">${D.students.map(s=>`<option value="${s.id}">${s.seat}號 ${E(s.name)}｜家長：${E(s.parent)}</option>`).join('')}</select></div></div><div class="safe">送出前會再次確認學生與家長姓名。</div><h3>出缺勤</h3><div class="grid2"><div class="field"><label>到校狀態</label><select id="status"><option>準時到校</option><option>遲到</option><option>未到</option><option>早退</option></select></div><div class="field"><label>請假別</label><select id="leave"><option value="">空白（表示到校）</option><option>事假</option><option>病假</option><option>喪假</option><option>未請假</option></select></div><div class="field"><label>到校時間</label><input id="arr" type="time"></div><div class="field"><label>離校／請假時間</label><input id="levt" type="time"></div><div class="field"><label>請假方式</label><select id="method"><option value="">空白（表示到校）</option><option>家長來電</option><option>家長用 LINE 通知</option><option>學生告知</option><option>因未到校聯繫告知</option></select></div></div><h3>日常表現（可多選）</h3><div class="options">${Object.entries(B).map(([k,v])=>`<div class="opt"><label><input class="bm" type="checkbox" value="${E(k)}" onchange="this.parentNode.nextElementSibling.classList.toggle('hidden',!this.checked)">${E(k)}</label><div class="phrases hidden">${v.map(p=>`<label><input class="bp" type="checkbox" value="${E(p)}">${E(p)}</label>`).join('')}</div></div>`).join('')}</div><div class="field"><label>老師關鍵字</label><input id="kw" placeholder="第二節數學課、提醒兩次、已改善"></div><div class="field"><label>家長可見文字</label><textarea id="out"></textarea></div><button class="btn secondary" onclick="gen()">產生文字</button> <button class="btn" onclick="sendDaily()">確認對象並送出</button></div>`}
function gen(){let a=[];if(kw.value.trim())a.push('觀察重點：'+kw.value.trim()+'。');document.querySelectorAll('.bm:checked').forEach(m=>{let box=m.closest('.opt'),p=[...box.querySelectorAll('.bp:checked')].map(x=>x.value);a.push(...(p.length?p:[B[m.value][0]]))});out.value=a.join('')}function sendDaily(){let s=S(dStudent.value);if(!out.value.trim())return alert('請先輸入內容');if(!confirm(`即將送給：${s.seat}號 ${s.name}
家長：${s.parent}

確定送出？`))return;D.att.push({date:dDate.value,time:N(),sid:s.id,status:status.value,leave:leave.value,arrival:arr.value,leaveTime:levt.value,method:method.value});D.notices.push({date:dDate.value+' '+new Date().toLocaleTimeString('zh-TW'),sid:s.id,content:out.value,handling:'已提醒並持續觀察'});save();alert('已送出')}
function renderSchedule(){let ds=['一','二','三','四','五'],ps=[1,2,3,4,5,6,7];schedule.innerHTML=`<div class="card panel"><div class="head"><h2>功課表</h2><button class="btn secondary" onclick="exportTT()">匯出 Excel</button></div><div class="table"><table><tr><th>節次</th>${ds.map(d=>`<th>星期${d}</th>`).join('')}</tr>${ps.map(p=>`<tr><td>第${p}節</td>${ds.map(d=>`<td><input value="${E(D.timetable[d+p]||'')}" onchange="D.timetable['${d+p}']=this.value;save()"></td>`).join('')}</tr>`).join('')}</table></div></div><div class="card panel"><div class="head"><h2>今日功課</h2></div><div class="grid2"><div class="field"><label>科目</label><input id="hs"></div><div class="field"><label>內容</label><input id="hc"></div></div><button class="btn" onclick="addHW()">發布今日功課</button><div class="list" style="margin-top:12px">${D.homework.filter(x=>x.date==T()).map(x=>`<div class="item"><b>${E(x.subject)}</b>｜${E(x.content)}</div>`).join('')||'<span class="muted">尚無功課</span>'}</div></div>`}function addHW(){if(!hs.value||!hc.value)return;D.homework.push({date:T(),subject:hs.value,content:hc.value});save()}
function renderAnn(){ann.innerHTML=`<div class="card panel"><div class="head"><h2>統一／個別公告</h2><span class="badge">Google Drive 附件</span></div><div class="grid2"><div class="field"><label>範圍</label><select id="at"><option value="all">統一公告（全班）</option>${D.students.map(s=>`<option value="${s.id}">個別：${s.seat}號 ${E(s.name)}</option>`).join('')}</select></div><div class="field"><label>日期</label><input id="ad" type="date" value="${T()}"></div></div><div class="field"><label>公告內容</label><textarea id="ac"></textarea></div><div class="grid2"><div class="field"><label>附件名稱</label><input id="af"></div><div class="field"><label>Google Drive 連結</label><input id="au"></div></div><label><input id="ashow" type="checkbox" checked style="width:auto">同步顯示在今日聯絡簿</label><br><button class="btn" onclick="addAnn()" style="margin-top:9px">發布公告</button></div>`}function addAnn(){D.ann.unshift({date:ad.value+' '+new Date().toLocaleTimeString('zh-TW'),target:at.value,text:ac.value,file:af.value,url:au.value,today:ashow.checked});save()}
function renderStudents(){students.innerHTML=`<div class="card panel"><div class="head"><h2>學生與家長資料</h2><button class="btn secondary" onclick="tpl()">下載 Excel 範本</button></div><div class="table"><table><tr><th>座號</th><th>姓名</th><th>家長</th><th>電話</th><th>升學意向</th></tr>${D.students.map(s=>`<tr><td>${s.seat}</td><td>${E(s.name)}</td><td>${E(s.parent)}</td><td>${E(s.phone)}</td><td>${E(s.adv)}</td></tr>`).join('')}</table></div></div>`}
function renderContacts(){contacts.innerHTML=`<div class="card panel"><div class="head"><h2>親師聯繫</h2><span class="badge">可轉入輔導紀錄</span></div><div class="list">${D.contacts.map(c=>`<div class="item"><b>${E(c.date)}｜${E(S(c.sid)?.name)}</b><div>${E(c.content)}</div><button class="btn secondary" onclick="toC('${c.id}')">加入輔導紀錄</button></div>`).join('')||'<span class="muted">尚無家長反應</span>'}</div></div>`}function toC(id){let c=D.contacts.find(x=>x.id==id);D.counsel.push({date:c.date.split(' ')[0],time:c.date.split(' ')[1]||'',sid:c.sid,object:'家長',content:c.content,handling:'待補充'});save()}
function renderCounsel(){counsel.innerHTML=`<div class="card panel"><div class="head"><h2>輔導／晤談紀錄</h2></div><div class="grid2"><div class="field"><label>日期</label><input id="cd" type="date" value="${T()}"></div><div class="field"><label>時間</label><input id="ct" type="time"></div><div class="field"><label>學生</label><select id="cs">${D.students.map(s=>`<option value="${s.id}">${s.seat}號 ${E(s.name)}</option>`).join('')}</select></div><div class="field"><label>晤談對象</label><select id="co"><option>學生</option><option>家長</option><option>任課老師</option><option>輔導老師</option><option>學務處</option><option>其他</option></select></div></div><div class="field"><label>內容</label><textarea id="cc"></textarea></div><div class="field"><label>處理方式</label><textarea id="ch"></textarea></div><button class="btn" onclick="addC()">儲存</button><div class="list" style="margin-top:12px">${D.counsel.map(c=>`<div class="item"><b>${E(c.date)} ${E(c.time)}｜${E(S(c.sid)?.name)}｜${E(c.object)}</b><div>${E(c.content)}</div><div class="muted">處理方式：${E(c.handling)}</div></div>`).join('')}</div></div>`}function addC(){D.counsel.push({date:cd.value,time:ct.value,sid:cs.value,object:co.value,content:cc.value,handling:ch.value});save()}
function previewPage(){preview.innerHTML=`<div class="card panel"><div class="head"><h2>家長預覽</h2><select id="pv" onchange="pvRender(this.value)">${D.students.map(s=>`<option value="${s.id}">${s.seat}號 ${E(s.name)}</option>`).join('')}</select></div><div id="pvc"></div></div>`;if(D.students[0])pvRender(D.students[0].id)}function pvRender(id){let s=S(id),hw=D.homework.filter(x=>x.date==T()),an=D.ann.filter(x=>x.today&&(x.target=='all'||x.target==id)),ns=D.notices.filter(x=>x.sid==id&&x.date.startsWith(T()));pvc.innerHTML=`<h3>${s.seat}號 ${E(s.name)}家長</h3><h4>今日功課</h4>${hw.map(x=>`<div class="item">${E(x.subject)}｜${E(x.content)}</div>`).join('')||'無'}<h4>公告</h4>${an.map(x=>`<div class="item">${E(x.text)} ${x.url?`<a target="_blank" href="${E(x.url)}">${E(x.file||'附件')}</a>`:''}</div>`).join('')||'無'}<h4>個別聯絡</h4>${ns.map(x=>`<div class="item">${E(x.content)}</div>`).join('')||'無'}<h4>親師聯繫（選填）</h4><textarea disabled></textarea><label><input type="checkbox" disabled style="width:auto">我已詳閱今日聯絡簿內容</label>`}
function renderReports(){reports.innerHTML=`<div class="card panel"><div class="head"><h2>Excel 匯出</h2></div><p>包含日期、時間、晤談對象、內容與處理方式。</p><select id="rs">${D.students.map(s=>`<option value="${s.id}">${s.seat}號 ${E(s.name)}</option>`).join('')}</select><br><button class="btn" onclick="exp([rs.value],S(rs.value).name+'_學生歷程.xlsx')" style="margin-top:9px">匯出個別學生</button> <button class="btn secondary" onclick="exp(D.students.map(x=>x.id),'全班學生歷程.xlsx')">匯出全班</button></div>`}
function exp(ids,name){let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.students.filter(x=>ids.includes(x.id))), '學生資料');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.att.filter(x=>ids.includes(x.sid)).map(x=>({'日期':x.date,'時間':x.time,'學生':S(x.sid)?.name,'到校狀態':x.status,'請假別':x.leave,'到校時間':x.arrival,'離校／請假時間':x.leaveTime,'請假方式':x.method}))), '出缺勤');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.notices.filter(x=>ids.includes(x.sid)).map(x=>({'日期時間':x.date,'學生':S(x.sid)?.name,'內容':x.content,'處理方式':x.handling}))), '個別聯絡');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(D.counsel.filter(x=>ids.includes(x.sid)).map(x=>({'日期':x.date,'時間':x.time,'學生':S(x.sid)?.name,'晤談對象':x.object,'內容':x.content,'處理方式':x.handling}))), '輔導晤談');XLSX.writeFile(wb,name)}function exportTT(){let ds=['一','二','三','四','五'];let rows=[1,2,3,4,5,6,7].map(p=>{let r={'節次':'第'+p+'節'};ds.forEach(d=>r['星期'+d]=D.timetable[d+p]||'');return r});let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'功課表');XLSX.writeFile(wb,'班級功課表.xlsx')}function tpl(){let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['座號','姓名','家長姓名','家長電話','家長地址','升學意向'],[1,'王小明','王媽媽','0912-000-000','','高中']]),'學生家長資料');XLSX.writeFile(wb,'學生家長資料範本.xlsx')}
function renderParent(){let s=CP,hw=D.homework.filter(x=>x.date==T()),an=D.ann.filter(x=>x.today&&(x.target=='all'||x.target==s.id)),ns=D.notices.filter(x=>x.sid==s.id&&x.date.startsWith(T())),sg=D.sign.find(x=>x.sid==s.id&&x.date==T());parentView.innerHTML=`<h3>${s.seat}號 ${E(s.name)}家長</h3><h4>今日功課</h4>${hw.map(x=>`<div class="item">${E(x.subject)}｜${E(x.content)}</div>`).join('')||'無'}<h4>統一／個別公告</h4>${an.map(x=>`<div class="item">${E(x.text)} ${x.url?`<a target="_blank" href="${E(x.url)}">${E(x.file||'附件')}</a>`:''}</div>`).join('')||'無'}<h4>個別聯絡</h4>${ns.map(x=>`<div class="item">${E(x.content)}</div>`).join('')||'無'}<h4>親師聯繫（選填）</h4><textarea id="pm" placeholder="有需要反應或提問時再填寫"></textarea><label><input id="ps" type="checkbox" style="width:auto" ${sg?'checked disabled':''}>我已詳閱今日聯絡簿內容</label><br><button class="btn" onclick="submitP()" ${sg?'disabled':''} style="margin-top:9px">${sg?'今日已簽閱':'送出留言並簽閱'}</button>${sg?`<div class="muted">簽閱時間：${E(sg.time)}</div>`:''}`}
function submitP(){if(!ps.checked)return alert('請先勾選已詳閱');if(pm.value.trim())D.contacts.unshift({id:'p'+Date.now(),date:N(),sid:CP.id,content:pm.value.trim()});D.sign.push({date:T(),time:N(),sid:CP.id});save();renderParent()}
render();</script></body></html>
